  <figure class="viz" id="viz-a6-fermi">
    <p class="viz-title"><span>Electron–hole pairs: the Fermi disc and its copy shifted by $\bq$</span> <span class="tag">interactive</span></p>
    <div class="viz-grid side a6-fermi-grid">
      <div class="a6-fermi-k"></div>
      <div class="legend a6-fermi-leg" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px">
        <span class="item" style="white-space:normal;display:flex;align-items:flex-start"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true" style="flex:none;vertical-align:-2px;margin:2px 6px 0 0"><circle cx="8" cy="7" r="6" style="fill:var(--c-electron);fill-opacity:0.18;stroke:var(--c-electron);stroke-width:1.5"/></svg><span>occupied states</span></span>
        <span class="item" style="white-space:normal;display:flex;align-items:flex-start"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true" style="flex:none;vertical-align:-2px;margin:2px 6px 0 0"><circle cx="8" cy="7" r="6" style="fill:none;stroke:var(--c-electron);stroke-width:1.5;stroke-dasharray:3 2.2"/></svg><span>shifted Fermi circle</span></span>
        <span class="item" style="white-space:normal;display:flex;align-items:flex-start"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true" style="flex:none;vertical-align:-2px;margin:2px 6px 0 0"><rect x="1" y="2" width="14" height="10" rx="2" style="fill:var(--c-4);fill-opacity:0.28"/></svg><span>allowed final states</span></span>
        <span class="item" style="white-space:normal;display:flex;align-items:flex-start"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true" style="flex:none;vertical-align:-2px;margin:2px 6px 0 0"><rect x="1" y="2" width="14" height="10" rx="2" style="fill:var(--c-electron);fill-opacity:0.18"/><path d="M1.5 7.5 L5.5 2.5 M4 12 L12 2 M9.5 11.5 L14.5 5" style="fill:none;stroke:var(--muted);stroke-width:1"/></svg><span>blocked: occupied</span></span>
        <span class="item" style="white-space:normal;display:flex;align-items:flex-start"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true" style="flex:none;vertical-align:-2px;margin:2px 6px 0 0"><line x1="2" y1="7" x2="14" y2="7" style="stroke:var(--c-phonon);stroke-width:4"/></svg><span>pairs with energy $\hbar\omega$</span></span>
        <span class="item" style="white-space:normal;display:flex;align-items:flex-start"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true" style="flex:none;vertical-align:-2px;margin:2px 6px 0 0"><circle cx="8" cy="7" r="3.6" style="fill:var(--fg)"/></svg><span>zero-energy pairs</span></span>
        <span class="item a6-fermi-leg-arr" style="white-space:normal;grid-column:1 / -1">0<svg width="46" height="10" viewBox="0 0 46 10" aria-hidden="true" style="vertical-align:-1px;margin:0 4px"><defs><linearGradient id="a6-fermi-grad" x1="0" x2="1" y1="0" y2="0"><stop offset="0"/><stop offset="0.25"/><stop offset="0.5"/><stop offset="0.75"/><stop offset="1"/></linearGradient></defs><rect x="0" y="1" width="46" height="8" rx="2" fill="url(#a6-fermi-grad)"/></svg>$3E_{\mathrm F}$: pair energy of an arrow $\bk\to\bk+\bq$; grey arrow: blocked</span>
      </div>
      <div class="a6-fermi-map"></div>
    </div>
    <div class="a6-fermi-ctrls"></div>
    <div class="readout a6-fermi-ro" aria-live="polite"><span>$(q/k_{\mathrm F},\ \hbar\omega/E_{\mathrm F})$<b class="a6-fermi-v-pt"></b></span><span>the phonon is<b class="a6-fermi-v-where"></b></span><span>$\hbar\omega^{\min}/E_{\mathrm F},\ \hbar\omega^{\max}/E_{\mathrm F}$<b class="a6-fermi-v-edges"></b></span><span>zero-energy pairs<b class="a6-fermi-v-n0"></b></span></div>
    <div class="readout a6-fermi-ro2" aria-live="polite"><span>$L_{\mathrm{res}}/k_{\mathrm F}$<b class="a6-fermi-v-L"></b></span><span>$\mathrm{Im}\,\chi^0$ in units of $N_{\mathrm F}/\OS$, <a class="eqref" href="#a6-eq-chord">(A6.22)</a><b class="a6-fermi-v-chi"></b></span><span>small-$\omega$ form <a class="eqref" href="#a6-eq-imchi">(A6.23)</a><b class="a6-fermi-v-chi0"></b></span></div>
    <figcaption><p class="cap-key"><strong>What to notice.</strong> A phonon of wavevector $\bq$ and energy $\hbar\omega$ can create only the pairs on the dashed line inside the crescent, and $\mathrm{Im}\,\chi^0$ is proportional to the length of that part. Above $\hbar\omega^{\max}$ the line misses the crescent and the phonon cannot decay. Pairs of zero energy, the dots, exist only while the circles cross, up to <span class="nw">$q=2k_{\mathrm F}$.</span></p><div class="cap-more">
      <p><strong>Marks.</strong> (a) Blue disc: occupied states; dashed circle: the Fermi circle shifted by <span class="nw">$\bq$;</span> teal crescent: allowed final states; hatched lens: Pauli-blocked. Arrows $\bk\to\bk+\bq$ from sample states: coloured by energy <a class="eqref" href="#a6-eq-pair">(A6.20)</a>, grey when blocked. Dashed amber line: final states of the pairs with energy <span class="nw">$\hbar\omega$;</span> bold: its allowed part, of length <a class="sym" href="#gl-a6-Lres">$L_{\mathrm{res}}$</a>. (b) Teal: the continuum <a class="eqref" href="#a6-eq-edges">(A6.21)</a>; dashed: <span class="nw">$\hbar v_{\mathrm F}q$;</span> amber marker: the chosen <span class="nw">$(q,\hbar\omega)$,</span> filled inside the continuum.</p>
      <p><strong>Try.</strong> At fixed <span class="nw">$\hbar\omega$,</span> lower $q$ until the bold segments vanish: the phonon leaves the continuum. Set $\hbar\omega$ near 0 and move $q$ through <span class="nw">$2k_{\mathrm F}$:</span> the dots merge and vanish, and $\mathrm{Im}\,\chi^0$ grows as they approach. Drag the tip of $\bq$ or the dashed line in (a), or click in (b).</p>
      <p><strong>Model.</strong> One two-dimensional parabolic band at zero temperature, $\bq$ along <span class="nw">$x$;</span> wavevectors in units of <span class="nw">$k_{\mathrm F}$,</span> energies in units of <span class="nw">$E_{\mathrm F}$.</span> By <a class="eqref" href="#a6-eq-pair">(A6.20)</a> the final states of energy $\hbar\omega$ lie on <span class="nw">$k_x=q/2+m^*\omega/\hbar q$.</span> The readouts are <a class="eqref" href="#a6-eq-chord">(A6.22)</a>, with <a class="sym" href="#gl-a6-NF">$N_{\mathrm F}/\OS=m^*/2\pi\hbar^2$</a> the density of states per spin and unit area, and its small-$\omega$ limit <a class="eqref" href="#a6-eq-imchi">(A6.23)</a>. The doped sheet of <a class="figref" href="#viz-a6-window">Figure A6.4</a> and the Kohn anomaly of <a class="figref" href="#viz-a6-kohn">Figure A6.5</a> use the same geometry.</p>
    </div></figcaption>
  </figure>
<script>
(() => {
  const fig = document.getElementById('viz-a6-fermi');
  if (!fig || !window.EPP) return;
  // outside Section A.6 (the isolated figure test) the links into the section have no target: keep their text
  if (!fig.closest('#a-phonon-se')) fig.querySelectorAll('a[href^="#"]').forEach(a => {
    if (document.getElementById(a.getAttribute('href').slice(1))) return;
    const s = document.createElement('span'); s.append(...a.childNodes); a.replaceWith(s);
  });

  // ---------- model ----------
  // One parabolic band in two dimensions at T = 0, pairs k -> k + q within the band, q along +x.
  // Reduced units: wavevectors in k_F, energies in E_F = ħ²k_F²/2m*; below, q = q/k_F and w = ħω/E_F.
  // Pair energy (A6.20): (E_{k+q} − E_k)/E_F = 2 k_x q + q². The final states k + q of the pairs with energy w lie on the
  // line k_x = c = q/2 + w/2q, their initial states on k_x = c − q (= k*/k_F). A final state is allowed inside the disc
  // shifted by q and outside the Fermi disc, so the allowed part of the line has the length
  // L_res/k_F = 2[(1 − (c − q)²)^{1/2} − max(0, 1 − c²)^{1/2}], and (A6.22) gives Im χ⁰ = −L/q in units of N_F/Ω_S.
  // Edges (A6.21): w_max = q² + 2q, w_min = max(0, q² − 2q). Zero-energy pairs: (q/2, ±(1 − q²/4)^{1/2}) for q < 2.
  const TAU = 2 * Math.PI;
  const XR = [-1.6, 4.4], YR = [-2.2, 2.2];        // frame of (a), units of k_F
  const QMIN = 0.05, QMAX = 3, WTOP = 2.5;          // slider ranges
  const ESC = 3;                                     // colour scale of the arrows: pair energy 0 to 3 E_F
  const TOUCH = 0.005;                               // |q/k_F − 2| below this: the circles touch
  const RAD = 205 * Math.PI / 180;                   // direction of the drawn radius k_F
  // sample occupied states k (units of k_F): one per row, |k_y| ≥ 0.48 so that q and its label keep the middle; at the
  // initial q = 0.8 k_F three land in the crescent, three in the lens, and none touches a dot or a bold segment
  const SAMPLES = [[-0.52, 0.8], [0.3, 0.64], [-0.8, 0.48], [0.82, -0.48], [0.55, -0.64], [-0.56, -0.8]];

  function model(q, w) {
    const c = q / 2 + w / (2 * q), ks = c - q;
    const wmax = q * q + 2 * q, wmin = Math.max(0, q * q - 2 * q);
    const hs = Math.abs(ks) < 1 ? Math.sqrt(1 - ks * ks) : 0;   // half chord of the shifted disc on the line
    const hf = c < 1 ? Math.sqrt(1 - c * c) : 0;                 // half chord of the Fermi disc on the line
    let L = 0, segs = [];
    if (Math.abs(ks) < 1 && hs > hf + 1e-12) { L = 2 * (hs - hf); segs = hf > 0 ? [[hf, hs], [-hs, -hf]] : [[-hs, hs]]; }
    const eps = 1e-9;
    let where;
    if (w >= wmax - eps) where = w <= wmax + eps ? 'upper' : 'above';
    else if (q > 2 && w <= wmin + eps) where = w >= wmin - eps ? 'lower' : 'below';
    else if (w <= eps) where = 'zero';
    else where = 'inside';
    if (where !== 'inside') { L = 0; segs = []; }                 // on an edge no rounding sliver survives
    const n0 = q < 2 - TOUCH ? 2 : (q <= 2 + TOUCH ? 1 : 0);
    const chiSmall = where === 'inside' && q < 2 ? -w / (q * Math.sqrt(1 - q * q / 4)) : NaN;
    return { q, w, c, ks, wmax, wmin, hs, hf, L, segs, where, n0, chi: -L / q, chiSmall };
  }

  // ---------- canvas text in the primer's notation ----------
  // Outside $…$ the text is upright. Inside, letters are italic; !x is a bold upright vector; [..] is upright
  // (a label such as F or max); _x, _{..}, ^x, ^{..} are sub- and superscripts.
  const ITAL = /[A-Za-zα-ωħ]/;
  function lex(s) {
    const out = [];
    let math = false;
    const add = (t, it, b, lvl) => { const p = out[out.length - 1]; if (p && p.it === it && p.b === b && p.lvl === lvl) p.t += t; else out.push({ t, it, b, lvl }); };
    const scan = (str, lvl) => {
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch === '$') { math = !math; continue; }
        if ((ch === '_' || ch === '^') && i + 1 < str.length) {
          const L = ch === '_' ? -1 : 1;
          if (str[i + 1] === '{') { const k = str.indexOf('}', i + 2); scan(str.slice(i + 2, k < 0 ? str.length : k), L); i = k < 0 ? str.length : k; }
          else { scan(str[i + 1], L); i += 1; }
          continue;
        }
        if (math && ch === '!' && i + 1 < str.length) { add(str[i + 1], false, true, lvl); i += 1; continue; }
        if (math && ch === '[') { const k = str.indexOf(']', i + 1); add(str.slice(i + 1, k < 0 ? str.length : k), false, false, lvl); i = k < 0 ? str.length : k; continue; }
        add(ch, math && ITAL.test(ch), false, lvl);
      }
    };
    scan(String(s), 0);
    return out;
  }
  // draws with the baseline at y; returns the width
  function txt(ctx, s, x, y, o = {}) {
    const size = o.size || 11.5, fam = EPP.css('--font-ui'), rs = lex(s);
    const zs = (r) => (r.lvl ? Math.round(size * 0.72) : size);
    const font = (r) => `${r.it ? 'italic ' : ''}${r.b ? '700 ' : ''}${zs(r)}px ${fam}`;
    const ws = rs.map(r => { ctx.font = font(r); return ctx.measureText(r.t).width; });
    const tot = ws.reduce((a, b) => a + b, 0);
    if (o.measure) return tot;
    let x0 = o.align === 'center' ? x - tot / 2 : (o.align === 'right' ? x - tot : x);
    ctx.save();
    if (o.color) ctx.fillStyle = o.color;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    rs.forEach((r, k) => { ctx.font = font(r); ctx.fillText(r.t, x0, y + (r.lvl === -1 ? size * 0.28 : (r.lvl === 1 ? -size * 0.38 : 0))); x0 += ws[k]; });
    ctx.restore();
    return tot;
  }
  const tw = (ctx, s, size) => txt(ctx, s, 0, 0, { size, measure: true });
  const tick = (v) => (v < 0 ? '−' + (-v) : String(v));
  function arrow(ctx, x0, y0, x1, y1, col, lw, head) {
    const L = Math.hypot(x1 - x0, y1 - y0);
    if (L < 2) return;
    const hs = Math.min(head, 0.55 * L), a = Math.atan2(y1 - y0, x1 - x0);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - 0.8 * hs * Math.cos(a), y1 - 0.8 * hs * Math.sin(a)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - hs * Math.cos(a - 0.42), y1 - hs * Math.sin(a - 0.42));
    ctx.lineTo(x1 - hs * Math.cos(a + 0.42), y1 - hs * Math.sin(a + 0.42));
    ctx.closePath(); ctx.fill();
  }
  // colour of an arrow of pair energy t·3E_F: one hue (violet), light to dark on the light theme, the reverse on the dark
  const mix = (a, b, t) => [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
  function eCol(t) {
    const S = EPP.rgb('--surface'), V = EPP.rgb('c5'), F = EPP.rgb('--fg');
    const u = 0.55 + 0.45 * EPP.clamp(t, 0, 1);
    const c = u <= 0.78 ? mix(S, V, u / 0.78) : mix(V, F, (u - 0.78) / 0.22 * 0.42);
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  // label placer: the first candidate centre whose box stays in bounds and clears the obstacles and the labels already
  // placed (and passes an optional region test); an optional leader joins the label to the point it names. Soft
  // obstacles (the sample arrows) are avoided where possible and covered, on the label's backing, where not.
  function placer(ctx, bounds) {
    const obs = [], soft = [], labs = [];
    const hit = (a, b, g) => a[0] < b[2] + g && a[2] > b[0] - g && a[1] < b[3] + g && a[3] > b[1] - g;
    const along = (list, x0, y0, x1, y1, r) => { const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 4)); for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n; list.push([x - r, y - r, x + r, y + r]); } };
    return {
      box(x0, y0, x1, y1) { obs.push([Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)]); },
      seg(x0, y0, x1, y1, r) { along(obs, x0, y0, x1, y1, r); },
      soft(x0, y0, x1, y1, r) { along(soft, x0, y0, x1, y1, r); },
      put(s, o, cands) {
        const size = o.size || 11.5, w = tw(ctx, s, size), h = size + 4;
        const ok = (b, useSoft) => !(b[0] < bounds[0] || b[1] < bounds[1] || b[2] > bounds[2] || b[3] > bounds[3]) && !obs.some(x => hit(b, x, 0))
          && !labs.some(x => hit(b, x, 3)) && !(useSoft && soft.some(x => hit(b, x, 0))) && !(o.test && !o.test(b));
        const boxOf = (c) => [c[0] - w / 2 - 3, c[1] - h / 2, c[0] + w / 2 + 3, c[1] + h / 2];
        let c = cands.find(cc => ok(boxOf(cc), true));
        if (!c && !o.strict) c = cands.find(cc => ok(boxOf(cc), false));
        if (c) {
          const b = boxOf(c);
          labs.push(b);
          if (c.lead) {
            const px = EPP.clamp(c.lead[0], b[0], b[2]), py = EPP.clamp(c.lead[1], b[1], b[3]), d = Math.hypot(c.lead[0] - px, c.lead[1] - py);
            if (d > 7) {
              const ux = (c.lead[0] - px) / d, uy = (c.lead[1] - py) / d;
              ctx.save(); ctx.strokeStyle = o.leadColor || EPP.alpha('muted', 0.9); ctx.lineWidth = 1; ctx.setLineDash([]);
              ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(c.lead[0] - ux * 3, c.lead[1] - uy * 3); ctx.stroke(); ctx.restore();
            }
          }
          if (o.bg) { ctx.fillStyle = EPP.alpha('surface', 0.86); ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(b[0], b[1], b[2] - b[0], b[3] - b[1], 3); else ctx.rect(b[0], b[1], b[2] - b[0], b[3] - b[1]); ctx.fill(); }
          txt(ctx, s, c[0], c[1] + size * 0.36, { size, color: o.color, align: 'center' });
          return b;
        }
        return null;
      }
    };
  }
  const C = (x, y, lead) => { const c = [x, y]; if (lead) c.lead = lead; return c; };

  // ---------- layout: (a), its legend, (b); on wide screens (a) spans both rows of the left column ----------
  const elA = fig.querySelector('.a6-fermi-k'), elLeg = fig.querySelector('.a6-fermi-leg'), elB = fig.querySelector('.a6-fermi-map');
  elLeg.style.alignSelf = 'start'; elLeg.style.marginTop = '0';
  const wideMQ = matchMedia('(min-width: 720px)');
  const arrange = () => {
    const wd = wideMQ.matches;
    elA.style.gridRow = wd ? '1 / span 2' : ''; elA.style.gridColumn = wd ? '1' : '';
    elB.style.gridRow = wd ? '1' : ''; elB.style.gridColumn = wd ? '2' : '';
    elLeg.style.gridRow = wd ? '2' : ''; elLeg.style.gridColumn = wd ? '2' : '';
  };
  arrange();
  try { wideMQ.addEventListener('change', arrange); } catch (e) {}

  let cur = null, arrowsOn = true, A = null;

  // ---------- (a) the wavevector plane ----------
  const cvA = EPP.canvas(elA, { aspect: 0.8, minHeight: 250, maxHeight: 430 });
  cvA.canvas.setAttribute('role', 'img');
  function drawA() {
    const cv = cvA, ctx = cv.ctx, W = cv.w, H = cv.h;
    cv.clear();
    if (!cur || W < 80) return;
    const { q, c, segs, n0 } = cur;
    const m = { l: 42, r: 8, t: 26, b: 40 };
    const s = Math.min((W - m.l - m.r) / (XR[1] - XR[0]), (H - m.t - m.b) / (YR[1] - YR[0]));
    const pw = s * (XR[1] - XR[0]), ph = s * (YR[1] - YR[0]);
    const fx0 = m.l + Math.max(0, (W - m.l - m.r - pw) / 2), fy0 = m.t + Math.max(0, (H - m.t - m.b - ph) / 2), fx1 = fx0 + pw, fy1 = fy0 + ph;
    const X = (x) => fx0 + (x - XR[0]) * s, Y = (y) => fy0 + (YR[1] - y) * s;
    A = { X, Y, invX: (px) => XR[0] + (px - fx0) / s, invY: (py) => YR[1] - (py - fy0) / s };
    const cFg = EPP.color('fg'), cFg2 = EPP.color('fg2'), cMu = EPP.color('muted'), cGrid = EPP.color('grid'), cRule = EPP.color('rule');
    const cEl = EPP.color('electron'), cPh = EPP.color('phonon'), cSurf = EPP.color('surface');
    const tPh = EPP.textColor('phonon'), t4 = EPP.textColor('c4');
    // grid, frame, ticks and axis titles
    ctx.strokeStyle = cGrid; ctx.lineWidth = 1; ctx.beginPath();
    for (let v = -1; v <= 4; v++) { const x = Math.round(X(v)) + 0.5; ctx.moveTo(x, fy0); ctx.lineTo(x, fy1); }
    for (let v = -2; v <= 2; v++) { const y = Math.round(Y(v)) + 0.5; ctx.moveTo(fx0, y); ctx.lineTo(fx1, y); }
    ctx.stroke();
    ctx.strokeStyle = cRule; ctx.strokeRect(fx0 + 0.5, fy0 + 0.5, pw - 1, ph - 1);
    for (let v = -1; v <= 4; v++) txt(ctx, tick(v), X(v), fy1 + 15, { size: 11, color: cMu, align: 'center' });
    for (let v = -2; v <= 2; v++) txt(ctx, tick(v), fx0 - 6, Y(v) + 4, { size: 11, color: cMu, align: 'right' });
    txt(ctx, '$k_x$/$k_{[F]}$', (fx0 + fx1) / 2, H - 8, { size: 12.5, color: cFg, align: 'center' });
    ctx.save(); ctx.translate(fx0 - 30, (fy0 + fy1) / 2); ctx.rotate(-Math.PI / 2);
    txt(ctx, '$k_y$/$k_{[F]}$', 0, 0, { size: 12.5, color: cFg, align: 'center' });
    ctx.restore();
    txt(ctx, '(a) wavevector plane', 2, 14, { size: 11.5, color: cFg2 });

    const O = [X(0), Y(0)], Q = [X(q), Y(0)];
    ctx.save(); ctx.beginPath(); ctx.rect(fx0, fy0, pw, ph); ctx.clip();
    // allowed final states: the shifted disc minus the Fermi disc
    ctx.save();
    ctx.beginPath(); ctx.arc(Q[0], Q[1], s, 0, TAU); ctx.clip();
    ctx.beginPath(); ctx.rect(fx0, fy0, pw, ph); ctx.arc(O[0], O[1], s, 0, TAU, true);
    ctx.fillStyle = EPP.alpha('c4', 0.24); ctx.fill('evenodd');
    ctx.restore();
    // occupied states
    ctx.beginPath(); ctx.arc(O[0], O[1], s, 0, TAU); ctx.fillStyle = EPP.alpha('electron', 0.15); ctx.fill();
    // blocked final states: the overlap of the two discs, hatched (the hatch is fixed to the frame, so it does not swim)
    if (q < 2) {
      ctx.save();
      ctx.beginPath(); ctx.arc(O[0], O[1], s, 0, TAU); ctx.clip();
      ctx.beginPath(); ctx.arc(Q[0], Q[1], s, 0, TAU); ctx.clip();
      ctx.strokeStyle = EPP.alpha('muted', 0.6); ctx.lineWidth = 1; ctx.beginPath();

    ui.set('w', EPP.clamp(pB.invY(py), 0, WTOP));
    return true;
  });
  pB.cv.canvas.style.cursor = 'crosshair';

  update(ui.state);
})();
</script>
