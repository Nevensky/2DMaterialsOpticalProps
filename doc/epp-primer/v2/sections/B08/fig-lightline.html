  <figure class="viz" id="viz-b8-lightline">
    <p class="viz-title">LO and TO coupling across the light line <span class="tag">interactive</span></p>
    <div class="viz-grid two"><div class="b8-lightline-a"><div class="legend b8-lightline-leg-a"><span class="item" style="color:var(--c-5)"><span class="sw dash" style="border-top-width:4.5px;opacity:0.55"></span><span style="color:var(--fg-2)">LO, free line, $|\mathcal K^0_{\mathrm{LO}}|$</span></span><span class="item" style="color:var(--c-5)"><span class="sw" style="border-top-width:4.5px;opacity:0.55"></span><span style="color:var(--fg-2)">LO, dressed line, $|\mathcal K_{\mathrm{LO}}|$</span></span><span class="item" style="color:var(--c-photon)"><span class="sw dash"></span><span style="color:var(--fg-2)">TO, free line, $|\mathcal K^0_{\mathrm{TO}}|$</span></span><span class="item" style="color:var(--c-photon)"><span class="sw"></span><span style="color:var(--fg-2)">TO, dressed line, $|\mathcal K_{\mathrm{TO}}|$</span></span><span class="item b8-lightline-leg-grid" style="color:var(--muted)"><span class="sw box"></span><span style="color:var(--fg-2)">wavevector grids</span></span></div></div><div class="b8-lightline-b"><div class="legend b8-lightline-leg-b"><span class="item" style="color:var(--c-5)"><span class="sw dash"></span><span style="color:var(--fg-2)">bare, $|g^{\mathrm{dyn},0}|$</span></span><span class="item" style="color:var(--c-5)"><span class="sw"></span><span style="color:var(--fg-2)">screened, $|g^{\mathrm{dyn}}|$ (Verdi–Giustino)</span></span><span class="item" style="color:var(--muted)"><span class="sw dot"></span><span style="color:var(--fg-2)">Fröhlich's formula</span></span><span class="item" style="color:var(--c-photon)"><span class="sw box"></span><span style="color:var(--fg-2)">light cone at $\omega_{\mathrm{LO}}$</span></span></div></div></div>
    <div class="b8-lightline-ctrls"></div>
    <div class="readout b8-lightline-ro" aria-live="polite"><span>$q_{\mathrm{light}}=\sqrt{\varepsilon_\infty}\,\omega_{\mathrm{TO}}/c$<b class="b8-lightline-v-qc"></b></span><span>$|\mathcal K_{\mathrm{TO}}/\mathcal K_{\mathrm{LO}}|$ at $q=10^{-3}$ Å⁻¹<b class="b8-lightline-v-ratio"></b></span></div>
    <div class="readout b8-lightline-ro2" aria-live="polite"><span>$|g^{\mathrm{dyn}}|$ at $q=0.1$ Å⁻¹<b class="b8-lightline-v-g"></b></span><span>Fröhlich's $|g|$ at $q=0.1$ Å⁻¹<b class="b8-lightline-v-fr"></b></span><span>$|g^{\mathrm{dyn},0}/g^{\mathrm{dyn}}|=\varepsilon_\infty$<b class="b8-lightline-v-eps"></b></span></div>
    <figcaption><p class="cap-key"><strong>What to notice.</strong> The LO kernel is flat: the Coulomb line never feels the finite speed of light, so the Fröhlich $1/q$ in (b) runs straight through the light cone. The TO kernel equals the LO one deep inside the cone, peaks at the light line $q_{\mathrm{light}}$ and falls as $(q_{\mathrm{light}}/q)^2$ outside.</p><div class="cap-more">
      <p><strong>Marks.</strong> (a) Dashed: the free line $D^0$ (bare vertex); solid: the dressed line $D^{\rme}$ (screened vertex). Broad violet: LO; thin magenta: TO, drawn over LO where they agree. Vertical lines: the light line in vacuum, $\omega/c$, and in the medium, $q_{\mathrm{light}}$, at $\omega=\omega_{\mathrm{TO}}$. Grey band: $10^{-3}$ to <span class="nw">1 Å⁻¹,</span> a generous range for transport grids. (b) Dashed: bare vertex; solid: screened vertex, the Verdi–Giustino one; dotted, almost on it: Fröhlich's formula. Shaded: the light cone of the LO phonon, <span class="nw">$q\lt\sqrt{\varepsilon_\infty}\,\omega_{\mathrm{LO}}/c$.</span></p>
      <p><strong>Try.</strong> Raise the speed of light by $10^4$: $q_{\mathrm{light}}$ leaves the frame and the TO kernel vanishes at every grid wavevector, while the LO lines and the vertex in (b) stay put. Switch the axis to $q/q_{\mathrm{light}}$: the resonance has one shape at every speed of light. Lower the loss to sharpen the peaks.</p>
      <p><strong>Model.</strong> (a): <a class="eqref" href="#b8-eq-ratio">(B8.19)</a> at $\omega=\omega_{\mathrm{TO}}$ with $\varepsilon=\varepsilon_\infty+\ii\varepsilon_2$; for the free line the loss is a numerical broadening. (b): <a class="eqref" href="#b8-eq-bare">(B8.15)</a> and <a class="eqref" href="#b8-eq-static">(B8.16)</a> with $\boldsymbol\varepsilon^{\rme}\to\varepsilon_\infty$ at leading order in $q$ (eigenvectors and basis phases at $\bq\to0$, plane-wave matrix element 1, $\omega_{\mathrm{LO}}$ in the zero-point amplitude), and Fröhlich's formula <a class="eqref" href="#a4-eq-frohlich">(A4.15)</a>. The TO vertex has no universal form: it needs the transverse current matrix elements of the bands. Data: <a href="#a-polar">Section A.4</a> (literature values, illustrative).</p>
    </div></figcaption>
  </figure>
<script>
(() => {
  const fig = document.getElementById('viz-b8-lightline');
  if (!fig || !window.EPP) return;
  // Gaussian units, energies in eV and lengths in Å: 4πe² = 180.95 eV Å, ħc = 1973.27 eV Å,
  // and the zero-point amplitude squared ħ/(2Mω) = 2.0901 Å² / (M[amu] ħω[meV])
  const FPE2 = 180.95, HC = 1973.27, ZP = 2.0901;
  // Section A.4 data (literature values, illustrative): ε∞, ε_s; ħω_LO, ħω_TO (meV); Ω_V (Å³); Z* (dimensionless); M_r (amu)
  const MAT = {
    GaAs: { einf: 10.9, es: 12.9, wLO: 36.2, wTO: 33.3, OV: 45.2, Z: 2.07, Mr: 36.1 },
    MgO: { einf: 2.96, es: 9.8, wLO: 89.0, wTO: 49.1, OV: 18.7, Z: 1.98, Mr: 9.65 },
    NaCl: { einf: 2.34, es: 5.9, wLO: 32.7, wTO: 20.3, OV: 44.9, Z: 1.12, Mr: 13.9 }
  };
  // fixed axes: (a) q in Å⁻¹ or q/q_c, |𝒦| dimensionless; (b) q in Å⁻¹, |g| in eV. Grid band of (a) in Å⁻¹.
  const QA = [1e-8, 1], QN = [1e-3, 1e3], KY = [1e-6, 1e4], QB = [1e-6, 1], GY = [1e-2, 1e6], GRID = [1e-3, 1];
  const logspace = (a, b, n) => EPP.linspace(Math.log10(a), Math.log10(b), n).map(v => Math.pow(10, v));
  const BASE = { a: logspace(QA[0], QA[1], 480), n: logspace(QN[0], QN[1], 420) }, QBX = logspace(QB[0], QB[1], 160);
  // extra samples around each light-line resonance, in units of its relative half width ε₂/2ε∞
  const CL = [0];
  [0.15, 0.3, 0.5, 0.7, 0.85, 1, 1.2, 1.5, 2, 2.6, 3.4, 4.5, 6, 8, 11, 15, 21, 30, 45, 70].forEach(t => CL.push(t, -t));

  // ---- physics ----
  // kernels at ω = ω_TO as functions of u = q/(ω/c), from (B8.19) with ε = ε∞ + iε₂ and loss = ε₂/ε∞:
  // |𝒦_TO| = 1/|ε∞ + iε₂ − u²|, |𝒦⁰_TO| = 1/|1 + i loss − u²| (a numerical broadening), |𝒦_LO| = 1/|ε∞ + iε₂|, |𝒦⁰_LO| = 1
  const kTO = (u, e, loss) => 1 / Math.hypot(e - u * u, e * loss);
  const kTO0 = (u, loss) => 1 / Math.hypot(1 - u * u, loss);
  const kLO = (e, loss) => 1 / (e * Math.hypot(1, loss));
  function compute(s) {
    const m = MAT[s.mat] || MAT.GaAs, e = m.einf, se = Math.sqrt(e), loss = s.loss, cf = s.c, norm = s.axis === 'n';
    const qv = m.wTO / 1000 / (HC * cf);              // ω_TO/c (Å⁻¹), with c → (factor)·c
    const qc = se * qv;                               // q_c = √ε∞ ω_TO/c
    const qLO = se * m.wLO / 1000 / (HC * cf);        // light cone of the LO phonon, √ε∞ ω_LO/c
    const xl = norm ? QN : QA;
    const toU = norm ? (x => x * se) : (x => x / qv), fromU = norm ? (u => u / se) : (u => u * qv);
    const xs = BASE[norm ? 'n' : 'a'].slice();
    for (const up of [1, se]) for (const t of CL) { const x = fromU(up * (1 + 0.5 * loss * t)); if (x > xl[0] && x < xl[1]) xs.push(x); }
    xs.sort((a, b) => a - b);
    const K0T = xs.map(x => kTO0(toU(x), loss)), KT = xs.map(x => kTO(toU(x), e, loss));
    const u3 = 1e-3 / qv, ratio = kTO(u3, e, loss) / kLO(e, loss);
    // LO vertex at leading order in q (eigenvectors at q → 0, phases 1, plane-wave matrix element 1), times q (eV Å⁻¹):
    // bare (B8.15) 4πe² Z* (ħ/2M_r ω_LO)^{1/2} / Ω_V; screened (B8.16) the same over ε∞; Fröhlich (A4.15)
    const zp = Math.sqrt(ZP / (m.Mr * m.wLO));        // (ħ/2M_r ω_LO)^{1/2}, Å
    const Gb = FPE2 / m.OV * m.Z * zp, Gs = Gb / e;
    const Gf = Math.sqrt(FPE2 / m.OV * (m.wLO / 2000) * (1 / e - 1 / m.es));
    return { mat: s.mat, m, e, se, loss, cf, norm, qv, qc, qLO, xl, toU, xs, K0T, KT, KL: kLO(e, loss), ratio, Gb, Gs, Gf,
      xW: norm ? 1 / se : qv, xC: norm ? 1 : qc };
  }

  // ---- number formats: a×10ⁿ outside 0.01…9999, a true minus sign ----
  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  const sup = (n) => String(n).split('').map(ch => SUP[ch] || ch).join('');
  function sci(v, d = 3) {
    if (!isFinite(v)) return '—';
    if (v === 0) return '0';
    let e = Math.floor(Math.log10(Math.abs(v)));
    if (e >= -2 && e <= 3) return String(Number(v.toPrecision(d))).replace('-', '−');
    let mant = v / Math.pow(10, e);
    if (Math.abs(Number(mant.toFixed(d - 1))) >= 10) { mant /= 10; e += 1; }
    return mant.toFixed(d - 1).replace('-', '−') + '×10' + sup(e);
  }
  const say = (v, d = 3) => sci(v, d).replace('−', 'minus ').replace(/×10([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/, (_, p) => ' times 10 to the ' + p.split('').map(ch => Object.keys(SUP).find(k => SUP[k] === ch)).join('').replace('-', 'minus '));
  // the speed-of-light factor: powers of ten exactly, else two digits
  function cfmt(v) {
    const r = Math.round(Math.log10(v) * 100) / 100;
    if (Math.abs(r - Math.round(r)) < 1e-9) return '×' + (r <= 3 ? String(Math.pow(10, Math.round(r))) : '10' + sup(Math.round(r)));
    const p = Math.pow(10, r);
    return '×' + (p < 1e4 ? String(Number(p.toPrecision(2))) : sci(p, 2));
  }
  const lfmt = (v) => String(Number(v.toPrecision(2)));

  // ---- canvas text: '$..$' marks math, whose letters (Latin, Greek, ħ) are italic in the text font;
  //      _x, _{..}, ^x as in EPP.drawRich, so a subscript written outside '$' stays upright: '$q$_c' ----
  const ITAL = /[A-Za-zα-ωħ]/;
  let FT = '', FU = '';
  function runs(s) {
    const out = [];
    String(s).split('$').forEach((seg, i) => {
      for (const p of EPP.parseRich(seg)) {
        if (i % 2 === 0) { out.push({ t: p.t, m: p.m, it: false }); continue; }
        let buf = '', it = null;
        for (const ch of p.t) {
          const k = ITAL.test(ch);
          if (it !== null && k !== it) { out.push({ t: buf, m: p.m, it }); buf = ''; }
          buf += ch; it = k;
        }
        if (buf) out.push({ t: buf, m: p.m, it });
      }
    });
    return out;
  }
  const runFont = (r, size) => { const sz = r.m ? Math.round(size * 0.72) : size; return r.it ? `italic ${sz + 1}px ${FT}` : `${sz}px ${FU}`; };
  function rich(ctx, s, x, y, o = {}) {
    const size = o.size || 11.5, rs = runs(s);
    // a little air after an italic letter followed by upright text (italic correction)
    const ws = rs.map((r, k) => { ctx.font = runFont(r, size); const nx = rs[k + 1]; return ctx.measureText(r.t).width + (r.it && nx && !nx.it && nx.m !== -1 ? 0.1 * size : 0); });
    const tot = ws.reduce((a, b) => a + b, 0);
    if (o.measure) return tot;
    let x0 = o.align === 'center' ? x - tot / 2 : (o.align === 'right' ? x - tot : x);
    if (o.color) ctx.fillStyle = o.color;
    const ta = ctx.textAlign; ctx.textAlign = 'left';
    rs.forEach((r, k) => { ctx.font = runFont(r, size); ctx.fillText(r.t, x0, y + (r.m === -1 ? size * 0.28 : (r.m === 1 ? -size * 0.38 : 0))); x0 += ws[k]; });
    ctx.textAlign = ta;
    return tot;
  }
  const fit = (ctx, texts, size, room) => texts.find(t => rich(ctx, t, 0, 0, { size, measure: true }) <= room) || texts[texts.length - 1];
  // HTML text: italic symbols in the hover tips and the control labels
  const I = (s) => `<i style="font-family:var(--font-text)">${s}</i>`;

  // ---- the two plots ----
  const tick = (e, lab = true) => ({ v: Math.pow(10, e), label: !lab ? '' : (e >= -2 && e <= 2 ? String(Math.pow(10, e)) : `10^{${e < 0 ? '−' + (-e) : e}}`) });
  const decades = (a, b, every = 1) => { const o = []; for (let e = a; e <= b; e++) o.push(tick(e, e % every === 0)); return o; };
  const XT_A = decades(-8, 0, 2), XT_N = decades(-3, 3), YT_A = decades(-6, 4, 2), XT_B = decades(-6, 0), YT_B = decades(-2, 6, 2);
  const elA = fig.querySelector('.b8-lightline-a'), elB = fig.querySelector('.b8-lightline-b');
  const opt = { logx: true, logy: true, legend: false, xname: 'q', margin: { l: 58, r: 12, t: 26, b: 44 }, aspect: 0.8, minHeight: 270, maxHeight: 390 };
  const PA = new EPP.Plot(elA, Object.assign({}, opt, { xlim: QA, ylim: KY, xticks: XT_A, yticks: YT_A, ariaLabel: 'Panel a: LO and TO kernels of the photon line against wavevector' }));
  const PB = new EPP.Plot(elB, Object.assign({}, opt, { xlim: QB, ylim: GY, xticks: XT_B, yticks: YT_B, ariaLabel: 'Panel b: the LO electron-phonon vertex against wavevector' }));
  // the legends are static markup (MathJax), placed under the canvases
  const legA = elA.querySelector('.b8-lightline-leg-a'), legB = elB.querySelector('.b8-lightline-leg-b'), legGrid = fig.querySelector('.b8-lightline-leg-grid');
  if (legA) elA.appendChild(legA);
  if (legB) elB.appendChild(legB);
  let cur = null, seq = 0;

  function layersA() {
    const c = cur, two = c.xl.slice(), L = [];
    if (!c.norm) L.push({ type: 'band', x0: GRID[0], x1: GRID[1], color: 'muted', alpha: 0.1 });
    L.push({ type: 'vline', at: c.xW, color: 'muted', dash: [5, 4], width: 1.2 },
      { type: 'vline', at: c.xC, color: 'photon', dash: [5, 4], width: 1.3 },
      // LO: broad translucent lines, so that the thin TO lines stay visible where they coincide
      { type: 'line', x: two, y: [1, 1], color: 'c5', width: 4.5, opacity: 0.55, dash: [4, 8], label: 'LO, free line', hover: false },
      { type: 'line', x: two, y: [c.KL, c.KL], color: 'c5', width: 4.5, opacity: 0.55, label: 'LO, dressed line', hover: false },
      { type: 'line', x: c.xs, y: c.K0T, color: 'photon', width: 1.9, dash: [6, 5], label: 'TO, free line' },
      { type: 'line', x: c.xs, y: c.KT, color: 'photon', width: 2.1, label: 'TO, dressed line' });
    return L;
  }
  function layersB() {
    const c = cur, L = [];
    if (c.qLO > QB[0]) L.push({ type: 'band', x0: QB[0], x1: Math.min(c.qLO, QB[1]), color: 'photon', alpha: 0.11 });
    L.push({ type: 'line', x: QBX, y: QBX.map(q => c.Gb / q), color: 'c5', width: 2, dash: [7, 5], label: 'bare' },
      { type: 'line', x: QBX, y: QBX.map(q => c.Gs / q), color: 'c5', width: 2.4, label: 'screened' },
      { type: 'line', x: QBX, y: QBX.map(q => c.Gf / q), color: 'muted', width: 2.6, dash: [0.5, 4.5], label: 'Fröhlich' });
    return L;
  }

  // ---- direct labels: each takes the first candidate box that stays in the frame and touches no curve, line or label ----
  // the canvas-y range a polyline covers in each canvas column (narrow resonances included), widened by pad
  function coverage(P, xs, ys, pad) {
    const W = Math.ceil(P.cv.w) + 2, lo = new Float64Array(W).fill(Infinity), hi = new Float64Array(W).fill(-Infinity);
    let pX = NaN, pY = NaN;
    for (let i = 0; i < xs.length; i++) {
      const y = ys[i];
      if (!(y > 0 && isFinite(y))) { pX = NaN; continue; }
      const X = P.X(xs[i]), Y = EPP.clamp(P.Y(y), -2000, P.cv.h + 2000);
      if (isFinite(pX) && X >= pX) {
        for (let c = Math.max(0, Math.floor(pX)); c <= Math.min(W - 1, Math.floor(X)); c++) {
          const ta = X > pX ? (Math.max(pX, c) - pX) / (X - pX) : 0, tb = X > pX ? (Math.min(X, c + 1) - pX) / (X - pX) : 1;
          const ya = pY + (Y - pY) * ta, yb = pY + (Y - pY) * tb;
          lo[c] = Math.min(lo[c], ya, yb); hi[c] = Math.max(hi[c], ya, yb);
        }
      }
      pX = X; pY = Y;
    }
    return { lo, hi, pad };
  }
  const hitCov = (b, cv) => { for (let c = Math.max(0, Math.floor(b[0])); c <= Math.min(cv.lo.length - 1, Math.floor(b[2])); c++) if (cv.lo[c] - cv.pad <= b[3] && cv.hi[c] + cv.pad >= b[1]) return true; return false; };
  // candidate boxes of width w and height h hugging a curve from above or below, scanned along x
  function along(cv, side, w, h, from, to, step) {
    const out = [];
    for (let X = from; step > 0 ? X <= to : X >= to; X += step) {
      let lo = Infinity, hi = -Infinity;
      for (let c = Math.floor(X); c <= Math.floor(X + w); c++) if (c >= 0 && c < cv.lo.length) { lo = Math.min(lo, cv.lo[c]); hi = Math.max(hi, cv.hi[c]); }
      if (!isFinite(lo)) continue;
      out.push(side === 'below' ? [X, hi + cv.pad + 3, X + w, hi + cv.pad + 3 + h] : [X, lo - cv.pad - 3 - h, X + w, lo - cv.pad - 3]);
    }
    return out;
  }
  // items: {texts, size, color, own (x of its own vertical line), cross (may cross another vertical line, on a plate),
  // cands(w, h, text) -> boxes}; vls: x of the vertical lines. A label crosses a line only when no candidate avoids it.
  function place(P, items, covs, vls) {
    const ctx = P.ctx, m = P.m, W = P.cv.w, H = P.cv.h, boxes = [], out = [];
    const inFrame = (b) => b[0] >= m.l + 3 && b[2] <= W - m.r - 3 && b[1] >= m.t + 2 && b[3] <= H - m.b - 2;
    for (const it of items) {
      let done = false;
      for (let pass = 0; pass < (it.cross ? 2 : 1) && !done; pass++) {
        for (const text of it.texts) {
          if (done) break;
          const w = rich(ctx, text, 0, 0, { size: it.size, measure: true }), h = Math.round(it.size + 3);
          for (const b of it.cands(w, h, text)) {
            if (!b || !inFrame(b)) continue;
            if (boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) continue;
            if (covs.some(cv => hitCov(b, cv))) continue;
            const crosses = vls.some(X => X !== it.own && X >= b[0] - 3 && X <= b[2] + 3);
            if (crosses && pass === 0) continue;
            boxes.push([b[0] - 5, b[1] - 2, b[2] + 5, b[3] + 2]); out.push({ b, text, size: it.size, color: it.color, plate: crosses }); done = true; break;
          }
        }
      }
    }
    return out;
  }
  function drawLabels(ctx, out) {
    ctx.textBaseline = 'middle';
    for (const L of out) {
      if (L.plate) { ctx.fillStyle = EPP.alpha('surface', 0.9); ctx.fillRect(L.b[0] - 2, L.b[1] - 1, L.b[2] - L.b[0] + 4, L.b[3] - L.b[1] + 2); }
      rich(ctx, L.text, L.b[0], (L.b[1] + L.b[3]) / 2 + 0.5, { size: L.size, color: EPP.textColor(L.color) });
    }
  }
  // rows of boxes beside a vertical line at X: from the bottom of the frame up, then from the top down
  function beside(P, X, sides) {
    const m = P.m, H = P.cv.h;
    return (w, h) => {
      const out = [], at = (s, y0) => (s > 0 ? [X + 4, y0, X + 4 + w, y0 + h] : [X - 4 - w, y0, X - 4, y0 + h]);
      for (let k = 0; k < 3; k++) for (const s of sides) out.push(at(s, H - m.b - 4 - h - 15 * k));
      for (let k = 0; k < 2; k++) for (const s of sides) out.push(at(s, m.t + 4 + 15 * k));
      return out;
    };
  }
  // rows along the left edge of the frame: from the bottom up, then from the top down
  const leftEdge = (P) => (w, h) => {
    const x0 = P.m.l + 6, out = [0, 1, 2].map(k => [x0, P.cv.h - P.m.b - 5 - h - 15 * k, x0 + w, P.cv.h - P.m.b - 5 - 15 * k]);
    for (let k = 0; k < 2; k++) out.push([x0, P.m.t + 4 + 15 * k, x0 + w, P.m.t + 4 + 15 * k + h]);
    return out;
  };

  const lay = { a: { key: '', out: [] }, b: { key: '', out: [] } };
  function layoutA() {
    const P = PA, c = cur, m = P.m, W = P.cv.w, H = P.cv.h, key = [c.id, W, H, FT, FU].join('|');
    if (lay.a.key === key) return lay.a.out;
    const two = c.xl.slice();
    const covs = [coverage(P, c.xs, c.K0T, 2.5), coverage(P, c.xs, c.KT, 2.5), coverage(P, two, [1, 1], 4), coverage(P, two, [c.KL, c.KL], 4)];
    const XW = P.X(c.xW), XC = P.X(c.xC), inX = (X) => X >= m.l + 1 && X <= W - m.r - 1;
    const vls = [XW, XC].filter(inX), items = [];
    if (inX(XC)) items.push({ texts: ['$q$_c'], size: 12, color: 'photon', own: XC, cands: beside(P, XC, [1, -1]) });
    if (inX(XW)) items.push({ texts: ['$ω$/$c$'], size: 12, color: 'muted', own: XW, cands: beside(P, XW, [-1, 1]) });
    if (!c.norm && !inX(XC)) items.push({ texts: [`← $q$_c = ${sci(c.qc, 2)} Å^{−1}`, '← $q$_c'], size: 11, color: 'photon', cands: leftEdge(P) });
    else if (!c.norm && !inX(XW)) items.push({ texts: ['← $ω$/$c$'], size: 11, color: 'muted', cands: leftEdge(P) });
    if (!c.norm) {
      const X0 = P.X(GRID[0]), X1 = P.X(GRID[1]);
      items.push({ texts: ['wavevector grids', 'grids'], size: 11, color: 'muted', cands: (w, h) => (w > X1 - X0 - 8 ? [] : [0, 1, 2].map(k => [(X0 + X1) / 2 - w / 2, m.t + 4 + 15 * k, (X0 + X1) / 2 + w / 2, m.t + 4 + 15 * k + h])) });
    }
    // the LO lines: above the free line and below the dressed one, at the right end if possible, else scanning left
    const xR = (w) => W - m.r - 6 - w;
    items.push({ texts: ['LO, free line', 'LO, free'], size: 11, color: 'c5', cands: (w, h) => along(covs[2], 'above', w, h, xR(w), m.l + 6, -8).concat(along(covs[2], 'below', w, h, xR(w), m.l + 6, -8)) });
    items.push({ texts: ['LO, dressed line', 'LO, dressed'], size: 11, color: 'c5', cands: (w, h) => along(covs[3], 'below', w, h, xR(w), m.l + 6, -8).concat(along(covs[3], 'above', w, h, xR(w), m.l + 6, -8)) });
    // the TO lines: beside their resonance peaks (on a plate across the other light line if nothing else fits),
    // or along the falling curve when the peaks are off the frame
    const Yb = P.Y(1 / c.loss), Yd = P.Y(1 / (c.e * c.loss));
    const clampX = (b) => { const s = EPP.clamp(b[0], m.l + 4, W - m.r - 4 - (b[2] - b[0])) - b[0]; return [b[0] + s, b[1], b[2] + s, b[3]]; };
    const nearPeak = (X, Y, first) => (w, h) => {
      const L = [X - 7 - w, Y - h / 2, X - 7, Y + h / 2], R = [X + 7, Y - h / 2, X + 7 + w, Y + h / 2], U = [X - w / 2, Y - 6 - h, X + w / 2, Y - 6];
      const side = first < 0 ? [L, R] : [R, L], out = [side[0]];
      for (const dy of [-12, -24]) out.push([side[0][0], side[0][1] + dy, side[0][2], side[0][3] + dy]);
      out.push(U, side[1], clampX(U));
      for (const dy of [12, 24, -12, -24]) out.push([side[1][0], side[1][1] + dy, side[1][2], side[1][3] + dy]);
      return out;
    };
    if (inX(XW) && inX(XC)) {
      items.push({ texts: ['TO, free line', 'TO, free'], size: 11, color: 'photon', cross: true, cands: nearPeak(XW, Yb, -1) });
      items.push({ texts: ['TO, dressed line', 'TO, dressed'], size: 11, color: 'photon', cross: true, cands: nearPeak(XC, Yd, 1) });
    } else {
      items.push({ texts: ['TO, free and dressed', 'TO'], size: 11, color: 'photon', cands: (w, h) => along(covs[1], 'below', w, h, m.l + 6, W - m.r - 6 - w, 6).concat(along(covs[1], 'above', w, h, m.l + 6, W - m.r - 6 - w, 6)) });
    }
    lay.a = { key, out: place(P, items, covs, vls) };
    return lay.a.out;
  }
  function layoutB() {
    const P = PB, c = cur, m = P.m, W = P.cv.w, key = [c.id, W, P.cv.h, FT, FU].join('|');
    if (lay.b.key === key) return lay.b.out;
    const covs = [coverage(P, QBX, QBX.map(q => c.Gb / q), 2.5), coverage(P, QBX, QBX.map(q => c.Gs / q), 3), coverage(P, QBX, QBX.map(q => c.Gf / q), 3)];
    const items = [], X1 = P.X(Math.min(c.qLO, QB[1]));
    if (c.qLO > QB[0]) {
      // inside the band when it is wide enough, else beside its edge with an arrow pointing into it
      items.push({ texts: ['light cone', '← light cone'], size: 11, color: 'photon', cands: (w, h, text) => {
        const arrow = text.startsWith('←'), out = [];
        if (!arrow && w > X1 - m.l - 10) return out;
        for (let k = 0; k < 3; k++) { const y0 = P.cv.h - m.b - 5 - h - 15 * k; out.push(arrow ? [X1 + 4, y0, X1 + 4 + w, y0 + h] : [(m.l + X1) / 2 - w / 2, y0, (m.l + X1) / 2 + w / 2, y0 + h]); }
        return out;
      } });
    } else items.push({ texts: [`← light cone: $q$ < ${sci(c.qLO, 2)} Å^{−1}`, '← light cone'], size: 11, color: 'photon', cands: leftEdge(P) });
    const span = W - m.l - m.r;
    items.push({ texts: ['bare'], size: 11, color: 'c5', cands: (w, h) => along(covs[0], 'above', w, h, m.l + 0.45 * span, W - m.r - 6 - w, 6).concat(along(covs[0], 'above', w, h, m.l + 0.45 * span, m.l + 6, -6)) });
    items.push({ texts: ['screened ≈ Fröhlich', 'screened'], size: 11, color: 'c5', cands: (w, h) => along(covs[1], 'below', w, h, m.l + 0.3 * span, W - m.r - 6 - w, 6).concat(along(covs[1], 'below', w, h, m.l + 0.3 * span, m.l + 6, -6)) });
    lay.b = { key, out: place(P, items, covs, []) };
    return lay.b.out;
  }

  // ---- titles, labels and hover tips, drawn after each render ----
  function frame(P, head, xt, yts, drawn) {
    const ctx = P.ctx, w = P.cv.w, h = P.cv.h, m = P.m, cFg = EPP.color('fg');
    FT = EPP.css('--font-text'); FU = EPP.css('--font-ui');
    ctx.save();
    ctx.textBaseline = 'alphabetic';
    rich(ctx, fit(ctx, head, 11.5, w - 8), 4, 15, { size: 11.5, color: EPP.color('fg2') });
    rich(ctx, xt, m.l + (w - m.l - m.r) / 2, h - 8, { size: 12.5, align: 'center', color: cFg });
    ctx.save(); ctx.translate(14, m.t + (h - m.t - m.b) / 2); ctx.rotate(-Math.PI / 2);
    rich(ctx, fit(ctx, yts, 12.5, h - m.t - m.b - 6), 0, 0, { size: 12.5, align: 'center', color: cFg });
    ctx.restore();
    drawLabels(ctx, drawn());
    ctx.restore();
  }
  const sw = (col) => `<span style="color:${EPP.color(col)}">■</span>`;
  function tip(P, rows) {
    P.tip.innerHTML = rows.join('<br>');
    const X = P.X(P._hoverX), tw = P.tip.offsetWidth, left = X + 12 + tw > P.cv.w ? X - 12 - tw : X + 12;
    P.tip.style.left = Math.max(0, left) + 'px';
  }
  const baseA = PA.render.bind(PA), baseB = PB.render.bind(PB);
  PA.render = () => {
    baseA();
    if (!PA.cv.w || !PA.cv.h || !cur) return;
    const c = cur;
    frame(PA, [`(a) LO and TO kernels of ${c.mat}, $ω$ = $ω$_{TO}`, `(a) kernels of ${c.mat}, $ω$ = $ω$_{TO}`, '(a) kernels'],
      c.norm ? '$q$/$q$_c' : 'wavevector $q$ (Å^{−1})', ['|𝒦|, in units of the Coulomb value', '|𝒦| (Coulomb value = 1)', '|𝒦|'], layoutA);
    const x = PA._hoverX;
    if (!PA.tip.hidden && x > 0) {
      const u = c.toU(x), q = c.norm ? x * c.qc : x;
      tip(PA, [`<span style="color:var(--muted)">${c.norm ? `${I('q')}/${I('q')}<sub>c</sub> = ${sci(x, 3)}, ` : ''}${I('q')} = ${sci(q, 3)} Å⁻¹</span>`,
        `${sw('c5')} LO, free line: 1`, `${sw('c5')} LO, dressed line: ${sci(c.KL, 3)}`,
        `${sw('photon')} TO, free line: ${sci(kTO0(u, c.loss), 3)}`, `${sw('photon')} TO, dressed line: ${sci(kTO(u, c.e, c.loss), 3)}`]);
    }
  };
  PB.render = () => {
    baseB();
    if (!PB.cv.w || !PB.cv.h || !cur) return;
    const c = cur;
    frame(PB, [`(b) the LO vertex of ${c.mat}, leading order in $q$`, `(b) the LO vertex of ${c.mat}`, '(b) LO vertex'],
      'wavevector $q$ (Å^{−1})', ['LO vertex |$g$| (eV)', '|$g$| (eV)'], layoutB);
    const x = PB._hoverX;
    if (!PB.tip.hidden && x > 0) {
      tip(PB, [`<span style="color:var(--muted)">${I('q')} = ${sci(x, 3)} Å⁻¹${x < c.qLO ? ', inside the light cone' : ''}</span>`,
        `${sw('c5')} bare: ${sci(c.Gb / x, 3)} eV`, `${sw('c5')} screened: ${sci(c.Gs / x, 3)} eV`, `${sw('muted')} Fröhlich: ${sci(c.Gf / x, 3)} eV`]);
    }
  };

  // ---- readouts: the keys are static MathJax in the markup; only the values change ----
  const roV = {};
  ['qc', 'ratio', 'g', 'fr', 'eps'].forEach(k => { roV[k] = fig.querySelector('.b8-lightline-v-' + k); });
  const nb = (v, u) => `${v} ${u}`;
  function readouts() {
    const c = cur;
    roV.qc.textContent = nb(sci(c.qc, 3), 'Å⁻¹');
    roV.ratio.textContent = sci(c.ratio, 2);
    roV.g.textContent = nb((1e4 * c.Gs).toFixed(0), 'meV');   // |g| at q = 0.1 Å⁻¹ = 10 (q|g|) eV
    roV.fr.textContent = nb((1e4 * c.Gf).toFixed(0), 'meV');
    roV.eps.textContent = String(c.e);
    const speed = c.cf < 1.005 ? 'at the real speed of light' : `with the speed of light ${say(c.cf, 2)} times its real value`;
    PA.cv.canvas.setAttribute('aria-label', `Panel a: magnitudes of the LO and TO kernels of the photon line for ${c.mat}, in units of the Coulomb value, against ` +
      (c.norm ? 'q over q_light, from 10 to the minus 3 to 10 to the 3' : 'wavevector q, from 10 to the minus 8 to 1 per ångström') + `, on logarithmic axes, ${speed}, loss ${lfmt(c.loss)}. ` +
      `The LO kernels are flat: 1 for the free line and ${say(c.KL)} for the dressed line. The TO kernels equal them deep inside the light cone, ` +
      `peak at omega over c = ${say(c.qv)} per ångström (free line, height ${say(1 / c.loss)}) and at q_light = ${say(c.qc)} per ångström (dressed line, height ${say(1 / (c.e * c.loss))}), ` +
      `and fall as (q_light over q) squared outside. At q = 10 to the minus 3 per ångström the TO kernel is ${say(c.ratio, 2)} times the LO kernel.` +
      (c.norm ? '' : ' A band marks the wavevectors of transport grids, from 10 to the minus 3 to 1 per ångström.'));
    PB.cv.canvas.setAttribute('aria-label', `Panel b: magnitude of the LO electron-phonon vertex of ${c.mat} in eV against wavevector q from 10 to the minus 6 to 1 per ångström, on logarithmic axes. ` +
      `All three lines fall as 1 over q; at q = 0.1 per ångström the bare vertex is ${(1e4 * c.Gb).toFixed(0)} meV, the screened vertex ${(1e4 * c.Gs).toFixed(0)} meV and Fröhlich's formula ${(1e4 * c.Gf).toFixed(0)} meV. ` +
      `The light cone of the LO phonon ends at ${say(c.qLO)} per ångström; the lines do not change there.`);
  }

  function onChange(s) {
    const t0 = performance.now();
    cur = Object.assign(compute(s), { id: ++seq });
    PA.opt.xticks = cur.norm ? XT_N : XT_A;
    PA.draw(layersA(), { xlim: cur.xl });
    PB.draw(layersB());
    readouts();
    if (legGrid) legGrid.hidden = cur.norm;
    fig.dataset.redrawMs = (performance.now() - t0).toFixed(2);
  }
  EPP.controls(fig.querySelector('.b8-lightline-ctrls'), [
    { key: 'mat', type: 'select', label: 'material', value: 'GaAs', options: [['GaAs', 'GaAs'], ['MgO', 'MgO'], ['NaCl', 'NaCl']] },
    { key: 'c', type: 'range', label: 'speed of light (× real value)', min: 1, max: 1e6, value: 1, log: true, step: 0.01, fmt: cfmt },
    { key: 'loss', type: 'range', label: 'loss ε_2/ε_∞', min: 1e-3, max: 0.1, value: 0.01, log: true, step: 0.01, fmt: lfmt },
    { key: 'axis', type: 'seg', label: 'panel (a) axis', options: [['q', 'q (Å⁻¹)'], ['n', 'q/q_light']], value: 'q' }
  ], onChange);
  // control labels with italic symbols and upright word labels
  const sp = fig.querySelector(`label[for="${fig.id}-loss"] > span`);
  if (sp) sp.innerHTML = `loss ${I('ε')}<sub>2</sub>/${I('ε')}<sub>∞</sub>`;
  const bq = document.getElementById(`${fig.id}-axis-q`), bn = document.getElementById(`${fig.id}-axis-n`);
  if (bq) { bq.innerHTML = `${I('q')} (Å⁻¹)`; bq.setAttribute('aria-label', 'wavevector q in inverse ångström'); }
  if (bn) { bn.innerHTML = `${I('q')}/${I('q')}<sub>c</sub>`; bn.setAttribute('aria-label', 'q divided by q_light'); }

  // previewed outside Section B.8, links to other parts of the page have no target: keep their text, drop the link
  if (!fig.closest('#b-frohlich')) fig.querySelectorAll('a[href^="#"]').forEach(a => { if (!document.getElementById((a.getAttribute('href') || '').slice(1))) { const s = document.createElement('span'); s.textContent = a.textContent; a.replaceWith(s); } });
})();
</script>
