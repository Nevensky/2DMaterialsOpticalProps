  <figure class="viz" id="viz-a1-crystal">
    <p class="viz-title">Labelling a crystal: cells, basis, displacements <span class="tag">interactive</span></p>
    <div class="a1-crystal-real"></div>
    <div class="legend a1-crystal-leg"></div>
    <div class="a1-crystal-ctrls"></div>
    <div class="readout a1-crystal-ro" aria-live="polite" aria-atomic="true"><span>$\ell$<b class="a1-crystal-v-l"></b></span><span>$\kappa$<b class="a1-crystal-v-k"></b></span><span>$\bR_\ell$<b class="a1-crystal-v-R"></b></span><span>$\btau_\kappa$<b class="a1-crystal-v-t"></b></span><span>$\btau_{\ell\kappa}$<b class="a1-crystal-v-tl"></b></span><span>$\bu_{\ell\kappa}$<b class="a1-crystal-v-u"></b></span></div>
    <figcaption><p class="cap-key"><strong>What to notice.</strong> Every atom, inside the supercell or in one of its faded images, is reached in the same two steps: $\bR_\ell$ to the corner of its cell, then $\btau_\kappa$ inside the cell. An image atom has exactly the displacement of its partner inside the supercell.</p><div class="cap-more"><p><strong>Marks.</strong> Each light parallelogram is a unit cell. The bold outline is the Born–von Kármán supercell of $N_1\times N_2$ cells, and the faded cells around it are its periodic images. $\mathrm O$ marks $\bR_0=\mathbf 0$. A halo marks the selected atom. Its displacement $\bu_{\ell\kappa}$ is redrawn from the rim of the halo, with the components $u_{\ell\kappa x}$ and $u_{\ell\kappa y}$ as the legs of a right triangle. For a selected image atom, a dashed ring marks its partner, and the dotted arrow is the translation from the partner to the image, made of steps $\pm N_1\ba_1$ and $\pm N_2\ba_2$.</p><p><strong>Try.</strong> Click or tap an atom to select it. With the patch focused, the arrow keys change $\ell_1$ (left, right) and $\ell_2$ (up, down), and the space bar switches $\kappa$. Select a faded atom to find its partner. The slider sets $N_1=N_2$ from 2 to 6; the check box hides the displacements.</p><p><strong>Model.</strong> A flat sheet modelled on hexagonal boron nitride (hBN), with motion in its plane only: <span class="nw">$a=2.504$ Å</span>, $\ba_1=a(1,0)$, $\ba_2=a(\tfrac12,\tfrac{\sqrt3}2)$, boron ($\kappa=1$, <span class="nw">$M_1=10.81$ amu</span>) at $\btau_1=(\ba_1+\ba_2)/3$ and nitrogen ($\kappa=2$, <span class="nw">$M_2=14.007$ amu</span>) at $\btau_2=2(\ba_1+\ba_2)/3$, so the B–N bond is <span class="nw">$a/\sqrt3=1.446$ Å</span> long (literature values, illustrative). The displacements are one made-up snapshot that obeys (A1.2), with a typical length of <span class="nw">0.03 Å</span>.</p></div></figcaption>
  </figure>
<script>
(() => {
  const fig = document.getElementById('viz-a1-crystal');
  if (!fig || !window.EPP) return;
  const TAU = 2 * Math.PI, S3 = Math.sqrt(3);
  // hBN-like sheet: lengths in Å, masses in amu
  const A = 2.504;
  const a1 = [A, 0], a2 = [A / 2, A * S3 / 2];
  const TK = [[A / 2, A / (2 * S3)], [A, A / S3]];        // tau_1 = (a1+a2)/3, tau_2 = 2(a1+a2)/3
  const MASS = ['10.81', '14.007'], SPEC = ['B', 'N'], KCOL = ['c5', 'c4'];
  const UF = 15, US = 50;                                 // exaggeration of all arrows; of the selected atom's arrow
  const mod = (n, m) => ((n % m) + m) % m;
  const Rl = (l1, l2) => [l1 * a1[0] + l2 * a2[0], l1 * a1[1] + l2 * a2[1]];
  // displacement snapshot: a fixed sum of three patterns that repeat after N cells along a1 and a2,
  // u_lk = sum_m [A_mk cos(th) + B_mk sin(th)], th = 2π (s_m . l)/N + phi_mk (taken mod N: exactly periodic).
  // Amplitudes (Å) chosen for a generic look with median |u| = 0.03 Å and max 0.048 Å for every N = 2...6.
  const WAVES = [
    { s: [1, 0], A: [[-0.0100, 0.0126], [0.0148, 0.0202]], B: [[-0.0019, 0.0206], [0.0211, 0.0110]], ph: [3.05, 3.32] },
    { s: [0, 1], A: [[-0.0224, -0.0056], [0.0062, 0.0001]], B: [[0.0105, -0.0043], [-0.0019, 0.0030]], ph: [5.54, 3.74] },
    { s: [1, 1], A: [[0.0092, 0.0016], [0.0211, -0.0230]], B: [[-0.0071, 0.0049], [0.0050, 0.0048]], ph: [0.21, 4.84] }
  ];
  const ROT = [Math.cos(-Math.PI / 6), Math.sin(-Math.PI / 6)];   // fixed −30° turn of the whole pattern: the default atom gets two visible components
  function disp(N, l1, l2, k) {
    let ux = 0, uy = 0;
    for (const w of WAVES) {
      const th = TAU * mod(w.s[0] * l1 + w.s[1] * l2, N) / N + w.ph[k], c = Math.cos(th), sn = Math.sin(th);
      ux += w.A[k][0] * c + w.B[k][0] * sn; uy += w.A[k][1] * c + w.B[k][1] * sn;
    }
    return [ROT[0] * ux - ROT[1] * uy, ROT[1] * ux + ROT[0] * uy];
  }

  // ---------- drawing helpers ----------
  function arrow(ctx, x0, y0, x1, y1, o) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (!(L > 0.6)) return;
    const ux = dx / L, uy = dy / L, h = Math.min(o.head || 6, L * 0.6), wv = h * 0.42;
    ctx.strokeStyle = o.col; ctx.fillStyle = o.col; ctx.lineWidth = o.lw || 1.5; ctx.lineCap = 'butt';
    ctx.setLineDash(o.dash || []);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * h * 0.7, y1 - uy * h * 0.7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ux * h - uy * wv, y1 - uy * h + ux * wv);
    ctx.lineTo(x1 - ux * h + uy * wv, y1 - uy * h - ux * wv);
    ctx.closePath(); ctx.fill();
  }
  const shorten = (P0, P1, d) => { const dx = P1[0] - P0[0], dy = P1[1] - P0[1], L = Math.hypot(dx, dy); return L > d + 1 ? [P1[0] - dx / L * d, P1[1] - dy / L * d] : P1; };
  const disc = (ctx, x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); };
  // canvas labels as parts {t, b: bold vector (UI font), i: italic symbol (text font), sub: subscript}
  let FAM = { ui: 'sans-serif', tx: 'serif' };
  const pFont = (p, size) => { const z = (p.i ? size + 1 : size) * (p.sub ? 0.72 : 1); return `${p.i ? 'italic ' : ''}${p.b ? '700 ' : ''}${z.toFixed(1)}px ${p.i ? FAM.tx : FAM.ui}`; };
  function partsW(ctx, parts, size) { let w = 0; for (const p of parts) { ctx.font = pFont(p, size); w += ctx.measureText(p.t).width; } return w; }
  function partsDraw(ctx, parts, x, y, size) { ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; for (const p of parts) { ctx.font = pFont(p, size); ctx.fillText(p.t, x, y + (p.sub ? size * 0.28 : 0)); x += ctx.measureText(p.t).width; } }
  const T = (t) => ({ t }), Bv = (t) => ({ t, b: 1 }), It = (t) => ({ t, i: 1 }), Sb = (t, i) => ({ t, sub: 1, i: i ? 1 : 0 });
  const A1P = [Bv('a'), Sb('1')], A2P = [Bv('a'), Sb('2')];
  const num = (n) => String(n).replace('-', '−');
  // integer combination c1 a1 + c2 a2 as label parts
  function combo(c1, c2) {
    const out = [];
    [[c1, A1P], [c2, A2P]].forEach(([c, V]) => {
      if (!c) return;
      const sg = c < 0 ? '−' : (out.length ? '+' : ''), mag = Math.abs(c);
      out.push(T((out.length ? ' ' + sg + ' ' : sg) + (mag === 1 ? '' : String(mag))));
      out.push(...V);
    });
    return out;
  }
  // label placer: tries candidate centres and takes the first box that stays on the canvas and clears every placed label
  // (with a 3 px gap) and every obstacle; soft obstacles (lattice atoms) are given up before a label moves away
  function placer(ctx, W, H) {
    const boxes = [], labels = [], soft = [];
    const hit = (b, o, g) => b[0] < o[2] + g && b[2] > o[0] - g && b[1] < o[3] + g && b[3] > o[1] - g;
    const free = (b, useSoft) => b[0] >= 1 && b[1] >= 1 && b[2] <= W - 1 && b[3] <= H - 1 && !boxes.some(o => hit(b, o, 0)) && !labels.some(o => hit(b, o, 3)) && !(useSoft && soft.some(o => hit(b, o, 0)));
    const api = {
      disc(P, r) { boxes.push([P[0] - r, P[1] - r, P[0] + r, P[1] + r]); },
      soft(P, r) { soft.push([P[0] - r, P[1] - r, P[0] + r, P[1] + r]); },
      seg(P0, P1, r = 2.5) { const n = Math.max(1, Math.ceil(Math.hypot(P1[0] - P0[0], P1[1] - P0[1]) / 5)); for (let i = 0; i <= n; i++) { const x = P0[0] + (P1[0] - P0[0]) * i / n, y = P0[1] + (P1[1] - P0[1]) * i / n; boxes.push([x - r, y - r, x + r, y + r]); } },
      size(L) { return [partsW(ctx, L.s, L.size), L.size * 1.35]; },
      put(L, cands) {
        const [w, h] = api.size(L);
        const at = (c) => [c[0] - w / 2 - 2, c[1] - h / 2, c[0] + w / 2 + 2, c[1] + h / 2];
        let c = cands.find(cc => free(at(cc), true)) || cands.find(cc => free(at(cc), false)), lead = null;
        if (!c) {
          // no candidate is free: search outwards from the first one and draw a leader line back to the anchor
          const c0 = cands[0];
          search: for (let rad = 8; rad <= 90; rad += 6) for (const useSoft of [true, false]) for (let j = 0; j < 24; j++) {
            const cc = [c0[0] + rad * Math.cos(j * TAU / 24), c0[1] + rad * Math.sin(j * TAU / 24)];
            if (free(at(cc), useSoft)) { c = cc; lead = cands.anchor || c0; break search; }
          }
        }
        if (!c) return null;                                  // skip a label rather than overlap another one
        const b = at(c); labels.push(b);
        if (lead) {
          const dx = lead[0] - c[0], dy = lead[1] - c[1], t = Math.min((w / 2 + 2) / Math.max(Math.abs(dx), 1e-6), (h / 2) / Math.max(Math.abs(dy), 1e-6));
          if (t < 1) { ctx.strokeStyle = EPP.alpha('muted', 0.8); ctx.lineWidth = 0.9; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(c[0] + dx * t, c[1] + dy * t); ctx.lineTo(lead[0] - dx * 0.04, lead[1] - dy * 0.04); ctx.stroke(); }
        }
        ctx.fillStyle = EPP.alpha('surface', 0.84);
        ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(b[0], b[1], b[2] - b[0], b[3] - b[1], 3); else ctx.rect(b[0], b[1], b[2] - b[0], b[3] - b[1]); ctx.fill();
        ctx.fillStyle = L.color; partsDraw(ctx, L.s, c[0] - w / 2, c[1] + L.size * 0.36, L.size);
        return c;
      },
      // centres beside the segment P0 -> P1, preferred side first (side +1 = screen-left of the direction)
      along(L, P0, P1, side, ts = [0.5, 0.38, 0.62, 0.27, 0.73], gap = 3) {
        const [w, h] = api.size(L);
        const dx = P1[0] - P0[0], dy = P1[1] - P0[1], len = Math.hypot(dx, dy) || 1, nx = dy / len, ny = -dx / len;
        const ext = Math.abs(nx) * (w / 2 + 2) + Math.abs(ny) * h / 2 + gap, out = [];
        for (const sd of [side, -side]) for (const t of ts) out.push([P0[0] + dx * t + sd * nx * ext, P0[1] + dy * t + sd * ny * ext]);
        out.anchor = [P0[0] + dx / 2, P0[1] + dy / 2];
        return out;
      },
      // centres around a point, starting at screen angle ang0 and fanning out
      around(L, P, r, ang0, gap = 2) {
        const [w, h] = api.size(L), out = [];
        for (const rr of [r, r + 6]) for (let j = 0; j < 16; j++) {
          const kk = j === 0 ? 0 : (j % 2 ? 1 : -1) * Math.ceil(j / 2), th = ang0 + kk * Math.PI / 8;
          const c = Math.cos(th), s = Math.sin(th);
          const ext = rr + gap + Math.min((w / 2 + 2) / Math.max(Math.abs(c), 1e-6), (h / 2) / Math.max(Math.abs(s), 1e-6));
          out.push([P[0] + c * ext, P[1] + s * ext]);
        }
        out.anchor = P;
        return out;
      }
    };
    return api;
  }
  const lab = (s, color, size) => ({ s: typeof s === 'string' ? [T(s)] : s, color, size });

  // ---------- state ----------
  let N = 3, showU = true;
  let sel = { l1: 2, l2: 0, k: 1 };   // selected atom: cell (l1, l2), k = κ − 1
  let atomsPx = [], rHitR = 15;

  const cv = EPP.canvas(fig.querySelector('.a1-crystal-real'), { aspect: 0.58, minHeight: 300, maxHeight: 470 });
  cv.canvas.setAttribute('tabindex', '0');
  cv.canvas.setAttribute('role', 'application');
  cv.canvas.setAttribute('aria-label', 'Real-space patch of the hBN-like sheet: unit cells, the bold Born–von Kármán supercell and its faded periodic images, boron and nitrogen atoms with displacement arrows, and the vectors R, tau and u of the selected atom. Click an atom to select it, or use the arrow keys to change the cell index l1 (left, right) and l2 (up, down) and the space bar to switch the atom kappa; the readout below reports the selected atom.');
  const $v = (c) => fig.querySelector('.a1-crystal-v-' + c);
  const roV = { l: $v('l'), k: $v('k'), R: $v('R'), t: $v('t'), tl: $v('tl'), u: $v('u') };
  const legEl = fig.querySelector('.a1-crystal-leg');

  // ---------- real space ----------
  function draw() {
    const ctx = cv.ctx, W = cv.w, H = cv.h;
    cv.clear();
    atomsPx = [];
    if (W < 40) return;
    FAM = { ui: EPP.css('--font-ui'), tx: EPP.css('--font-text') };
    const pad = 4;
    // px per Å: the supercell plus 0.55 a on each side across, one image row above and below
    const s = Math.min((W - 4) / ((1.5 * N + 1.1) * A), (H - 2 * pad) / ((S3 / 2) * (N + 2) * A));
    const cx = 0.75 * N * A, cy = (S3 / 4) * N * A;            // supercell centre = canvas centre
    const X = (x) => W / 2 + (x - cx) * s, Y = (y) => H / 2 - (y - cy) * s;
    const P = (v) => [X(v[0]), Y(v[1])];
    const aPx = A * s, rA = EPP.clamp(0.1 * aPx, 3.2, 7), rH = rA + 7;
    rHitR = rA + 10;
    // cells that reach into the canvas
    const toL = (px, py) => { const x = (px - W / 2) / s + cx, y = -(py - H / 2) / s + cy, l2 = y / (A * S3 / 2); return [x / A - l2 / 2, l2]; };
    const cs = [toL(0, 0), toL(W, 0), toL(0, H), toL(W, H)];
    const L1a = Math.floor(Math.min(...cs.map(c => c[0]))) - 1, L1b = Math.ceil(Math.max(...cs.map(c => c[0]))) + 1;
    const L2a = Math.floor(Math.min(...cs.map(c => c[1]))) - 1, L2b = Math.ceil(Math.max(...cs.map(c => c[1]))) + 1;
    const inSC = (l1, l2) => l1 >= 0 && l1 < N && l2 >= 0 && l2 < N;
    const onCv = (p, m) => p[0] > -m && p[0] < W + m && p[1] > -m && p[1] < H + m;
    const quad = (pts) => { ctx.beginPath(); pts.forEach((p, j) => (j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); };
    const cellPath = (l1, l2) => quad([P(Rl(l1, l2)), P(Rl(l1 + 1, l2)), P(Rl(l1 + 1, l2 + 1)), P(Rl(l1, l2 + 1))]);
    const scPath = () => quad([P([0, 0]), P(Rl(N, 0)), P(Rl(N, N)), P(Rl(0, N))]);
    const k = sel.k, selIn = inSC(sel.l1, sel.l2), pl1 = mod(sel.l1, N), pl2 = mod(sel.l2, N);
    const cInk = EPP.color('ink'), cFg2 = EPP.color('fg2'), cMut = EPP.color('muted'), cPh = EPP.color('phonon'), cPhT = EPP.color('phonon-t');
    // supercell tint, selected (and partner) cell tint
    scPath(); ctx.fillStyle = EPP.alpha('ink', 0.03); ctx.fill();
    cellPath(sel.l1, sel.l2); ctx.fillStyle = EPP.alpha('ink', 0.075); ctx.fill();
    if (!selIn) { cellPath(pl1, pl2); ctx.fillStyle = EPP.alpha('ink', 0.05); ctx.fill(); }
    // cell edges: faint everywhere, stronger inside the supercell
    const line = (p, q) => { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); };
    ctx.lineWidth = 1; ctx.strokeStyle = EPP.alpha('muted', 0.24); ctx.beginPath();
    for (let j = L1a; j <= L1b; j++) line(P(Rl(j, L2a)), P(Rl(j, L2b)));
    for (let j = L2a; j <= L2b; j++) line(P(Rl(L1a, j)), P(Rl(L1b, j)));
    ctx.stroke();
    ctx.strokeStyle = EPP.alpha('muted', 0.42); ctx.beginPath();
    for (let j = 1; j < N; j++) { line(P(Rl(j, 0)), P(Rl(j, N))); line(P(Rl(0, j)), P(Rl(N, j))); }
    ctx.stroke();
    // Born–von Kármán supercell outline
    ctx.strokeStyle = cInk; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; scPath(); ctx.stroke();
    // selected atom (and its partner inside the supercell when an image is selected): soft halo under the atom
    const Rv = Rl(sel.l1, sel.l2), tv = TK[k], O = P([0, 0]), Rp = P(Rv), Ap = P([Rv[0] + tv[0], Rv[1] + tv[1]]);
    const Rpart = Rl(pl1, pl2), Pp = P([Rpart[0] + tv[0], Rpart[1] + tv[1]]);
    ctx.fillStyle = EPP.alpha('ink', 0.14); disc(ctx, Ap[0], Ap[1], rH); ctx.fill();
    if (!selIn) { ctx.fillStyle = EPP.alpha('ink', 0.09); disc(ctx, Pp[0], Pp[1], rH); ctx.fill(); }
    // atoms at their equilibrium positions tau_lk = R_l + tau_k
    for (let l1 = L1a; l1 <= L1b; l1++) for (let l2 = L2a; l2 <= L2b; l2++) for (let kk = 0; kk < 2; kk++) {
      const r = Rl(l1, l2), p = P([r[0] + TK[kk][0], r[1] + TK[kk][1]]);
      if (!onCv(p, -rA)) continue;                          // only atoms whose disc lies wholly on the canvas
      const inside = inSC(l1, l2);
      ctx.fillStyle = inside ? EPP.color(KCOL[kk]) : EPP.alpha(KCOL[kk], 0.36);
      disc(ctx, p[0], p[1], rA); ctx.fill();
      atomsPx.push({ x: p[0], y: p[1], l1, l2, k: kk, inside });
    }
    // displacement arrows (×UF) from the equilibrium positions; the selected atom gets its own below
    if (showU) for (const at of atomsPx) {
      if (at.l1 === sel.l1 && at.l2 === sel.l2 && at.k === k) continue;
      const u = disp(N, at.l1, at.l2, at.k), L = UF * Math.hypot(u[0], u[1]) * s;
      arrow(ctx, at.x, at.y, at.x + UF * u[0] * s, at.y - UF * u[1] * s, { col: at.inside ? cPh : EPP.alpha('phonon', 0.42), lw: 1.5, head: EPP.clamp(0.42 * L, 2.5, 5.5) });
    }
    // ----- selected atom: R_l, tau_k, tau_lk, u_lk -----
    const pl = placer(ctx, W, H), fs = W < 360 ? 11.5 : 12.5;
    for (const at of atomsPx) pl.soft([at.x, at.y], rA + 1);
    const isO = sel.l1 === 0 && sel.l2 === 0;
    // translation from the partner to the selected image (a multiple of N a_j)
    let Tlab = null;
    if (!selIn) {
      const T0 = shorten(Ap, Pp, rH + 1), T1 = shorten(Pp, Ap, rH + 1);
      arrow(ctx, T0[0], T0[1], T1[0], T1[1], { col: cMut, lw: 1.3, head: 6, dash: [2, 3] });
      pl.seg(T0, T1, 2);
      Tlab = [lab(combo(sel.l1 - pl1, sel.l2 - pl2), cMut, 12), T0, T1];
      ctx.strokeStyle = cInk; ctx.lineWidth = 1.3; ctx.setLineDash([2.5, 2]); disc(ctx, Pp[0], Pp[1], rA + 2); ctx.stroke(); ctx.setLineDash([]);
      pl.disc(Pp, rA + 4);
    }
    // primitive vectors drawn as dimension arrows just outside cell (0,0)
    const off = 7, n2 = [-S3 / 2, -0.5];
    const A1s = [O[0], O[1] + off], A1e = [X(a1[0]), Y(a1[1]) + off];
    const A2s = [O[0] + n2[0] * off, O[1] + n2[1] * off], A2e = [X(a2[0]) + n2[0] * off, Y(a2[1]) + n2[1] * off];
    arrow(ctx, A1s[0], A1s[1], A1e[0], A1e[1], { col: cFg2, lw: 1.4, head: 6 });
    arrow(ctx, A2s[0], A2s[1], A2e[0], A2e[1], { col: cFg2, lw: 1.4, head: 6 });
    pl.seg(A1s, A1e, 2); pl.seg(A2s, A2e, 2);
    // R_l, tau_k (atom colour), tau_lk (dashed)
    const Ae = shorten(Rp, Ap, rA + 1.5), Ae2 = shorten(O, Ap, rA + 1.5);
    if (!isO) {
      arrow(ctx, O[0], O[1], Ae2[0], Ae2[1], { col: cMut, lw: 1.5, head: 6.5, dash: [5, 4] });
      arrow(ctx, O[0], O[1], Rp[0], Rp[1], { col: cInk, lw: 2.5, head: 8.5 });
      pl.seg(O, Rp, 3); pl.seg(O, Ae2, 2.5);
    }
    arrow(ctx, Rp[0], Rp[1], Ae[0], Ae[1], { col: EPP.color(KCOL[k]), lw: 2.3, head: 7.5 });
    pl.seg(Rp, Ae, 3);
    ctx.strokeStyle = cInk; ctx.lineWidth = 1.4; disc(ctx, Ap[0], Ap[1], rA + 1.6); ctx.stroke();
    pl.disc(Ap, rH);
    ctx.fillStyle = cInk; disc(ctx, O[0], O[1], 2.8); ctx.fill(); pl.disc(O, 4);
    // u_lk of the selected atom, ×US, from the rim of its halo: the hypotenuse of a right triangle whose legs are u_lkx and u_lky.
    // The leg of the larger component comes first, so the corner lies well away from the halo.
    let tri = null;
    if (showU) {
      const u = disp(N, sel.l1, sel.l2, k), uL = Math.hypot(u[0], u[1]) || 1;
      const dir = [u[0] / uL, -u[1] / uL];
      const S0 = [Ap[0] + dir[0] * rH, Ap[1] + dir[1] * rH], E0 = [S0[0] + US * u[0] * s, S0[1] - US * u[1] * s];
      const xFirst = Math.abs(u[0]) >= Math.abs(u[1]), C0 = xFirst ? [E0[0], S0[1]] : [S0[0], E0[1]];
      const lx = Math.abs(E0[0] - S0[0]), ly = Math.abs(E0[1] - S0[1]);
      if (lx > 5 && ly > 5) {                               // right-angle mark at the corner
        const q = 4.5, sx = Math.sign((xFirst ? S0 : E0)[0] - C0[0]), sy = Math.sign((xFirst ? E0 : S0)[1] - C0[1]);
        ctx.strokeStyle = EPP.alpha('phonon-t', 0.8); ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(C0[0] + sx * q, C0[1]); ctx.lineTo(C0[0] + sx * q, C0[1] + sy * q); ctx.lineTo(C0[0], C0[1] + sy * q); ctx.stroke();
      }
      arrow(ctx, S0[0], S0[1], C0[0], C0[1], { col: cPhT, lw: 1.5, head: 5, dash: [3, 2] });
      arrow(ctx, C0[0], C0[1], E0[0], E0[1], { col: cPhT, lw: 1.5, head: 5, dash: [3, 2] });
      arrow(ctx, S0[0], S0[1], E0[0], E0[1], { col: cPh, lw: 2.8, head: 9 });
      pl.seg(S0, E0, 3); pl.seg(S0, C0, 2.5); pl.seg(C0, E0, 2.5);
      // end of each leg: the x leg ends at the corner when it comes first, else at the tip
      tri = { S0, E0, C0, u, xEnd: xFirst ? C0 : E0, yEnd: xFirst ? E0 : C0 };
      // the partner of a selected image moves the same way: the same arrow, lighter and without legs
      if (!selIn) {
        const S1 = [Pp[0] + dir[0] * rH, Pp[1] + dir[1] * rH], E1 = [S1[0] + US * u[0] * s, S1[1] - US * u[1] * s];
        arrow(ctx, S1[0], S1[1], E1[0], E1[1], { col: EPP.alpha('phonon', 0.6), lw: 2.2, head: 8 });
        pl.seg(S1, E1, 2.5);
      }
    }
    // ----- labels (placed without overlaps, most constrained first) -----
    const side = (P0, P1, away) => { const dx = P1[0] - P0[0], dy = P1[1] - P0[1], mx = (P0[0] + P1[0]) / 2 - away[0], my = (P0[1] + P1[1]) / 2 - away[1]; return (dy * mx - dx * my) >= 0 ? 1 : -1; };
    if (tri) {
      const { S0, E0, C0, u, xEnd, yEnd } = tri;
      let L = lab([Bv('u'), Sb('ℓκ', 1)], cPhT, fs);
      pl.put(L, pl.along(L, S0, E0, side(S0, E0, C0), [0.5, 0.62, 0.38, 0.75, 0.27]));
      // each component label just beyond the arrowhead of its leg
      L = lab([It('u'), Sb('ℓκx', 1)], cPhT, fs - 0.5);
      pl.put(L, pl.around(L, xEnd, 2, u[0] >= 0 ? 0 : Math.PI));
      L = lab([It('u'), Sb('ℓκy', 1)], cPhT, fs - 0.5);
      pl.put(L, pl.around(L, yEnd, 2, u[1] >= 0 ? -Math.PI / 2 : Math.PI / 2));
    }
    // fixed labels of the origin cell before the vector triangle, so that they keep their places
    { let L = lab(A1P, cFg2, 12); pl.put(L, pl.along(L, A1s, A1e, -1, [0.5, 0.35, 0.65]));
      L = lab(A2P, cFg2, 12); pl.put(L, pl.along(L, A2s, A2e, 1, [0.5, 0.35, 0.65])); }
    { const L = lab('O', cInk, 12); pl.put(L, pl.around(L, O, 4, 3 * Math.PI / 4)); }
    {
      const L = lab(isO ? [Bv('τ'), Sb('κ', 1), T(' = '), Bv('τ'), Sb('ℓκ', 1)] : [Bv('τ'), Sb('κ', 1)], EPP.color(KCOL[k] + '-t'), fs);
      pl.put(L, pl.along(L, Rp, Ae, isO ? 1 : side(Rp, Ae, O)));
    }
    if (!isO) {
      let L = lab([Bv('τ'), Sb('ℓκ', 1)], cMut, fs);
      pl.put(L, pl.along(L, O, Ae2, side(O, Ae2, Rp), [0.55, 0.45, 0.65, 0.35, 0.75]));
      L = lab([Bv('R'), Sb('ℓ', 1), T(', '), It('ℓ'), T(` = (${num(sel.l1)}, ${num(sel.l2)})`)], cInk, fs);
      pl.put(L, pl.along(L, O, Rp, side(O, Rp, Ap), [0.66, 0.54, 0.78, 0.42, 0.3]));
    }
    if (isO) { const L = lab([Bv('R'), Sb('ℓ', 1), T(' = 0, '), It('ℓ'), T(' = (0, 0)')], cInk, fs); pl.put(L, pl.around(L, O, 6, Math.PI / 2)); }
    if (Tlab) pl.put(Tlab[0], pl.along(Tlab[0], Tlab[1], Tlab[2], 1));
    if (!selIn) { const L2 = lab('partner', cFg2, 11); pl.put(L2, pl.around(L2, Pp, rH, Math.PI / 2)); }
  }

  // ---------- legend ----------
  const I = (t) => `<i style="font-family:var(--font-text)">${t}</i>`;
  function legend() {
    const C = EPP.color;
    const svg = (inner, w) => `<svg width="${w}" height="12" viewBox="0 0 ${w} 12" aria-hidden="true" style="vertical-align:-1px;margin-right:5px">${inner}</svg>`;
    const dot = (col) => svg(`<circle cx="6" cy="6" r="5" fill="${col}"/>`, 12);
    const arr = (col, lw, w, hd) => svg(`<line x1="1" y1="6" x2="${w - hd}" y2="6" stroke="${col}" stroke-width="${lw}"/><path d="M${w - 1} 6 L${w - 1 - hd} ${6 - hd * 0.45} L${w - 1 - hd} ${6 + hd * 0.45} Z" fill="${col}"/>`, w);
    const it = (sw, t) => `<span class="item">${sw}${t}</span>`;
    const items = [it(dot(C('c5')), `${I('κ')} = 1 (B)`), it(dot(C('c4')), `${I('κ')} = 2 (N)`)];
    if (showU) items.push(it(arr(C('phonon'), 1.5, 18, 5), `displacements, ×${UF}`), it(arr(C('phonon'), 2.8, 30, 8), `selected atom, ×${US}`));
    legEl.innerHTML = items.join('');
  }

  // ---------- readouts ----------
  const fx = (v, d) => EPP.fix(Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v, d);
  const vec = (v, d) => `(${fx(v[0], d)}, ${fx(v[1], d)})`;
  function readouts() {
    const k = sel.k, Rv = Rl(sel.l1, sel.l2), tv = TK[k], pos = [Rv[0] + tv[0], Rv[1] + tv[1]];
    const u = disp(N, sel.l1, sel.l2, k), selIn = sel.l1 >= 0 && sel.l1 < N && sel.l2 >= 0 && sel.l2 < N;
    roV.l.textContent = `(${num(sel.l1)}, ${num(sel.l2)})` + (selIn ? ', inside the supercell' : `, image of (${mod(sel.l1, N)}, ${mod(sel.l2, N)})`);
    roV.k.textContent = `${k + 1} (${SPEC[k]}, ${MASS[k]} amu)`;
    roV.R.textContent = vec(Rv, 3) + ' Å';
    roV.t.textContent = vec(tv, 3) + ' Å';
    roV.tl.textContent = vec(pos, 3) + ' Å';
    roV.u.textContent = `${vec(u, 4)} Å, length ${fx(Math.hypot(u[0], u[1]), 4)} Å`;
  }
  function drawAll() { draw(); readouts(); }

  // ---------- interaction ----------
  const local = (e) => { const r = cv.canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function nearest(x, y, tol) { let best = null, bd = tol; for (const o of atomsPx) { const d = Math.hypot(o.x - x, o.y - y); if (d <= bd) { bd = d; best = o; } } return best; }
  cv.canvas.addEventListener('pointerdown', (e) => {
    const [x, y] = local(e), h = nearest(x, y, rHitR);
    if (h) { sel = { l1: h.l1, l2: h.l2, k: h.k }; drawAll(); }
  });
  cv.canvas.addEventListener('pointermove', (e) => { const [x, y] = local(e); cv.canvas.style.cursor = nearest(x, y, rHitR) ? 'pointer' : 'default'; });
  // keyboard: arrows change l1 (left, right) and l2 (up, down), the space bar switches kappa; only atoms drawn on the canvas can be reached
  cv.canvas.addEventListener('keydown', (e) => {
    const d = { ArrowLeft: [-1, 0, 0], ArrowRight: [1, 0, 0], ArrowUp: [0, 1, 0], ArrowDown: [0, -1, 0], ' ': [0, 0, 1], Spacebar: [0, 0, 1] }[e.key];
    if (!d || e.altKey || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    const t = { l1: sel.l1 + d[0], l2: sel.l2 + d[1], k: d[2] ? 1 - sel.k : sel.k };
    if (atomsPx.some(a => a.l1 === t.l1 && a.l2 === t.l2 && a.k === t.k)) { sel = t; drawAll(); }
  });

  function onChange(st) {
    const n = EPP.clamp(Math.round(st.N), 2, 6);
    const changed = n !== N;
    N = n; showU = !!st.showU;
    draw();
    // keep the selected atom on the canvas: fall back to its partner inside the supercell
    if (changed && !atomsPx.some(a => a.l1 === sel.l1 && a.l2 === sel.l2 && a.k === sel.k)) { sel = { l1: mod(sel.l1, N), l2: mod(sel.l2, N), k: sel.k }; draw(); }
    readouts(); legend();
  }
  const ctl = EPP.controls(fig.querySelector('.a1-crystal-ctrls'), [
    { key: 'N', type: 'range', label: 'supercell N_1 × N_2', min: 2, max: 6, step: 1, value: 3, fmt: v => `${Math.round(v)} × ${Math.round(v)}` },
    { key: 'showU', type: 'toggle', label: 'displacements', value: true }
  ], onChange);
  { const sp = ctl.el.querySelector('.ctrl label span'); if (sp) sp.innerHTML = `supercell ${I('N')}<sub>1</sub> × ${I('N')}<sub>2</sub>`; }
  cv.onResize(draw);
  EPP.onTheme(legend);
})();
</script>
