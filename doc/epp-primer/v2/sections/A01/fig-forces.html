  <figure class="viz" id="viz-a1-forces">
    <p class="viz-title">What a force constant is: push one atom, read the forces <span class="tag">interactive</span></p>
    <div class="viz-grid side">
      <div class="a1-forces-lat"></div>
      <div class="a1-forces-side" style="min-width:0">
        <div class="a1-forces-blk"></div>
        <div class="legend a1-forces-legend"></div>
      </div>
    </div>
    <div class="a1-forces-ctrl"></div>
    <div class="a1-forces-ro"></div>
    <div class="a1-forces-ro2"></div>
    <figcaption><strong>Model.</strong> A flat sheet modelled on hexagonal boron nitride: $a=2.504$ Å, $\ba_1=a(1,0)$, $\ba_2=a(\tfrac12,\tfrac{\sqrt3}{2})$, atom $\kappa=1$ (B, 10.81 amu) at $\btau_1=(\ba_1+\ba_2)/3$ and atom $\kappa=2$ (N, 14.007 amu) at $\btau_2=2(\ba_1+\ba_2)/3$. Central springs join nearest neighbours (B–N, distance $a/\sqrt3=1.446$ Å, stiffness $K_1$) and next-nearest neighbours (B–B and N–N, distance $a$, stiffness $K_2$); the defaults $K_1=28.1$ and $K_2=5.0$ eV/Å² are illustrative. Atoms move in the plane only, so each block of $\Phi$ is a $2\times2$ matrix. A spring of stiffness $K$ along the unit vector $\bn$ between two atoms adds $-K\,\bn\bn^{\mathsf T}$ to the block that couples them and $+K\,\bn\bn^{\mathsf T}$ to the on-site block of each. P is the pushed atom $\ell'\kappa'$ and X the probe atom $\ell\kappa$: the block $\Phi_{\mathrm X,\mathrm P}$ holds the entries $\Phi_{\ell\kappa\alpha,\ell'\kappa'\beta}$, with rows $\alpha=x,y$ and columns $\beta=x,y$, and its column $\beta$ is minus the force on X per unit push of P along $\beta$. The masses play no role here: force constants belong to the energy surface alone.
      <strong>Left.</strong> A patch of the sheet: violet discs are B, teal discs N, solid lines $K_1$ springs, dotted lines $K_2$ springs. In <em>push one atom</em>, P is displaced by $\bd$, with $|\bd|=0.05$ Å at the angle $\theta$, drawn 12 times enlarged; the dashed circle marks its equilibrium position. All force arrows share the scale printed at the top right: amber on P, $\bF_{\mathrm P}=-\Phi_{\mathrm P,\mathrm P}\bd$, and in the text colour on each neighbour X, $\bF_{\mathrm X}=-\Phi_{\mathrm X,\mathrm P}\bd$, thicker for the 3 nearest than for the 6 next-nearest neighbours. A ring marks the probe X (in the second mode, the selected atom). In <em>shift every atom</em>, all atoms move by the same $\bd$ (dashed rings mark equilibrium), and the terms of the force on the selected atom $\ell\kappa$, $-\sum_{\ell'\kappa'}\Phi_{\ell\kappa,\ell'\kappa'}\bd$, are drawn tip to tail from it: the on-site term in amber, then the 3 nearest and the 6 next-nearest neighbour terms, each group in order of direction.
      <strong>Right.</strong> The block $\Phi_{\mathrm X,\mathrm P}$ in eV/Å² and the force it produces; in the second mode, the on-site block, the summed neighbour blocks and their total, the left side of (A1.6). Click an atom to push it, or switch <em>click selects</em> to read the block of another atom; in the second mode a click picks the atom whose balance is shown.
      <strong>What to notice.</strong> The pushed atom is pulled back, and each neighbour is pushed or pulled along its bond, so a neighbour whose bond is perpendicular to $\bd$ feels nothing. When every atom shifts, every coupling still contributes, but the contributions close into a loop and cancel exactly: this is the acoustic sum rule. The on-site block, $\tfrac32K_1+3K_2$ times the unit matrix, is the total stiffness of the springs attached to the atom; set $K_2=0$ and the next-nearest blocks vanish.</figcaption>
  </figure>
<script>
(() => {
  const fig = document.getElementById('viz-a1-forces');
  if (!fig || !window.EPP) return;
  // Model of section A.1: hBN-like honeycomb with central springs. Lengths in Å, K in eV/Å^2, forces in eV/Å.
  const A = 2.504, S3 = Math.sqrt(3), DNN = A / S3, DMAG = 0.05, EXAG = 12, BAND = 26;
  const TAU = [[A / 2, A * S3 / 6], [A, A * S3 / 3]]; // tau_1 = (a_1 + a_2)/3, tau_2 = 2(a_1 + a_2)/3
  const SP = [{ name: 'B', col: 'c5' }, { name: 'N', col: 'c4' }];
  const DEF_SEL = '0,0,0', DEF_PROBE = '-1,0,1'; // keys l1,l2,kappa-1: B of cell (0,0); its nearest N at 150 degrees
  const LADDER = [60, 50, 40, 35, 30, 25, 20, 15, 12, 10, 8, 6, 5];
  const $ = s => fig.querySelector(s);
  const elLeg = $('.a1-forces-legend'), elCtl = $('.a1-forces-ctrl'), elRo = $('.a1-forces-ro'), elRo2 = $('.a1-forces-ro2');
  const cv = EPP.canvas($('.a1-forces-lat'), { aspect: 0.84, minHeight: 280, maxHeight: 440 });
  const cb = EPP.canvas($('.a1-forces-blk'), { height: 300 });
  cv.canvas.setAttribute('role', 'img');
  cv.canvas.setAttribute('aria-label', 'Honeycomb patch of boron and nitrogen atoms joined by springs. One atom is pushed, or every atom is shifted, and arrows show the resulting forces.');
  cb.canvas.setAttribute('role', 'img');
  cb.canvas.setAttribute('aria-label', 'The two by two force-constant block for the chosen pair of atoms and the force it produces, or, in the second mode, the row sum of the force constants.');
  [elRo, elRo2].forEach(el => { el.classList.add('readout'); el.setAttribute('aria-live', 'polite'); });

  // ---------- helpers ----------
  const f2 = v => (Math.abs(v) < 0.005 ? '0.00' : EPP.fix(v, 2));
  const f3 = v => (Math.abs(v) < 0.0005 ? '0.000' : EPP.fix(v, 3));
  const vec = v => `(${f3(v[0])}, ${f3(v[1])})`;
  const matTxt = M => `(${f2(M[0][0])}, ${f2(M[0][1])}; ${f2(M[1][0])}, ${f2(M[1][1])})`;
  const mv = (M, v) => [M[0][0] * v[0] + M[0][1] * v[1], M[1][0] * v[0] + M[1][1] * v[1]];
  const neg = v => [-v[0], -v[1]];
  const madd = (P, Q) => [[P[0][0] + Q[0][0], P[0][1] + Q[0][1]], [P[1][0] + Q[1][0], P[1][1] + Q[1][1]]];
  const zero = () => [[0, 0], [0, 0]];
  // rich-text runs: a leading '*' marks a bold run (vector symbol; sub/superscripts stay regular)
  const strip = p => (p[0] === '*' ? p.slice(1) : p);
  const rtW = (ctx, parts, size, fam) => parts.reduce((w, p) => w + EPP.measureRich(ctx, strip(p), size, fam, { bold: p[0] === '*' }), 0);
  const rt = (ctx, parts, x, y, size, fam, align) => {
    const tot = rtW(ctx, parts, size, fam);
    let x0 = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
    for (const p of parts) x0 += EPP.drawRich(ctx, strip(p), x0, y, { size, font: fam, bold: p[0] === '*' });
    return tot;
  };
  const boxHit = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
  const discBox = (cx, cy, rr, b) => { const qx = EPP.clamp(cx, b[0], b[2]), qy = EPP.clamp(cy, b[1], b[3]); return (qx - cx) ** 2 + (qy - cy) ** 2 < rr * rr; };
  function segBox(s, b) { // Liang-Barsky: does segment s = [x0,y0,x1,y1] cross box b = [x0,y0,x1,y1]?
    const dx = s[2] - s[0], dy = s[3] - s[1], P = [-dx, dx, -dy, dy], Q = [s[0] - b[0], b[2] - s[0], s[1] - b[1], b[3] - s[1]];
    let t0 = 0, t1 = 1;
    for (let i = 0; i < 4; i++) {
      if (Math.abs(P[i]) < 1e-12) { if (Q[i] < 0) return false; continue; }
      const t = Q[i] / P[i];
      if (P[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; } else { if (t < t0) return false; if (t < t1) t1 = t; }
    }
    return true;
  }
  const dPS = (px, py, s) => { const dx = s[2] - s[0], dy = s[3] - s[1], l2 = dx * dx + dy * dy; const t = l2 ? EPP.clamp(((px - s[0]) * dx + (py - s[1]) * dy) / l2, 0, 1) : 0; return Math.hypot(px - s[0] - t * dx, py - s[1] - t * dy); };
  // ---------- lattice patch (rebuilt on resize) ----------
  let L = null;
  function build() {
    const w = cv.w, h = cv.h, ph = h - BAND;
    const ppa = Math.min(w / 4.2, ph / 3.3), pxA = ppa / A, Dpx = DNN * pxA; // px per a, px per Å, px per bond
    const r = EPP.clamp(0.14 * Dpx, 6, 9.5), cx = w / 2, cy = BAND + ph / 2, c0 = TAU[0];
    const ext = 1.2 * ppa + r, atoms = [], index = new Map();
    for (let l2 = -8; l2 <= 8; l2++) for (let l1 = -8; l1 <= 8; l1++) for (let k = 0; k < 2; k++) {
      const x = l1 * A + l2 * A / 2 + TAU[k][0], y = l2 * A * S3 / 2 + TAU[k][1];
      const sx = cx + (x - c0[0]) * pxA, sy = cy - (y - c0[1]) * pxA;
      if (sx < -ext || sx > w + ext || sy < BAND - ext || sy > h + ext) continue;
      index.set(`${l1},${l2},${k}`, atoms.length);
      atoms.push({ l1, l2, k, x, y, sx, sy, nn: [], nnn: [] });
    }
    const nnPairs = [], nnnPairs = [];
    for (let i = 0; i < atoms.length; i++) for (let j = i + 1; j < atoms.length; j++) {
      const dx = atoms[j].x - atoms[i].x, dy = atoms[j].y - atoms[i].y, d2 = dx * dx + dy * dy;
      if (Math.abs(d2 - DNN * DNN) < 1e-6) { atoms[i].nn.push(j); atoms[j].nn.push(i); nnPairs.push([i, j]); }
      else if (Math.abs(d2 - A * A) < 1e-6) { atoms[i].nnn.push(j); atoms[j].nnn.push(i); nnnPairs.push([i, j]); }
    }
    const m = r + 3, inside = a => a.sx >= m && a.sx <= w - m && a.sy >= BAND + m && a.sy <= h - m;
    for (const a of atoms) {
      a.vis = a.sx > -r && a.sx < w + r && a.sy > BAND - r && a.sy < h + r;
      const ang = j => (Math.atan2(atoms[j].y - a.y, atoms[j].x - a.x) * 180 / Math.PI + 360 + 1e-9) % 360;
      a.nn.sort((p, q) => ang(p) - ang(q)); a.nnn.sort((p, q) => ang(p) - ang(q));
    }
    // an atom can be pushed (or balanced) only if all 9 of its neighbours are in view
    for (const a of atoms) a.pick = a.nn.length === 3 && a.nnn.length === 6 && inside(a) && a.nn.every(j => inside(atoms[j])) && a.nnn.every(j => inside(atoms[j]));
    L = { w, h, ppa, pxA, Dpx, r, atoms, index, nnPairs, nnnPairs };
  }
  const keyOf = a => `${a.l1},${a.l2},${a.k}`;

  // ---------- force constants of the spring model ----------
  let K1 = 28.1, K2 = 5.0, theta = 30, mode = 'push', clickSel = 'pushed';
  function kindOf(i, j) {
    if (i === j) return 'same';
    const a = L.atoms[i], b = L.atoms[j], rr = Math.hypot(b.x - a.x, b.y - a.y);
    return Math.abs(rr - DNN) < 1e-6 ? 'nn' : Math.abs(rr - A) < 1e-6 ? 'nnn' : 'none';
  }
  // 2x2 block Phi_{i,j} (rows alpha of atom i, columns beta of atom j), eV/Å^2
  function blk(i, j) {
    const at = L.atoms;
    if (i === j) { // on-site: +K n n^T summed over the springs attached to i
      let xx = 0, xy = 0, yy = 0;
      for (const [list, K] of [[at[i].nn, K1], [at[i].nnn, K2]]) for (const n of list) {
        const dx = at[n].x - at[i].x, dy = at[n].y - at[i].y, rr = Math.hypot(dx, dy), ux = dx / rr, uy = dy / rr;
        xx += K * ux * ux; xy += K * ux * uy; yy += K * uy * uy;
      }
      return [[xx, xy], [xy, yy]];
    }
    const kd = kindOf(i, j), K = kd === 'nn' ? K1 : kd === 'nnn' ? K2 : 0;
    if (!K) return zero();
    const dx = at[j].x - at[i].x, dy = at[j].y - at[i].y, rr = Math.hypot(dx, dy), ux = dx / rr, uy = dy / rr;
    return [[-K * ux * ux, -K * ux * uy], [-K * ux * uy, -K * uy * uy]];
  }
  // one printed force scale (px per eV/Å): the largest that keeps every arrow of the selected atom in view, for any direction of d
  function fitScale(sel, on) {
    const at = L.atoms, a = at[sel], m = 6, w = L.w, h = L.h;
    const s0 = Math.max(5, Math.round(0.62 * L.Dpx / 5) * 5);
    const lam = 0.5 * (on[0][0] + on[1][1]) + Math.sqrt(0.25 * (on[0][0] - on[1][1]) ** 2 + on[0][1] ** 2);
    const rho = EXAG * DMAG * L.pxA, room = Math.min(a.sx, w - a.sx, a.sy - BAND, h - a.sy) - m;
    const ok = s => {
      if (rho + lam * DMAG * s + 4 > room) return false;
      for (const [list, K] of [[a.nn, K1], [a.nnn, K2]]) for (const j of list) {
        const b = at[j], dx = b.sx - a.sx, dy = b.sy - a.sy, rr = Math.hypot(dx, dy), len = K * DMAG * s;
        for (const sg of [1, -1]) {
          const ex = b.sx + sg * dx / rr * len, ey = b.sy + sg * dy / rr * len;
          if (ex < m || ex > w - m || ey < BAND + m || ey > h - m) return false;
        }
      }
      return true;
    };
    for (const s of LADDER) if (s <= s0 && ok(s)) return s;
    return LADDER[LADDER.length - 1];
  }

  // ---------- drawing helpers ----------
  function drawArrows(ctx, list, halo) {
    const geo = list.map(a => {
      const dx = a.x1 - a.x0, dy = a.y1 - a.y0, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
      const hl = Math.min(a.head, 0.6 * len), hw = hl * 0.48;
      return Object.assign({ ux, uy, hl, hw, bx: a.x1 - ux * hl, by: a.y1 - uy * hl }, a);
    });
    const tri = g => { ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.bx - g.uy * g.hw, g.by + g.ux * g.hw); ctx.lineTo(g.bx + g.uy * g.hw, g.by - g.ux * g.hw); ctx.closePath(); };
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = halo;
    for (const g of geo) { ctx.lineWidth = g.lw + 3; ctx.beginPath(); ctx.moveTo(g.x0, g.y0); ctx.lineTo(g.bx, g.by); ctx.stroke(); ctx.lineWidth = 3; tri(g); ctx.stroke(); }
    ctx.lineCap = 'butt';
    for (const g of geo) {
      ctx.strokeStyle = g.col; ctx.lineWidth = g.lw; ctx.beginPath(); ctx.moveTo(g.x0, g.y0); ctx.lineTo(g.bx + g.ux * 0.8, g.by + g.uy * 0.8); ctx.stroke();
      ctx.fillStyle = g.col; tri(g); ctx.fill();
    }
  }
  // greedy label placement: never on another label or outside the patch; avoids arrows and atoms where it can
  function makePlacer(ctx, bounds, segs, discs, fam) {
    const boxes = [];
    return (parts, size, ax, ay, rad, pref) => {
      const tw = rtW(ctx, parts, size, fam), th = Math.ceil(size * 1.4);
      let best = null, bp = Infinity;
      [0, 45, -45, 90, -90, 135, -135, 180].forEach((da, k) => {
        for (const ex of [0, 7, 14]) {
          const ang = (pref + da) * Math.PI / 180, c = Math.cos(ang), s = Math.sin(ang), dd = rad + 3 + ex;
          const px = ax + c * dd, py = ay + s * dd;
          const x0 = c > 0.38 ? px : c < -0.38 ? px - tw : px - tw / 2, y0 = s > 0.38 ? py : s < -0.38 ? py - th : py - th / 2;
          const b = [x0 - 2, y0 - 1, x0 + tw + 2, y0 + th + 1];
          let p = k * 0.8 + ex * 0.25;
          if (b[0] < bounds[0] || b[2] > bounds[2] || b[1] < bounds[1] || b[3] > bounds[3]) p += 1e4;
          for (const o of boxes) if (boxHit(b, o)) p += 1e4;
          for (const sg of segs) if (segBox(sg, b)) p += 30;
          for (const dc of discs) if (discBox(dc[0], dc[1], dc[2], b)) p += 20;
          if (p < bp) { bp = p; best = b; }
        }
      });
      if (!best || bp >= 1e4) return null;
      boxes.push(best);
      return { x: best[0] + 2, y: best[1] + 1 + Math.round(size * 0.92), box: best };
    };
  }
  // ---------- state ----------
  let selKey = DEF_SEL, probeKey = DEF_PROBE, hintUntil = 0;
  function compute() {
    if (!L || L.w !== cv.w || L.h !== cv.h) build();
    const at = L.atoms;
    let sel = L.index.get(selKey);
    if (sel === undefined || !at[sel].pick) { selKey = DEF_SEL; sel = L.index.get(DEF_SEL); }
    let pr = L.index.get(probeKey);
    if (pr === undefined || !at[pr].vis) { probeKey = DEF_PROBE; pr = L.index.get(DEF_PROBE); }
    const th = theta * Math.PI / 180, d = [DMAG * Math.cos(th), DMAG * Math.sin(th)];
    const on = blk(sel, sel);
    return { sel, pr, d, on, s: fitScale(sel, on) };
  }
  const shift = () => mode === 'shift';
  // where atom i is drawn: the pushed atom (mode A) or every atom (mode B) is displaced by EXAG*d
  const drawPos = (c, i) => {
    const a = L.atoms[i];
    if (shift() || i === c.sel) return [a.sx + EXAG * c.d[0] * L.pxA, a.sy - EXAG * c.d[1] * L.pxA];
    return [a.sx, a.sy];
  };

  // ---------- left panel: the lattice ----------
  function drawLattice(c) {
    cv.clear();
    const ctx = cv.ctx, w = cv.w, h = cv.h, at = L.atoms, r = L.r, sel = c.sel, mB = shift();
    const fUI = EPP.css('--font-ui'), cInk = EPP.color('ink'), cPh = EPP.color('phonon'), cMut = EPP.color('muted');
    const cAt = [EPP.color(SP[0].col), EPP.color(SP[1].col)], halo = EPP.alpha('surface', 0.9), back = EPP.alpha('surface', 0.82);
    const pos = i => drawPos(c, i);
    const dpx = [EXAG * c.d[0] * L.pxA, -EXAG * c.d[1] * L.pxA];
    ctx.save();
    ctx.beginPath(); ctx.rect(0, BAND, w, h - BAND); ctx.clip();
    if (mB) { // equilibrium positions under the rigidly shifted sheet
      ctx.strokeStyle = EPP.alpha('muted', 0.55); ctx.lineWidth = 1; ctx.setLineDash([2, 2]); ctx.beginPath();
      for (const a of at) if (a.vis) { ctx.moveTo(a.sx + r, a.sy); ctx.arc(a.sx, a.sy, r, 0, 2 * Math.PI); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    // springs: the 9 attached to the selected atom are drawn darker; line width grows with stiffness
    const lw1 = 0.6 + 0.035 * K1, lw2 = 0.5 + 0.08 * K2;
    const springs = (pairs, attached) => {
      ctx.beginPath();
      for (const [i, j] of pairs) {
        if ((i === sel || j === sel) !== attached || (!at[i].vis && !at[j].vis)) continue;
        const p = pos(i), q = pos(j); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
      }
      ctx.stroke();
    };
    ctx.lineCap = 'round';
    ctx.strokeStyle = EPP.alpha('muted', 0.5); ctx.lineWidth = lw1; springs(L.nnPairs, false);
    ctx.strokeStyle = cMut; ctx.lineWidth = lw1 + 0.6; springs(L.nnPairs, true);
    if (K2 > 0) {
      ctx.setLineDash([0.1, 3.6]);
      ctx.strokeStyle = EPP.alpha('muted', 0.55); ctx.lineWidth = lw2 + 0.4; springs(L.nnnPairs, false);
      ctx.strokeStyle = cMut; ctx.lineWidth = lw2 + 0.9; springs(L.nnnPairs, true);
      ctx.setLineDash([]);
    }
    // atoms, with the species letter inside (the direct label of the 'c4' series)
    const fs = Math.round(r * 1.15);
    for (let i = 0; i < at.length; i++) {
      if (!at[i].vis) continue;
      const p = pos(i); ctx.fillStyle = cAt[at[i].k]; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.fillStyle = EPP.color('surface'); ctx.font = `600 ${fs}px ${fUI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < at.length; i++) { if (!at[i].vis) continue; const p = pos(i); ctx.fillText(SP[at[i].k].name, p[0], p[1] + 0.5); }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const a0 = at[sel], pS = pos(sel);
    if (!mB) { // dashed outline at the equilibrium position of P
      ctx.strokeStyle = cAt[a0.k]; ctx.lineWidth = 1.4; ctx.setLineDash([3, 2.5]);
      ctx.beginPath(); ctx.arc(a0.sx, a0.sy, r, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
    }
    const ringAt = i => { const p = pos(i); ctx.strokeStyle = cInk; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p[0], p[1], r + 4, 0, 2 * Math.PI); ctx.stroke(); };
    if (mB) ringAt(sel); else if (at[c.pr].vis) ringAt(c.pr);
    // force arrows
    // a force arrow starts at the rim of its atom (rim = r) or, in the tip-to-tail chain, at the given point (rim = 0)
    const arrows = [], add = (p, F, col, lw, head, tag, rim = 0) => {
      const fl = Math.hypot(F[0], F[1]), p0 = fl > 0 && rim ? [p[0] + rim * F[0] / fl, p[1] - rim * F[1] / fl] : p;
      const p1 = [p0[0] + F[0] * c.s, p0[1] - F[1] * c.s];
      if (Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) >= 1) arrows.push({ x0: p0[0], y0: p0[1], x1: p1[0], y1: p1[1], col, lw, head, tag });
      return p1;
    };
    const labels = [];
    if (!mB) {
      for (const [list, nn] of [[a0.nn, true], [a0.nnn, false]]) for (const j of list) {
        const tip = add(pos(j), neg(mv(blk(j, sel), c.d)), cInk, nn ? 2 : 1.5, nn ? 7 : 5.5, j, r + 1);
        if (j === c.pr && arrows.length && arrows[arrows.length - 1].tag === j) labels.push({ parts: ['*F_X'], col: cInk, at: tip, rad: 3, pref: Math.atan2(tip[1] - pos(j)[1], tip[0] - pos(j)[0]) * 180 / Math.PI });
      }
      const FP = neg(mv(c.on, c.d)), nNb = arrows.length;
      let tipP = add(pS, FP, cPh, 2.4, 8, 'P', r + 1);

    if (i < 0) return;
    const a = L.atoms[i];
    if (!shift() && clickSel === 'probe') probeKey = keyOf(a);
    else if (a.pick) selKey = keyOf(a);
    else { hintUntil = performance.now() + 2600; setTimeout(() => redraw(true), 2700); }
    redraw(true);
  });

  // optional slow rotation of d (starts paused; EPP.anim pauses it offscreen and under reduced motion)
  const host = document.createElement('div');
  host.className = 'ctrl';
  host.innerHTML = '<span class="lab"><span>rotate <b>d</b> slowly</span></span>';
  elCtl.appendChild(host);
  anim = EPP.anim(fig, (t, dt) => {
    if (dt > 0) {
      thA = (thA + 20 * dt) % 360;
      const th = Math.round(thA) % 360;
      if (th === theta) return;
      theta = th; ui.set('theta', th, true);
    }
    redraw(false);
  }, { buttonHost: host, autoplay: false });
  anim.button.addEventListener('click', () => redraw(true));
  cv.onResize(() => redraw(true));
  cb.onResize(() => redraw(true));
})();
</script>
