  <figure class="viz" id="viz-a1-waves">
    <p class="viz-title">Why waves: the monatomic chain <span class="tag">interactive</span></p>
    <p class="a1-waves-hd" style="margin:0 0 6px;font-family:var(--font-ui);font-size:0.86rem;font-weight:600;color:var(--fg-2)">(a) The chain: every atom carries the same wave, shifted in phase</p>
    <div class="a1-waves-chain"></div>
    <div class="legend a1-waves-leg1"></div>
    <div class="controls a1-waves-main" style="grid-template-columns:minmax(0,1fr) auto;align-items:end"></div>
    <div class="viz-grid two a1-waves-grid" style="margin-top:14px">
      <div>
        <p class="a1-waves-hd" style="margin:0 0 6px;font-family:var(--font-ui);font-size:0.86rem;font-weight:600;color:var(--fg-2)">(b) Complex plane: atoms $\ell-1,\ \ell,\ \ell+1$</p>
        <div class="a1-waves-phasor"></div>
      </div>
      <div>
        <p class="a1-waves-hd" style="margin:0 0 6px;font-family:var(--font-ui);font-size:0.86rem;font-weight:600;color:var(--fg-2)">(c) Dispersion and the allowed wavevectors</p>
        <div class="a1-waves-disp"></div>
        <div class="legend a1-waves-leg2"></div>
      </div>
    </div>
    <div class="a1-waves-ctrls" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))"></div>
    <div class="readout a1-waves-ro" aria-live="polite"><span>$qa$<b class="a1-waves-v-qa"></b></span><span>$K_{\mathrm{eff}}(q)=2K(1-\cos qa)$<b class="a1-waves-v-keff"></b></span><span>$\hbar\omega(q)$<b class="a1-waves-v-hw"></b></span><span>wavelength $2\pi/|q|$<b class="a1-waves-v-lam"></b></span></div>
    <div class="readout a1-waves-ro2" aria-live="polite"><span>$u_{\ell+1}+u_{\ell-1}=2\cos(qa)\,u_\ell$ at $u_\ell=1$<b class="a1-waves-v-sum"></b></span><span>BvK index $s=N_\ell qa/2\pi$<b class="a1-waves-v-s"></b></span><span class="a1-waves-ro-al" hidden>wavelength of $q+2\pi/a$<b class="a1-waves-v-lam2"></b></span></div>
    <figcaption><p class="cap-key"><strong>What to notice.</strong> At $q=0$ all arrows coincide and <span class="nw">$\omega=0$;</span> at $q=\pi/a$ the neighbours point opposite to $u_\ell$ and <span class="nw">$K_{\mathrm{eff}}=4K$.</span> With aliasing on, $q$ and $q+2\pi/a$ pass through the same stem tips.</p><div class="cap-more"><p><strong>Marks.</strong> In (b) the dashed arrows are the pulls of the two springs on atom <span class="nw">$\ell$,</span> divided by <span class="nw">$K$:</span> $u_{\ell+1}-u_\ell$ (right spring) and $u_{\ell-1}-u_\ell$ (left spring), drawn from the tip of <span class="nw">$u_\ell$;</span> their sum, $F_\ell/K$, is the thick amber arrow from the origin, on the thin line through $u_\ell$ and pointing away from it: <span class="nw">$F_\ell=-K_{\mathrm{eff}}(q)\,u_\ell$.</span> The dotted line is the projection of $u_\ell$ onto the real axis; the dot sits at the physical displacement <span class="nw">$\mathrm{Re}\,u_\ell$,</span> the stem height of atom $\ell$ in (a). Small dots are atoms $\ell+2$ to <span class="nw">$\ell+N_\ell-1$,</span> each turned by a further <span class="nw">$qa$;</span> the ring, atom <span class="nw">$\ell+N_\ell$,</span> meets the tip of $u_\ell$ only for an allowed <span class="nw">$q$.</span></p><p><strong>Try.</strong> Pick $q$ with the slider or in (c), where a click on a hollow dot picks it exactly; Play runs the time. In (b), drag the tip of $u_{\ell\pm1}$ to change <span class="nw">$qa$,</span> or of $u_\ell$ to set the time. “Snap $q$ to the BvK grid” restricts $q$ to the hollow dots, whose number is <span class="nw">$N_\ell$;</span> the $N_\ell$ slider sets the number of cells in the Born–von Kármán ring, from 4 to 24. “Continuous wave” shows or hides the amber curve; “aliasing” adds the wave <span class="nw">$q+2\pi/a$.</span></p><p><strong>Model.</strong> The chain of (A1.7) with the mass of carbon, <span class="nw">$M=12.01$ amu</span>, the C–C bond of graphene as spacing, <span class="nw">$a=1.42$ Å</span> (literature values, illustrative), and a model spring <span class="nw">$K=20$ eV/Å²</span>. The atoms follow (A1.9) and (A1.10), with $\hbar\omega$ up to <span class="nw">166.9 meV</span> at <span class="nw">$q=\pi/a$;</span> the hollow dots obey (A1.11). With $\ell=0$ and $\xi$ real, the arrows in (b) turn clockwise. Displacements are exaggerated; one period lasts <span class="nw">3.2 s</span>.</p></div></figcaption>
  </figure>
<script>
(() => {
  const fig = document.getElementById('viz-a1-waves');
  if (!fig || !window.EPP) return;
  // Toy, carbon-like monatomic chain. K in eV/Å^2, M in amu: hbar*omega [meV] = HW * sqrt(K/M)
  const M = 12.01, K = 20, ALAT = 1.42, HW = 64.654;
  const WMAX = 2 * HW * Math.sqrt(K / M);              // 166.9 meV at q = π/a
  const TPER = 3.2, TAU = 2 * Math.PI;                 // one period of the wave lasts TPER seconds on screen
  const hwOf = (x) => WMAX * Math.abs(Math.sin(0.5 * Math.PI * x));   // x = qa/π
  const pmod = (v, n) => ((v % n) + n) % n;
  const fold = (x) => 1 - pmod(1 - x, 2);              // qa/π folded into (−1, 1]
  const wrapPi = (v) => v - TAU * Math.ceil((v - Math.PI) / TAU);   // angle into (−π, π]
  const mfix = (v, d) => EPP.fix(Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v, d);   // never "−0.00"
  const minus = (v) => String(v).replace('-', '−');
  const I = (s) => `<i style="font-family:var(--font-text)">${s}</i>`;   // a running variable inside an HTML label
  const nw = (s) => `<span class="nw">${s}</span>`;
  const sel = (s) => fig.querySelector(s);
  // nearest Born–von Kármán index s, with q = 2πs/(N a) kept in (−π/a, π/a]
  function snapK(x, N) {
    let k = Math.round(x * N / 2);
    while (2 * k / N > 1 + 1e-9) k -= N;
    while (2 * k / N <= -1 + 1e-9) k += N;
    return k;
  }
  // The wavevector shown (x = qa/π) and its BvK index s, null off the grid. Snapping moves q to the nearest
  // allowed value; without it, a slider step of 0.01 within 0.005 of an allowed value lands on that value exactly.
  function qPick(v, N, snap) {
    if (snap) { const k = snapK(v, N); return { qn: 2 * k / N, k }; }
    const k = Math.round(v * N / 2);
    return Math.abs(v - 2 * k / N) < 0.0051 ? { qn: 2 * k / N, k } : { qn: v, k: null };
  }
  // canvas text in parts [text, italic]: upright parts in font fu, italic parts (variables) in font fi
  const segW = (ctx, sg, size, fu, fi) => sg.reduce((s, p) => s + EPP.measureRich(ctx, p[0], size, p[1] ? fi : fu, { italic: !!p[1] }), 0);
  function segDraw(ctx, sg, x, y, size, fu, fi, align) {
    const wT = segW(ctx, sg, size, fu, fi);
    let x0 = align === 'center' ? x - wT / 2 : (align === 'right' ? x - wT : x);
    for (const p of sg) x0 += EPP.drawRich(ctx, p[0], x0, y, { size, font: p[1] ? fi : fu, italic: !!p[1] });
    return wT;
  }

  // ---------- panels ----------
  const cvC = EPP.canvas(sel('.a1-waves-chain'), { height: 250 });
  cvC.canvas.setAttribute('role', 'img');
  cvC.canvas.setAttribute('aria-label', 'Animated monatomic chain: the longitudinal motion of the atoms on springs, and the same displacements drawn as vertical stems with the continuous wave through their tips');
  const cvP = EPP.canvas(sel('.a1-waves-phasor'), { aspect: 1, minHeight: 260, maxHeight: 440 });
  cvP.canvas.setAttribute('role', 'img');
  cvP.canvas.setAttribute('aria-label', 'Complex plane with the rotating displacement arrows of atoms l minus 1, l and l plus 1, the pulls of the two springs and the net force on atom l, which points opposite to its displacement');
  cvP.canvas.style.touchAction = 'none';   // the arrow tips are dragged in every direction, so a touch here must not pan the page
  // tick labels of (c): π upright, the lattice constant a italic
  const tk = (v, s) => ({ v, sg: v === 0 ? [['0']] : [[s], ['a', 1]] });
  const TK1 = [tk(-1, '−π/'), tk(-0.5, '−π/2'), tk(0), tk(0.5, 'π/2'), tk(1, 'π/')];
  const TK3 = [-3, -2, -1, 0, 1, 2, 3].map(k => tk(k, `${k < 0 ? '−' : ''}${Math.abs(k) === 1 ? '' : Math.abs(k)}π/`));
  const gridOf = (T) => T.map(t => ({ v: t.v, label: '' }));
  const pD = new EPP.Plot(sel('.a1-waves-disp'), {
    xlabel: '', ylabel: '', margin: { l: 58, b: 44 }, xlim: [-1, 1], ylim: [0, 180], xname: 'qa/π', xticks: gridOf(TK1),
    yticks: [0, 30, 60, 90, 120, 150, 180], aspect: 0.95, minHeight: 240, maxHeight: 420, legend: false,
    hoverX: (v) => mfix(v, 2), hoverY: (v) => EPP.fix(v, 1) + ' meV',
    ariaLabel: 'Phonon dispersion of the monatomic chain with the wavevectors allowed by the Born–von Kármán condition and the current wavevector'
  });
  const legA = sel('.a1-waves-leg1'), legC = sel('.a1-waves-leg2');
  const roV = {};
  ['qa', 'keff', 'hw', 'lam', 'sum', 's', 'lam2'].forEach(k => { roV[k] = sel('.a1-waves-v-' + k); });
  const roAl = sel('.a1-waves-ro-al');
  const X1 = EPP.linspace(-1, 1, 241), Y1 = X1.map(hwOf);
  const XL = EPP.linspace(-3, -1, 241), YL = XL.map(hwOf), XR = EPP.linspace(1, 3, 241), YR = XR.map(hwOf);

  let cur = null, anim = null, tau = 0;   // tau = ωt/2π, advanced only while ω > 0
  const phase = () => (cur && cur.hw < 1e-9 ? 0 : TAU * tau);   // ωt; at q = 0, ω = 0 and ωt = 0 for all t
  const qState = { snap: false, N: 12 };

  function compute(s) {
    const g = qPick(s.q, s.N, s.snap), qa = Math.PI * g.qn, F = 2 * (1 - Math.cos(qa));
    return { qn: g.qn, qa, F, Keff: K * F, hw: hwOf(g.qn), N: s.N, k: g.k, sIdx: g.qn * s.N / 2, wave: !!s.wave, alias: !!s.alias };
  }

  // ---------- (c) dispersion ----------
  function drawDisp() {
    if (!cur) return;
    const al = cur.alias, N = cur.N, qn = cur.qn, hw = cur.hw;
    pD.opt.xticks = gridOf(al ? TK3 : TK1);
    const L = [];
    if (al) {
      L.push({ type: 'band', x0: -1, x1: 1, color: 'phonon', alpha: 0.08, text: 'first Brillouin zone' });
      L.push({ type: 'vline', at: -1, color: 'muted', width: 1, dash: [4, 3] }, { type: 'vline', at: 1, color: 'muted', width: 1, dash: [4, 3] });
      L.push({ type: 'line', x: XL, y: YL, color: 'phonon', opacity: 0.38, label: 'ħω(q)' }, { type: 'line', x: XR, y: YR, color: 'phonon', opacity: 0.38, label: 'ħω(q)' });
    }
    L.push({ type: 'line', x: X1, y: Y1, color: 'phonon', label: 'ħω(q)' });
    const bx = [], by = [], ex = [], ey = [];
    for (let k = -Math.floor((N - 1) / 2); k <= Math.floor(N / 2); k++) {
      const x = 2 * k / N; bx.push(x); by.push(hwOf(x));
      if (al) for (const m of [-2, 2]) { const xe = x + m; if (xe >= -3 - 1e-9 && xe <= 3 + 1e-9) { ex.push(xe); ey.push(hwOf(xe)); } }
    }
    L.push({ type: 'points', x: bx, y: by, color: 'phonon', r: 3, hollow: true });
    if (al) L.push({ type: 'points', x: ex, y: ey, color: 'phonon', r: 3, hollow: true, opacity: 0.45 });
    L.push({ type: 'segments', segs: [[qn, 0, qn, hw]], color: 'muted', width: 1, dash: [2, 3] });
    if (al) L.push({ type: 'segments', segs: [[qn, hw, qn + 2, hw]], color: 'c4', width: 1.3, dash: [2, 3] });
    L.push({ type: 'points', x: [qn], y: [hw], color: 'ink', r: 5 });
    if (al) L.push({ type: 'points', x: [qn + 2], y: [hw], color: 'c4', r: 5 });
    pD.draw(L, { xlim: al ? [-3, 3] : [-1, 1] });
  }
  // axis names, tick labels and the q labels are drawn here, so that the variables can be italic
  const render0 = pD.render.bind(pD);
  pD.render = () => { render0(); dispText(); };
  function dispText() {
    const ctx = pD.ctx, w = pD.cv.w, h = pD.cv.h, m = pD.m;
    if (!w || !h || !cur) return;
    const fUI = EPP.css('--font-ui'), fTx = EPP.css('--font-text');
    ctx.textBaseline = 'top'; ctx.fillStyle = EPP.color('muted');
    for (const t of (cur.alias ? TK3 : TK1)) { const X = pD.X(t.v); if (X >= m.l - 0.5 && X <= w - m.r + 0.5) segDraw(ctx, t.sg, X, h - m.b + 6, 11, fUI, fTx, 'center'); }
    ctx.textBaseline = 'alphabetic'; ctx.fillStyle = EPP.color('ink');
    segDraw(ctx, [['wavevector '], ['q', 1]], m.l + (w - m.l - m.r) / 2, h - 8, 12.5, fUI, fTx, 'center');
    ctx.save(); ctx.translate(14, m.t + (h - m.t - m.b) / 2); ctx.rotate(-Math.PI / 2);
    segDraw(ctx, [['ħω', 1], [' (meV)']], 0, 0, 12.5, fUI, fTx, 'center');
    ctx.restore();
    // labels on the concave side of the curve: upper left on the rising flank, upper right on the falling one
    const side = cur.qn >= 0 ? -1 : 1, al = side < 0 ? 'right' : 'left', y = pD.Y(cur.hw) - 9;
    ctx.textBaseline = 'middle'; ctx.fillStyle = EPP.textColor('ink');
    segDraw(ctx, [['q', 1]], pD.X(cur.qn) + 9 * side, y, 14, fUI, fTx, al);
    if (cur.alias) { ctx.fillStyle = EPP.textColor('c4'); segDraw(ctx, [['q', 1], [' + 2π/'], ['a', 1]], pD.X(cur.qn + 2) + 9 * side, y, 12.5, fUI, fTx, al); }
  }

  // ---------- legends (HTML, colours read at render time) ----------
  const swLine = (c, dash) => `<svg width="24" height="10" aria-hidden="true" style="vertical-align:middle;margin-right:6px"><line x1="1" y1="5" x2="23" y2="5" stroke="${EPP.color(c)}" stroke-width="2.2"${dash ? ' stroke-dasharray="5 3"' : ''}/></svg>`;
  const swDot = (c, hollow) => `<svg width="12" height="12" aria-hidden="true" style="vertical-align:middle;margin-right:5px"><circle cx="6" cy="6" r="4" fill="${hollow ? 'none' : EPP.color(c)}" stroke="${EPP.color(c)}" stroke-width="1.6"/></svg>`;
  const item = (sw, html) => `<span class="item">${sw}${html}</span>`;
  function legends() {
    if (!cur) return;
    const a = [];
    if (cur.wave) a.push(item(swLine('phonon'), `continuous wave Re[${I('ξ')}e<sup>i(${I('qx')}−${I('ωt')})</sup>], ${I('x')} along the chain`));
    if (cur.alias) a.push(item(swLine('c4', true), `the wave with ${I('q')} + 2π/${I('a')}: same stem tips`));
    legA.innerHTML = a.join(''); legA.hidden = !a.length; legA.style.display = a.length ? '' : 'none';   // .legend sets display: flex
    const c = [item(swLine('phonon'), `${I('ħω')}(${I('q')})`), item(swDot('phonon', true), `allowed ${I('q')}, ${I('N')}<sub>${I('ℓ')}</sub> = ${cur.N}`), item(swDot('ink'), `current ${I('q')}`)];
    if (cur.alias) c.push(item(swDot('c4'), `${I('q')} + 2π/${I('a')}, same ${I('ħω')}`));
    legC.innerHTML = c.join('');
  }

  // ---------- readouts: the keys are static MathJax in the markup, only the values change ----------
  function readouts() {
    if (!cur) return;
    const { qa, qn, hw } = cur, c = Math.cos(qa), s = Math.sin(qa);
    const cplx = (re, im) => nw(`(${mfix(re, 3)} ${im < -5e-4 ? '−' : '+'} ${EPP.fix(Math.abs(im), 3)}i)`);
    const lam = Math.abs(qa) > 1e-12 ? TAU * ALAT / Math.abs(qa) : Infinity;
    roV.qa.innerHTML = `${nw(mfix(qa, 3) + ' rad')} = ${nw(mfix(qn, 3) + 'π')}`;
    roV.keff.innerHTML = `${nw(EPP.fix(cur.Keff, 2) + ' eV/Å²')} = ${nw(EPP.fix(cur.F, 3) + ' ' + I('K'))}`;
    roV.hw.innerHTML = nw(EPP.fix(hw, 1) + ' meV');
    roV.lam.innerHTML = isFinite(lam) ? `${nw(EPP.fix(lam, 2) + ' Å')} = ${nw(EPP.fix(lam / ALAT, 2) + ' ' + I('a'))}` : nw(`∞ (${I('q')} = 0)`);
    roV.sum.innerHTML = `${cplx(c, s)} + ${cplx(c, -s)} = ${mfix(2 * c, 3)}`;
    roV.s.innerHTML = cur.k !== null ? `${minus(cur.k)}: allowed` : `${mfix(cur.sIdx, 2)}: not an integer, not allowed`;
    roAl.hidden = !cur.alias;
    if (cur.alias) roV.lam2.innerHTML = nw(EPP.fix(TAU * ALAT / Math.abs(qa + TAU), 2) + ' Å');
  }

  // ---------- drawing helpers ----------
  function spring(ctx, xa, xb, y, col) {
    const Ls = xb - xa;
    ctx.strokeStyle = col; ctx.lineWidth = Math.min(1.4, Math.max(1, Ls / 7)); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    if (Ls < 6) { ctx.moveTo(xa, y); ctx.lineTo(xb, y); ctx.stroke(); return; }
    // coil count varies continuously with length; sin(πs) tapers both ends
    const lead = 0.12 * Ls, body = Ls - 2 * lead, coils = EPP.clamp(body / 6.5, 1, 4), amp = 3.2, ns = Math.max(12, Math.ceil(body));
    ctx.moveTo(xa, y); ctx.lineTo(xa + lead, y);
    for (let j = 1; j <= ns; j++) { const s = j / ns; ctx.lineTo(xa + lead + body * s, y - amp * Math.sin(TAU * coils * s) * Math.sin(Math.PI * s)); }
    ctx.lineTo(xb, y); ctx.stroke();
  }
  function arrow(ctx, x0, y0, x1, y1, col, lw, head, dash) {
    const Lr = Math.hypot(x1 - x0, y1 - y0); if (Lr < 0.5) return;
    const a = Math.atan2(y1 - y0, x1 - x0), hs = Math.min(head, 0.65 * Lr);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'butt';
    ctx.setLineDash(dash || []);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - 0.8 * hs * Math.cos(a), y1 - 0.8 * hs * Math.sin(a)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - hs * Math.cos(a - 0.4), y1 - hs * Math.sin(a - 0.4)); ctx.lineTo(x1 - hs * Math.cos(a + 0.4), y1 - hs * Math.sin(a + 0.4));
    ctx.closePath(); ctx.fill();
  }
  // label boxes: no overlap with other labels or with the arrows
  const overlap = (a, b, px, py) => a.x0 - px < b.x1 && b.x0 - px < a.x1 && a.y0 - py < b.y1 && b.y0 - py < a.y1;
  function segHits(s, b, pad) {   // Liang–Barsky: does segment s cross box b?
    const xmin = b.x0 - pad, xmax = b.x1 + pad, ymin = b.y0 - pad, ymax = b.y1 + pad, dx = s[2] - s[0], dy = s[3] - s[1];
    const p = [-dx, dx, -dy, dy], q = [s[0] - xmin, xmax - s[0], s[1] - ymin, ymax - s[1]];
    let t0 = 0, t1 = 1;
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; continue; }
      const r = q[i] / p[i];
      if (p[i] < 0) { if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; }
    }
    return true;
  }

  // ---------- (a) chain ----------
  function drawChain() {
    const ctx = cvC.ctx, w = cvC.w, h = cvC.h;
    cvC.clear();
    if (!cur || w < 40) return;
    const fUI = EPP.css('--font-ui'), fTx = EPP.css('--font-text');
    const narrow = w < 520, n = narrow ? 9 : 13, nh = (n - 1) / 2;
    const padX = narrow ? 20 : 30, dx = (w - 2 * padX) / (n - 1), xc = w / 2;
    const X = (l) => xc + l * dx;
    const qa = cur.qa, ph = phase();
    const re = (l) => Math.cos(qa * l - ph);            // Re u_ℓ / |ξ| at x = ℓa
    const colOf = (l) => (l === 0 ? 'phonon' : (Math.abs(l) === 1 ? 'ink' : 'c5'));
    const cMuted = EPP.color('muted'), cRule = EPP.color('rule');
    // header row: what is drawn, and the time
    ctx.textBaseline = 'alphabetic'; ctx.fillStyle = cMuted;
    const head = narrow ? 'real motion, along the chain' : 'real motion: the atoms move along the chain (exaggerated)';
    EPP.drawRich(ctx, head, 6, 14, { size: 11, font: fUI });
    const tag = cur.hw < 1e-9 ? [['ω', 1], [' = 0: rigid translation, no oscillation']] : [['time '], ['ωt', 1], [`/2π = ${(Math.floor(pmod(tau, 1) * 100) / 100).toFixed(2)}`]];
    const tagRow = 6 + EPP.measureRich(ctx, head, 11, fUI) + 14 + segW(ctx, tag, 11, fUI, fTx) > w - 6 ? 28 : 14;
    ctx.fillStyle = EPP.color('fg2');
    segDraw(ctx, tag, w - 6, tagRow, 11, fUI, fTx, 'right');
    // longitudinal strip: atoms on springs, displaced along the chain
    const yL = 50, rA = narrow ? 5 : 6, AL = Math.min(0.2 * dx, 11);
    const at = [];
    for (let l = -nh - 1; l <= nh + 1; l++) at.push({ l, x: X(l) + AL * re(l) });
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
    ctx.strokeStyle = cRule; ctx.lineWidth = 1;
    for (const A of at) { ctx.beginPath(); ctx.moveTo(X(A.l), yL - rA - 8); ctx.lineTo(X(A.l), yL - rA - 3); ctx.stroke(); }
    for (let i = 0; i < at.length - 1; i++) spring(ctx, at[i].x + rA, at[i + 1].x - rA, yL, cMuted);
    for (const A of at) { ctx.fillStyle = EPP.color(colOf(A.l)); ctx.beginPath(); ctx.arc(A.x, yL, rA, 0, TAU); ctx.fill(); }
    ctx.restore();
    // labels of the three atoms of panel (b)
    ctx.textBaseline = 'alphabetic';

  // ---------- (b) phasors ----------

  function drawPhasor() {

    const cx = w / 2, cy = h / 2, half = Math.min(w, h) / 2 - 22;

  // ---------- pointer: drag arrow tips in (b), click or drag in (c) ----------

  // two columns (b | c): the row sits under the panels; one column: right under (a), so that the slider
  // stays in view together with the chain and the phasors
  const wideMQ = matchMedia('(min-width: 720px)');
  const placeMain = () => { const ref = wideMQ.matches ? sel('.a1-waves-grid') : legA; if (ref.nextElementSibling !== main) ref.after(main); };
  placeMain();
  try { wideMQ.addEventListener('change', placeMain); } catch (e) { try { wideMQ.addListener(placeMain); } catch (_) {} }
  cur = compute(ui.state);
  anim = EPP.anim(fig, (t, dt) => {
    if (cur && cur.hw > 1e-9 && dt > 0) tau = pmod(tau + dt / TPER, 1);
    drawChain(); drawPhasor();
  }, { buttonHost: host });
  cvC.onResize(() => anim.redraw());
  cvP.onResize(() => anim.redraw());
  EPP.onTheme(() => { drawDisp(); legends(); });
})();
</script>
