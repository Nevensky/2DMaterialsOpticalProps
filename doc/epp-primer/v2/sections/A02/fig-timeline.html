  <figure class="viz" id="viz-a2-timeline">
    <p class="viz-title"><span>What replaces the potential gradient: from Bloch to first principles and Part B</span> <span class="tag">diagram</span></p>
    <div class="a2-timeline-era">
      <p class="a2-timeline-era-h">1929–1961 · the potential is modelled</p>
      <ol class="a2-timeline-grid" aria-label="1929 to 1961: model potentials and pseudopotentials">
        <li class="a2-timeline-card" data-cat="model"><span class="a2-timeline-year">1929</span><strong class="a2-timeline-who">Bloch</strong><span class="a2-timeline-f">$V_0\approx1.70$ eV, a constant <a class="eqref a2-timeline-eq" href="#a2-eq-bloch1929">(A2.23)</a></span><span class="a2-timeline-note">deformable continuum; first quantum theory of resistivity</span></li>
        <li class="a2-timeline-card" data-cat="model"><span class="a2-timeline-year">1931</span><strong class="a2-timeline-who">Nordheim</strong><span class="a2-timeline-f">$V_\kappa(\bq)/\OV\propto q^{-2}$</span><span class="a2-timeline-note">the bare rigid ion; far too strong</span></li>
        <li class="a2-timeline-card" data-cat="model"><span class="a2-timeline-year">1936</span><strong class="a2-timeline-who">Mott and Jones</strong><span class="a2-timeline-f">$V_\kappa$ cut at the Wigner–Seitz cell</span><span class="a2-timeline-note">first rough screening; finite as $q\to0$</span></li>
        <li class="a2-timeline-card" data-cat="model"><span class="a2-timeline-year">1937</span><strong class="a2-timeline-who">Bardeen</strong><span class="a2-timeline-f">$V_\kappa(\bq)/[\OV\,\varepsilon^{\mathrm e}(q)]$ <a class="eqref a2-timeline-eq" href="#a2-eq-bardeen">(A2.26)</a></span><span class="a2-timeline-note">self-consistent linear screening by the electrons</span></li>
        <li class="a2-timeline-card" data-cat="model"><span class="a2-timeline-year">1950</span><strong class="a2-timeline-who">Bardeen and Shockley</strong><span class="a2-timeline-f">$E_{\mathrm{def}}=$ $\OV\,\partial E_{n\bk}/\partial\OV$ <a class="eqref a2-timeline-eq" href="#a2-eq-def">(A2.29)</a></span><span class="a2-timeline-note">deformation potential, fitted to mobilities</span></li>
        <li class="a2-timeline-card" data-cat="model"><span class="a2-timeline-year">1950</span><strong class="a2-timeline-who">Fröhlich, Pelzer and Zienau</strong><span class="a2-timeline-f">$g\propto1/q$</span><span class="a2-timeline-note">long-range fields of polar crystals; <a class="nw" href="#a-polar">Section A.4</a></span><span class="a2-timeline-chipbox"><a class="a2-timeline-chip" href="#b-frohlich">precursor of B.8</a></span></li>
        <li class="a2-timeline-card" data-cat="model"><span class="a2-timeline-year">1955</span><strong class="a2-timeline-who">Bardeen and Pines</strong><span class="a2-timeline-f">$\varepsilon^{\mathrm e}(q)\to$ $\varepsilon^{\mathrm e}(q,\omega_{\bq\nu})$ <a class="eqref a2-timeline-eq" href="#a2-eq-pines">(A2.28)</a></span><span class="a2-timeline-note">first retarded vertex: screening lags the ions</span><span class="a2-timeline-chipbox"><a class="a2-timeline-chip" href="#b-frohlich">precursor of B.8</a></span></li>
        <li class="a2-timeline-card" data-cat="pseudo"><span class="a2-timeline-year">1959–61</span><strong class="a2-timeline-who">Phillips–Kleinman, Cohen–Heine, Sham</strong><span class="a2-timeline-f">$V_\kappa\to$ a pseudopotential</span><span class="a2-timeline-note">improved rigid ion, quantitative beyond alkali metals</span></li>
      </ol>
    </div>
    <div class="a2-timeline-era">
      <p class="a2-timeline-era-h">From 1985 · the potential is computed</p>
      <ol class="a2-timeline-grid" start="9" aria-label="From 1985: first principles and the electrodynamic theory of Part B">
        <li class="a2-timeline-card" data-cat="first"><span class="a2-timeline-year">1985</span><strong class="a2-timeline-who">Dacorogna, Cohen and Lam</strong><span class="a2-timeline-f">$g$ with self-consistent $\Delta_{\bq\nu}V^{\mathrm{KS}}$ <a class="eqref a2-timeline-eq" href="#a2-eq-g">(A2.16)</a></span><span class="a2-timeline-note">frozen phonons: aluminium from first principles</span></li>
        <li class="a2-timeline-card" data-cat="first"><span class="a2-timeline-year">1987–92</span><strong class="a2-timeline-who">Density-functional perturbation theory</strong><span class="a2-timeline-f">$\Delta V^{\mathrm{KS}}=$ $(\varepsilon^{\mathrm e})^{-1}\Delta V^{\mathrm{en}}$</span><span class="a2-timeline-note">any $\bq$ in one cell; <a class="nw" href="#a-dfpt">Section A.3</a></span></li>
        <li class="a2-timeline-card" data-cat="first"><span class="a2-timeline-year">2007–15</span><strong class="a2-timeline-who">Wannier interpolation</strong><span class="a2-timeline-f">dense $\bk$ and $\bq$ grids</span><span class="a2-timeline-note">polar long-range part treated analytically; <a class="nw" href="#a-polar">Section A.4</a></span><span class="a2-timeline-chipbox"><a class="a2-timeline-chip" href="#b-foundations">precursor of B.1</a></span></li>
        <li class="a2-timeline-card" data-cat="edyn"><span class="a2-timeline-year">draft</span><strong class="a2-timeline-who">EPP manuscript</strong><span class="a2-timeline-f">vertex from photon exchange</span><span class="a2-timeline-note">screened at the phonon frequency; <a class="nw" href="#b-frohlich">Section B.8</a></span></li>
      </ol>
    </div>
    <div class="legend-strip a2-timeline-leg" role="group" aria-label="Highlight the cards of one or more categories">
      <span class="a2-timeline-leg-k" aria-hidden="true">Highlight</span>
      <button type="button" class="btn a2-timeline-tog" data-k="model" aria-pressed="false"><svg width="22" height="8" viewBox="0 0 22 8" aria-hidden="true"><path d="M1 4H21" fill="none" stroke-width="3" style="stroke:var(--c-4)"/></svg>model potentials</button>
      <button type="button" class="btn a2-timeline-tog" data-k="pseudo" aria-pressed="false"><svg width="22" height="8" viewBox="0 0 22 8" aria-hidden="true"><path d="M1 4H21" fill="none" stroke-width="3" stroke-dasharray="4.5 2.5" style="stroke:var(--muted)"/></svg>pseudopotentials</button>
      <button type="button" class="btn a2-timeline-tog" data-k="first" aria-pressed="false"><svg width="22" height="8" viewBox="0 0 22 8" aria-hidden="true"><path d="M1 4H21" fill="none" stroke-width="3" style="stroke:var(--c-5)"/></svg>first principles</button>
      <button type="button" class="btn a2-timeline-tog" data-k="edyn" aria-pressed="false"><svg width="22" height="8" viewBox="0 0 22 8" aria-hidden="true"><path d="M1 2.2H21M1 5.8H21" fill="none" stroke-width="1.7" style="stroke:var(--c-photon)"/></svg>electrodynamic, Part B</button>
      <button type="button" class="btn a2-timeline-tog" data-k="pre" aria-pressed="false"><span class="a2-timeline-chip">Part B precursors</span></button>
      <span class="a2-timeline-status a2-timeline-sr" aria-live="polite"></span>
    </div>
    <figcaption><p class="cap-key"><strong>What to notice.</strong> Until 1985 each step was a better guess for the single effective potential in Bloch's formula. From 1985 the potential is computed, and what stays hard is numerical (dense grids of $\bk$ and $\bq$) and electrostatic (the long-range polar part). The chips mark the steps that the EPP formalism of Part B generalizes.</p><div class="cap-more">
      <p><strong>Marks.</strong> The bar on top of a card gives its category: model potentials, teal; pseudopotentials, grey and dashed; first principles, violet; the electrodynamics of Part B, rose and double. A chip marks a precursor of Part B and links to the section that generalizes it.</p>
      <p><strong>Try.</strong> Press “first principles”: the three steps that compute $g$ from first principles, all after 1985, stay bright. Release it and press “Part B precursors”: Fröhlich's polar coupling, the screening of Bardeen and Pines at the phonon frequency and the polar long-range part light up. Pressed buttons combine; with none pressed, every card is shown.</p>
      <p><strong>Model.</strong> Dates and attributions as told by the review. The formulas, in this section's notation, are explained in the subsections that follow: Bloch's constant $V_0$, <a class="eqref" href="#a2-eq-bloch1929">(A2.23)</a>; Bardeen's screened ion, with the Fourier transform $V_\kappa(\bq)$ of the ion's potential and the dielectric function $\varepsilon^{\mathrm e}$ of the electrons, <a class="eqref" href="#a2-eq-bardeen">(A2.26)</a>, and its dynamic form <a class="eqref" href="#a2-eq-pines">(A2.28)</a>; the deformation potential <a class="eqref" href="#a2-eq-def">(A2.29)</a>; the matrix element <a class="eqref" href="#a2-eq-g">(A2.16)</a>. The card of 1987–92 reads: the change of the Kohn–Sham potential is the bare change of $V^{\mathrm{en}}$ screened by the electrons (<a class="nw" href="#a-dfpt">Section A.3</a>).</p>
    </div></figcaption>
  </figure>
<script>
(() => {
  const fig = document.getElementById('viz-a2-timeline');
  if (!fig || !window.EPP) return;
  // The links lead to equations and sections of the primer. Shown outside its home section (as in the
  // isolated figure test) the figure keeps their text and drops the links, which would be dead there.
  if (!fig.closest('#a-coupling')) fig.querySelectorAll('a[href^="#"]').forEach(a => {
    const s = document.createElement('span');
    s.className = [...a.classList].filter(c => c !== 'eqref').join(' ');
    s.innerHTML = a.innerHTML;
    a.replaceWith(s);
  });

  // ---------- categories: the bar on top of each card (style, width in px, colour) ----------
  // c4 and photon are close for some colour-vision deficiencies in the dark theme, so the
  // electrodynamic bar is doubled and the pseudopotential bar dashed: the pattern carries the category too.
  const CAT = {
    model: { name: 'model potentials', bar: ['solid', 3, 'var(--c-4)'] },
    pseudo: { name: 'pseudopotentials', bar: ['dashed', 3, 'var(--muted)'] },
    first: { name: 'first principles', bar: ['solid', 3, 'var(--c-5)'] },
    edyn: { name: 'electrodynamic, Part B', bar: ['double', 5, 'var(--c-photon)'] },
  };

  // ---------- styles: a fragment carries no stylesheet, so one table, applied by class ----------
  // Colours are CSS variables, so they follow the theme without a redraw.
  const UI = 'font-family:var(--font-ui);';
  const STYLE = {
    'a2-timeline-era': 'margin:0 0 12px',
    'a2-timeline-era-h': UI + 'margin:0 0 6px;max-width:none;font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)',
    'a2-timeline-grid': 'list-style:none;margin:0;padding:0;max-width:none;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))',
    'a2-timeline-card': 'position:relative;margin:0;max-width:none;min-width:0;display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:5px;padding:7px 10px 9px;font-size:0.86rem;line-height:1.38',
    'a2-timeline-year': 'font-family:var(--font-mono);font-size:0.74rem;color:var(--muted)',
    'a2-timeline-who': UI + 'font-weight:600;color:var(--fg)',
    'a2-timeline-f': 'margin:1px 0;color:var(--fg)',
    'a2-timeline-eq': UI + 'font-size:0.76rem;white-space:nowrap',
    'a2-timeline-note': UI + 'font-size:0.8rem;color:var(--fg-2)',
    'a2-timeline-chipbox': 'margin-top:auto;padding-top:5px',
    'a2-timeline-chip': UI + 'display:inline-block;white-space:nowrap;font-size:0.74rem;line-height:1.45;color:var(--t-photon);text-decoration:none;border:1px solid var(--c-photon);border-radius:3px;padding:0 5px',
    'a2-timeline-leg': 'gap:6px 8px;margin-top:2px',
    'a2-timeline-leg-k': UI + 'font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-right:2px',
    'a2-timeline-tog': 'display:inline-flex;align-items:center;font-size:0.8rem;line-height:1.3;padding:3px 9px;border-radius:999px;color:var(--fg-2)',
    'a2-timeline-sr': 'position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap',
  };
  const cards = [...fig.querySelectorAll('.a2-timeline-card')];
  cards.forEach(c => {                                       // the category in words, for screen readers
    const sr = document.createElement('span');
    sr.className = 'a2-timeline-sr'; sr.textContent = ` Category: ${CAT[c.dataset.cat].name}.`;
    c.appendChild(sr);
  });
  Object.entries(STYLE).forEach(([k, s]) => fig.querySelectorAll('.' + k).forEach(el => { el.style.cssText += ';' + s; }));
  cards.forEach(c => {
    const [st, w, col] = CAT[c.dataset.cat].bar;
    c.style.borderTop = `${w}px ${st} ${col}`;
    c.style.paddingTop = `${10 - w}px`;                     // the text starts at the same height on every card
  });

  // ---------- columns: 4 on a wide figure, 2 on a phone, 1 on a very narrow screen ----------
  // 8 cards before 1985 and 4 after fill complete rows in every case.
  const grids = [...fig.querySelectorAll('.a2-timeline-grid')];
  let cols = 0;
  const layout = () => {
    const w = grids[0].clientWidth;
    if (!w) return;
    const n = w >= 640 ? 4 : w >= 270 ? 2 : 1;
    if (n === cols) return;
    cols = n;
    grids.forEach(g => { g.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`; });
  };
  layout();
  requestAnimationFrame(layout);
  window.addEventListener('resize', layout);
  window.addEventListener('load', layout);

  // ---------- highlight toggles: pressed categories stay bright, the other cards fade ----------
  const togs = [...fig.querySelectorAll('.a2-timeline-tog')];
  const status = fig.querySelector('.a2-timeline-status');
  const on = new Set();
  const hit = (c, k) => (k === 'pre' ? !!c.querySelector('.a2-timeline-chip') : c.dataset.cat === k);
  if (!EPP.reducedMotion) cards.forEach(c => { c.style.transition = 'opacity 0.2s ease'; });
  const apply = (announce) => {
    let n = 0;
    cards.forEach(c => {
      const lit = !on.size || [...on].some(k => hit(c, k));
      c.style.opacity = lit ? '' : '0.28';
      if (lit) n++;
    });
    togs.forEach(b => {
      const p = on.has(b.dataset.k);
      b.setAttribute('aria-pressed', String(p));
      b.style.background = p ? 'color-mix(in srgb, var(--accent) 15%, var(--surface))' : '';
      b.style.borderColor = p ? 'var(--accent)' : '';
      b.style.color = p ? 'var(--fg)' : 'var(--fg-2)';
    });
    if (announce) status.textContent = on.size ? `${n} of ${cards.length} steps highlighted.` : `All ${cards.length} steps shown.`;
  };
  togs.forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    if (on.has(k)) on.delete(k); else on.add(k);
    apply(true);
  }));
  apply(false);
})();
</script>
