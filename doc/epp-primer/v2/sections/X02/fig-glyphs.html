    <div class="x2-glyphs-ctrls"></div>
    <div class="x2-glyphs-insp" id="viz-x2-glyphs-insp" role="status" aria-live="polite" aria-atomic="true">
      <div data-k="intro" hidden><p><strong>No glyph selected.</strong> Hover over, focus (Tab) or tap a glyph: its counterparts in the other column light up and this panel gives the translation. Click or tap it again, or press Esc, to release it.</p></div>
      <div data-k="gG" hidden><p><strong>Electron propagator $G$</strong>, the interacting one, dressed by its own Dyson equation <a class="eqref" href="#a5-eq-dysonG">(A5.13)</a> ↔ <strong>electron lines</strong> inside the bubbles of the photon self-energy $\Pi^{\mathrm e}$ <a class="eqref" href="#b5-eq-Pie">(B5.19)</a>. In practice both parts build their bubbles from Kohn–Sham states $\psi_{n\bk}$ with energies $E_{n\bk}$. Part B has no Dyson equation for the electrons, so it has no counterpart of the Fan–Migdal self-energy of <a href="#a-electron-se">Section A.7</a>.</p></div>
      <div data-k="gF" hidden><p><strong>Phonon propagator $F$ on adiabatic phonons</strong> <a class="eqref" href="#a5-eq-F">(A5.26)</a> ↔ <strong>$F$ on bare phonons</strong> <a class="eqref" href="#b5-eq-F0">(B5.4)</a>. The definition and the units, 1/energy, are the same, and both parts dress the line with a Dyson equation of the same form, $F=F^0+F^0\Pi^{\mathrm{ph}}F$, <a class="eqref" href="#a6-eq-dysonF">(A6.4)</a> and <a class="eqref" href="#b7-eq-dysonF">(B7.7)</a>. The reference phonons differ: adiabatic phonons contain the dipole–dipole force constants $\Phi^{\mathrm{dd}}$, bare phonons only the short-range $\Phi^{\mathrm{sr}}$.</p></div>
      <div data-k="gv" hidden><p><strong>Coulomb line</strong> $v(\bq)=4\pi e^2/q^2$, instantaneous, between two charge vertices ↔ <strong>longitudinal photon line</strong> $D^{0\mathrm L}$ <a class="eqref" href="#x2-eq-D0L">(X2.2)</a> between two current vertices. By <a class="eqref" href="#x2-eq-coul">(X2.3)</a> it carries exactly the Coulomb energy. Adding the transverse line gives the free propagator $D^0=D^{0\mathrm L}+D^{0\mathrm T}$, whose limit $c\to\infty$ is $D^{0\mathrm L}$ again.</p></div>
      <div data-k="gW" hidden><p><strong>Screened interaction</strong> $W^{\mathrm e}=v+v\chi^{\mathrm{irr}}W^{\mathrm e}$ <a class="eqref" href="#x1-eq-dysonW">(X1.11)</a> and $W=W^{\mathrm e}+W^{\mathrm{ph}}$ <a class="eqref" href="#a5-eq-split">(A5.23)</a> ↔ <strong>dressed photon lines</strong> $D^{\mathrm e}=D^0+D^0\Pi^{\mathrm e}D^{\mathrm e}$ <a class="eqref" href="#b5-eq-dysonDe">(B5.13)</a> and $D=D^0+D^0\Pi D$ <a class="eqref" href="#b6-eq-dysonD">(B6.14)</a>. The charge–charge sector of $D^{\mathrm e}$ is the screened Coulomb interaction, $e^2D^{\mathrm e}_{\rho\rho}=W^{\mathrm e}$ (<a href="#b-propagator">Section B.6</a>); for $c\to\infty$ the whole tensor reduces to <a class="eqref" href="#x2-eq-De">(X2.5)</a>.</p></div>
      <div data-k="gn" hidden><p><strong>Charge vertex</strong>: a Coulomb line ends on an electron that scatters between $n\bk$ and $m\bk+\bq$, with the matrix element $\rho^{\,n\bk,m\bk+\bq}=-e\langle\psi_{n\bk}|\ee^{-\ii\bq\cdot\br}|\psi_{m\bk+\bq}\rangle$ ↔ <strong>the same charge vertex</strong> in Part B. Charge conservation rewrites it as the longitudinal part of the current vertex, $\bq\cdot\bj^{\,n\bk,m\bk+\bq}=[(E_{m\bk+\bq}-E_{n\bk})/\hbar]\,\rho^{\,n\bk,m\bk+\bq}$ <a class="eqref" href="#x2-eq-vertex">(X2.8)</a>, so the current vertex lights up too.</p></div>
      <div data-k="gZ" hidden><p><strong>Ionic charge vertex</strong>: a displaced ion acts on the electrons through the change $\Delta_{\bq\nu}V^{\mathrm{en}}$ of its potential, screened by $(\varepsilon^{\mathrm e})^{-1}$ <a class="eqref" href="#a5-eq-Wph">(A5.28)</a>, with its bare charge $eZ_\kappa$, where $Z_\kappa$ is the charge of the ion in units of $e$ ↔ <strong>ionic current vertex</strong> $J_{\alpha\nu}(\bq,\omega)$ <a class="eqref" href="#b7-eq-J">(B7.3)</a>. Part B changes four things: Born charges $Z^*_{\kappa,\alpha\beta}$ replace $Z_\kappa$; the basis phase $\ee^{-\ii(\bq+\bG)\cdot\btau_\kappa}$ records where the atoms sit; a factor $\omega$ makes the vertex a current, because a vibrating dipole is a current; and only the long-range dipole is kept.</p></div>
      <div data-k="gb"><p><strong>Bare electron–phonon vertex</strong> $\langle\psi_{m\bk+\bq}|\Delta_{\bq\nu}V^{\mathrm{en}}|\psi_{n\bk}\rangle$, unscreened (<a href="#a-coupling">Section A.2</a>) ↔ the <strong>composite</strong> $g^{\mathrm{dyn},0}$ <a class="eqref" href="#b8-eq-vertex">(B8.6)</a>: an electron current vertex, the free line $D^0$ and the ionic current vertex $J_{\alpha\nu}$. Part B has no electron–phonon term of its own; electrons and ions meet only through the field. For $c\to\infty$ the composite becomes, up to a sign that is a convention of <a href="#b-frohlich">Section B.8</a>, $g^{\mathrm{lr}}$ at $\bG=0$ with $\varepsilon_\infty\to1$, taken on the bare phonons <a class="eqref" href="#x2-eq-gB">(X2.11)</a>: the dipolar part of the bare vertex, with Born charges in place of the bare ionic charges. The short-range rest has no Part B counterpart.</p></div>
      <div data-k="gg" hidden><p><strong>Screened electron–phonon vertex</strong> $g$ of density-functional perturbation theory, screened statically, $\Delta V^{\mathrm{KS}}=(\varepsilon^{\mathrm e}_{\mathrm{RPA+xc}})^{-1}\Delta V^{\mathrm{en}}$ <a class="eqref" href="#a3-eq-scf">(A3.13)</a> ↔ the <strong>composite</strong> $g^{\mathrm{dyn}}$ <a class="eqref" href="#b8-eq-vertex">(B8.6)</a>: the ionic current vertex, the dressed line $D^{\mathrm e}$ and an electron current vertex. For $c\to\infty$ it becomes, up to the sign and conjugation conventions of <a href="#b-frohlich">Section B.8</a>, $g^{\mathrm{lr}}$ with $\varepsilon_\infty\to\varepsilon^{\mathrm e}(\bq,\omega)$, taken on the bare phonons <a class="eqref" href="#b8-eq-static">(B8.16)</a>: screened at the phonon frequency, not statically. Both phonon self-energies keep one bare and one screened vertex: <a class="eqref" href="#a6-eq-pina">(A6.17)</a> and <a href="#b-frohlich">Section B.8</a>.</p></div>
      <div data-k="eG" hidden><p><strong>Electron lines</strong>: free Kohn–Sham states $\psi_{n\bk}$ with energies $E_{n\bk}$, joined at two electron current vertices into a bubble of $\Pi^{\mathrm e}$ <a class="eqref" href="#b5-eq-Pie">(B5.19)</a> ↔ <strong>$G$</strong> of <a href="#a-hedin-baym">Section A.5</a>, taken in the same Kohn–Sham approximation. Part B never dresses these lines, so band renormalization and lifetimes are missing from it (<a href="#x2-missing">see below</a>).</p></div>
      <div data-k="eF" hidden><p><strong>$F$ on bare phonons</strong>, whose free form $F^0_\nu(\bq,\omega)=(2\omega_{\bq\nu}/\hbar)/[(\omega+\ii\eta)^2-\omega^2_{\bq\nu}]$ <a class="eqref" href="#b5-eq-F0">(B5.4)</a> uses the frequencies of $\Phi^{\mathrm{sr}}$ alone ↔ <strong>$F$ on adiabatic phonons</strong> <a class="eqref" href="#a5-eq-F">(A5.26)</a>. Photon exchange lifts the longitudinal polar mode from $\omega_{\mathrm{TO}}$ to $\omega_{\mathrm{LO}}$, and the dressed propagator keeps the weight $\omega_{\mathrm{TO}}/\omega_{\mathrm{LO}}$ of <a class="eqref" href="#x2-eq-residue">(X2.12)</a>, which compensates the larger Part B vertex in every physical quantity (<a class="figref" href="#viz-x2-units">Figure X2.2</a>).</p></div>
      <div data-k="e0L" hidden><p><strong>$D^{0\mathrm L}_{\alpha\beta}=-4\pi c\,\hat q_\alpha\hat q_\beta/(\omega+\ii\eta)^2$</strong> <a class="eqref" href="#x2-eq-D0L">(X2.2)</a> ↔ <strong>$v$</strong>: between two currents it carries exactly the Coulomb energy of their charges <a class="eqref" href="#x2-eq-coul">(X2.3)</a>. The quantized longitudinal photon has a vanishing propagator, while $D^{0\mathrm L}$ is the Coulomb energy of the longitudinal field, written as the response of $\bA^{\mathrm L}$ to a current (<a href="#b-fields">Section B.4</a>): both statements hold.</p></div>
      <div data-k="e0T" hidden><p><strong>$D^{0\mathrm T}_{\alpha\beta}=-4\pi c\,(\delta_{\alpha\beta}-\hat q_\alpha\hat q_\beta)/[(\omega+\ii\eta)^2-c^2q^2]$</strong> <a class="eqref" href="#b5-eq-D0T">(B5.6)</a> ↔ <strong>no counterpart</strong>. Part A has light only as a classical external field (<a href="#a-applications">Section A.9</a>). The line vanishes as $1/c$ for $c\to\infty$ and matters only near and inside the light cone, $q\lesssim\omega/c$ (<a href="#x-light-cone">Section X.1</a>). Far outside it, the energy it carries between currents of similar size is smaller than the Coulomb energy by $(\omega/cq)^2$ <a class="eqref" href="#x2-eq-T">(X2.4)</a>: $3\times10^{-8}$ for a 36 meV phonon at $q=0.1$ Å⁻¹.</p></div>
      <div data-k="e0" hidden><p><strong>$D^0=D^{0\mathrm L}+D^{0\mathrm T}$</strong>, the propagator of Maxwell's equations in vacuum, in the temporal gauge (<a href="#x-light-cone">Section X.1</a>) ↔ <strong>$v$</strong>, its limit $c\to\infty$. Inside the bare composite vertex $g^{\mathrm{dyn},0}$ <a class="eqref" href="#b8-eq-vertex">(B8.6)</a> it carries the bare Coulomb potential of the displaced ions, so the bare vertex lights up too.</p></div>
      <div data-k="eDe" hidden><p><strong>$D^{\mathrm e}$</strong>, the photon line dressed by the electrons only <a class="eqref" href="#b5-eq-dysonDe">(B5.13)</a> ↔ <strong>$W^{\mathrm e}$</strong>: its charge–charge sector is $e^2D^{\mathrm e}_{\rho\rho}=W^{\mathrm e}$, and for $c\to\infty$ the whole tensor grows as $c$, with $D^{\mathrm e}/c\to-(q_\alpha q_\beta/\omega^2)\,W^{\mathrm e}/e^2$ <a class="eqref" href="#x2-eq-De">(X2.5)</a>. At finite $c$ its transverse part describes light in the electronic medium, which $W^{\mathrm e}$ cannot. Inside the screened vertex $g^{\mathrm{dyn}}$ it does the screening that density-functional perturbation theory puts into $g$, so $g$ lights up too.</p></div>
      <div data-k="erho" hidden><p><strong>Charge vertex</strong> $\rho^{\,n\bk,m\bk+\bq}=-e\langle\psi_{n\bk}|\ee^{-\ii\bq\cdot\br}|\psi_{m\bk+\bq}\rangle$ ↔ Part A's <strong>charge vertex</strong>, the same object. Part B meets it in the charge sectors of the total propagator (<a href="#b-propagator">Section B.6</a>), where charge conservation, <a class="eqref" href="#x2-eq-vertex">(X2.8)</a>, turns it into the longitudinal part of a current vertex.</p></div>
      <div data-k="ej" hidden><p><strong>Electron current vertex</strong> $j_\alpha^{\,n\bk,m\bk+\bq}$, the matrix element of the current density between $n\bk$ and $m\bk+\bq$ <a class="eqref" href="#b5-eq-jel">(B5.17)</a> ↔ Part A's <strong>charge vertex</strong>, for its longitudinal part only: $\bq\cdot\bj^{\,n\bk,m\bk+\bq}$ is fixed by $\rho^{\,n\bk,m\bk+\bq}$ <a class="eqref" href="#x2-eq-vertex">(X2.8)</a>. The transverse part couples to $D^{0\mathrm T}$ and has no Part A counterpart. Diamagnetic $A^2$ terms accompany the current vertices and keep the theory gauge invariant <a class="eqref" href="#b5-eq-dia">(B5.15)</a>. <a href="#b-frohlich">Section B.8</a> uses the vertex in a dynamic form, scaled by $\omega$ over the transition frequency, in both composite vertices, so the bare vertex and $g$ light up too.</p></div>
      <div data-k="eJ" hidden><p><strong>Ionic current vertex</strong> $J_{\alpha\nu}(\bq,\omega)=(\hbar/2c\OV\omega_{\bq\nu})^{1/2}\,\omega\,j_{\alpha\nu}(\bq)$ <a class="eqref" href="#b7-eq-J">(B7.3)</a>, with $j_{\alpha\nu}$ built from the Born charges, the eigenvectors and the basis phase <a class="eqref" href="#b5-eq-jion">(B5.22)</a> ↔ Part A's <strong>ionic charge vertex</strong> <a class="eqref" href="#a5-eq-Wph">(A5.28)</a>. The factor $\omega$ is the current $\dot{\mathbf p}=-\ii\omega\mathbf p$ of a vibrating dipole $\mathbf p$. For $c\to\infty$ only $\bq\cdot\bj_\nu$ couples, the numerator of $g^{\mathrm{lr}}$ <a class="eqref" href="#a4-eq-glr">(A4.14)</a>, basis phase included. It enters both composite vertices, so the bare vertex and $g$ light up too.</p></div>
    </div>
    <figcaption><p class="cap-key"><strong>What to notice.</strong> A Part A vertex is not one Part B glyph but a composite of three: the bare vertex becomes an electron current vertex, the free line $D^0$ and the ionic current vertex $J_{\alpha\nu}$, while the transverse line $D^{0\mathrm T}$ has no Part A counterpart. With $c\to\infty$ the Part B column collapses onto Part A, with Born charges where Part A has the bare charges of the ions.</p><div class="cap-more">
      <p><strong>Marks.</strong> Blue arrowed lines: electrons, doubled for the interacting propagator $G$. Amber zigzag: phonons. Rose: the electromagnetic field, dashed when longitudinal (Coulomb), wavy when transverse, wavy over dashed for both polarizations, doubled or heavy when dressed. Dots: charge vertices; squares: current vertices, blue for an electron, teal for an ion and black where either can sit; small dot and grey disk: the bare and the screened electron–phonon vertex. Accent border: the selected glyph; rose border and tint: its counterparts.</p>
      <p><strong>Try.</strong> (1) Select the bare vertex, then $g$: $D^{\mathrm e}$ lights up in place of $D^0$. (2) Select $D^{0\mathrm T}$: nothing lights up in Part A. (3) Switch on the electrostatic limit: $D^{0\mathrm T}$ fades, and each other Part B line and current vertex shows what it reduces to.</p>
      <p><strong>Model.</strong> The translations <a class="eqref" href="#x2-eq-D0L">(X2.2)</a>, <a class="eqref" href="#x2-eq-De">(X2.5)</a> and <a class="eqref" href="#x2-eq-vertex">(X2.8)</a> and their summary <a class="eqref" href="#x2-eq-subst">(X2.9)</a>, with the definitions <a class="eqref" href="#b5-eq-dysonDe">(B5.13)</a>, <a class="eqref" href="#b8-eq-vertex">(B8.6)</a>, <a class="eqref" href="#b7-eq-J">(B7.3)</a>, <a class="eqref" href="#a5-eq-split">(A5.23)</a> and <a class="eqref" href="#a5-eq-Wph">(A5.28)</a>. The glyphs follow the review (small dot, grey disk) and the EPP manuscript (squares for current vertices), in this primer's colours. No material enters: the figure maps objects, not numbers.</p>
    </div></figcaption>
  </figure>
<script>
(() => {
  const fig = document.getElementById('viz-x2-glyphs');
  if (!fig || !window.EPP) return;
  // outside Section X.2 (the isolated figure test) the links to this section and to other sections have no target: show them as text
  if (!fig.closest('#x-dictionary')) fig.querySelectorAll('a[href^="#"]').forEach(a => {
    if (document.getElementById(a.getAttribute('href').slice(1))) return;
    const s = document.createElement('span'); s.append(...a.childNodes); a.replaceWith(s);
  });
  const NS = 'http://www.w3.org/2000/svg';
  const q = (s) => fig.querySelector(s);
  const narrow = (() => { try { return matchMedia('(max-width: 719px)'); } catch (e) { return { matches: false }; } })();   // the two columns stack below 720 px

  // ---------- glyphs: EPP.fd items in a 104 × 40 box; squares (current vertices) are added after each paint ----------
  const F = (a, b, o = {}) => Object.assign({ t: 'fermion', a, b }, o);
  const L = (t, a, b, o = {}) => Object.assign({ t, a, b }, o);
  const V = (at, r = 3.2) => ({ t: 'vertex', at, r });
  const YE = 33;                                                          // electron line of the vertex glyphs
  const elec = [F([6, YE], [52, YE]), F([52, YE], [98, YE])];             // an electron scatters at x = 52
  const both = (a, b, o = {}) => [L('coulomb', a, b, o), L('photon', a, b, o)];   // a field line with both polarizations
  const E1 = [14, 20], E2 = [90, 20];                                     // end points of a free line
  const ends = [[14, 20, 'ink'], [90, 20, 'ink']];                        // current vertices of either kind
  const GLYPH = {
    // Part A: charges in the Coulomb field
    gG: { items: [F([8, 20], [96, 20], { t: 'fermion2' })] },
    gF: { items: [L('phonon', [8, 20], [96, 20])] },
    gv: { items: [L('coulomb', E1, E2), V(E1), V(E2)] },
    gW: { items: [L('screened', E1, E2), V(E1), V(E2)] },
    gn: { items: [...elec, L('coulomb', [52, YE], [52, 4]), V([52, YE], 3.4)] },
    gZ: { items: [L('phonon', [6, 20], [50, 20]), L('screened', [50, 20], [98, 20]), V([50, 20], 3.6)] },
    gb: { items: [...elec, L('phonon', [52, YE], [52, 3]), V([52, YE], 2.6)] },
    gg: { items: [...elec, L('phonon', [52, YE - 7], [52, 3]), { t: 'blob', at: [52, YE], r: 7, color: 'muted' }] },
    // Part B: currents in the full field
    eG: { items: [F([24, 20], [80, 20], { bend: 0.27 }), F([80, 20], [24, 20], { bend: 0.27 })], sq: [[24, 20, 'electron', 6.4], [80, 20, 'electron', 6.4]] },
    eF: { items: [L('phonon', [8, 20], [96, 20])] },
    e0L: { items: [L('coulomb', E1, E2)], sq: ends },
    e0T: { items: [L('photon', E1, E2)], sq: ends },
    e0: { items: both(E1, E2), sq: ends },
    eDe: { items: [L('screened', E1, E2), L('photon2', E1, E2, { amp: 4.6, width: 2.4 })], sq: ends },
    erho: { items: [...elec, L('coulomb', [52, YE], [52, 4]), V([52, YE], 3.4)] },
    ej: { items: [...elec, ...both([52, YE], [52, 3])], sq: [[52, YE, 'electron']] },
    eJ: { items: [L('phonon', [6, 20], [50, 20]), ...both([50, 20], [98, 20])], sq: [[50, 20, 'c4']] }
  };
  // counterparts: a Part A vertex maps onto three Part B glyphs (the composite vertex); D^{0T} maps onto nothing
  const PART = {
    gG: ['eG'], gF: ['eF'], gv: ['e0L', 'e0'], gW: ['eDe'], gn: ['erho', 'ej'], gZ: ['eJ'],
    gb: ['ej', 'e0', 'eJ'], gg: ['ej', 'eDe', 'eJ'],
    eG: ['gG'], eF: ['gF'], e0L: ['gv'], e0T: [], e0: ['gv', 'gb'], eDe: ['gW', 'gg'],
    erho: ['gn'], ej: ['gn', 'gb', 'gg'], eJ: ['gZ', 'gb', 'gg']
  };

  // ---------- layout: inline styles (fragments carry no style sheet) ----------
  const ST = {
    cols: 'gap:12px 18px',
    col: 'display:grid;gap:6px;align-content:start;min-width:0',
    head: 'margin:0 0 2px;max-width:none;font-family:var(--font-ui);font-size:0.8rem;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted)',
    card: 'min-width:0;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)' + (EPP.reducedMotion ? '' : ';transition:opacity .15s,background-color .15s,border-color .15s,box-shadow .15s'),
    gl: 'display:block;width:104px;height:40px',
    tx: 'display:grid;gap:1px;min-width:0',
    sy: 'font-family:var(--font-text);font-size:1.02rem;line-height:1.35;color:var(--fg);overflow-wrap:anywhere',
    nm: 'font-family:var(--font-ui);font-size:0.8rem;line-height:1.3;color:var(--fg-2)',
    lim: 'margin:0 10px 7px 124px;max-width:none;padding-left:7px;border-left:2px solid var(--c-photon);font-family:var(--font-ui);font-size:0.78rem;line-height:1.35;color:var(--fg-2)',
    insp: 'margin-top:12px;padding:10px 14px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface-2);min-height:6.4em;font-size:0.95rem;line-height:1.5;overflow-x:auto'
  };
  for (const k in ST) fig.querySelectorAll('.x2-glyphs-' + k).forEach(el => { el.style.cssText += ';' + ST[k]; });
  const insp = q('.x2-glyphs-insp');
  insp.querySelectorAll('p').forEach(p => { p.style.cssText = 'margin:0;max-width:none'; });
  const BTN = 'display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:center;width:100%;margin:0;padding:5px 10px;border:0;border-radius:var(--radius);background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer;outline-offset:-3px';

  const addSquares = (svg, sq) => sq.forEach(([x, y, c, s = 8.4]) => {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', (x - s / 2).toFixed(2)); r.setAttribute('y', (y - s / 2).toFixed(2));
    r.setAttribute('width', s); r.setAttribute('height', s); r.setAttribute('fill', EPP.color(c));
    svg.appendChild(r);
  });
  const cards = [...fig.querySelectorAll('.x2-glyphs-card')].map(card => {
    const g = card.dataset.g, btn = card.querySelector('button'), spec = GLYPH[g];
    btn.style.cssText = BTN;
    btn.setAttribute('aria-pressed', 'false');
    const svg = EPP.fd.draw(card.querySelector('.x2-glyphs-gl'), { w: 104, h: 40, items: spec.items });
    svg.removeAttribute('role'); svg.removeAttribute('aria-label');
    svg.setAttribute('aria-hidden', 'true'); svg.setAttribute('focusable', 'false');
    svg.style.cssText = 'display:block;overflow:visible';
    if (spec.sq) { const add = () => addSquares(svg, spec.sq); add(); EPP.onTheme(add); }   // registered after the glyph's own repaint
    return { g, card, btn };
  });
  const entries = [...insp.querySelectorAll('[data-k]')];
  const lims = [...fig.querySelectorAll('.x2-glyphs-lim')];

  // ---------- state: pinned glyph (click, tap, Enter), transient glyph (hover, focus), electrostatic limit ----------
  let pinned = 'gb', hover = null, limOn = false;
  function render() {
    const id = hover || pinned, part = id ? (PART[id] || []) : [];
    for (const { g, card, btn } of cards) {
      const faded = limOn && g === 'e0T';
      let bc = 'var(--rule)', bg = 'var(--surface)', sh = 'none', op = faded ? 0.38 : 1;
      if (id) {
        if (g === id) { bc = 'var(--accent)'; bg = 'var(--hl)'; sh = 'inset 0 0 0 1px var(--accent)'; op = 1; }
        else if (part.includes(g)) { bc = 'var(--c-photon)'; bg = 'color-mix(in srgb, var(--c-photon) 10%, var(--surface))'; sh = 'inset 0 0 0 1px var(--c-photon)'; op = 1; }
        else op = faded ? 0.3 : 0.55;   // dimmed but still readable, also in the dark theme
      }
      card.style.borderColor = bc; card.style.background = bg; card.style.boxShadow = sh; card.style.opacity = String(op);
      btn.setAttribute('aria-pressed', String(pinned === g));
    }
    const k = id || 'intro';
    entries.forEach(e => { e.hidden = e.dataset.k !== k; });
  }
  // on a phone the inspector sits below both columns: bring it into view after a tap
  function reveal() {
    if (!narrow.matches) return;
    const r = insp.getBoundingClientRect();
    if (r.top >= 0 && r.bottom <= window.innerHeight - 60) return;
    insp.scrollIntoView({ block: 'nearest', behavior: EPP.reducedMotion ? 'auto' : 'smooth' });
  }
  for (const { g, card, btn } of cards) {
    card.addEventListener('pointerenter', (e) => { if (e.pointerType !== 'touch') { hover = g; render(); } });
    card.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch' && hover === g) { hover = null; render(); } });
    btn.addEventListener('focus', () => { hover = g; render(); });
    btn.addEventListener('blur', () => { if (hover === g) { hover = null; render(); } });
    card.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;                 // a link in the limit note
      if (pinned === g) { pinned = null; hover = null; } // release: the panel returns to its hint
      else { pinned = g; hover = null; }
      render();
      // a tap or click (not a key press) on a narrow screen: show the panel. The page keeps a focused element in view,
      // so the tapped button gives up its focus first, or the page would scroll straight back to it.
      if (pinned && e.detail > 0 && narrow.matches) {
        if (document.activeElement === btn) btn.blur();
        reveal();
      }
    });
  }
  fig.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || (!pinned && !hover)) return;
    pinned = null; hover = null; render();
  });

  const ctl = EPP.controls(q('.x2-glyphs-ctrls'), [
    { key: 'lim', type: 'toggle', label: 'electrostatic limit, c → ∞', value: false }
  ], (s) => {
    limOn = !!s.lim;
    lims.forEach(n => { n.hidden = !limOn; });
    render();
  });
  {
    const sp = ctl.el.querySelector('.ctrl label span');
    if (sp) sp.innerHTML = 'electrostatic limit, <i style="font-family:var(--font-text)">c</i> → ∞';
    const hint = document.createElement('p');
    hint.className = 'kbd-hint';
    hint.style.cssText = 'margin:0;max-width:none;align-self:center';
    hint.textContent = 'Hover over, focus or tap a glyph; tap it again or press Esc to release it.';
    ctl.el.appendChild(hint);
  }
  render();
})();
</script>
