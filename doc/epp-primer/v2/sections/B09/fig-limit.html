  <figure class="viz" id="viz-b9-limit">
    <p class="viz-title">From the dressed photon line to the Gonze–&#8288;Lee term <span class="tag">interactive</span></p>
    <div class="b9-limit-rowa" role="group" aria-labelledby="viz-b9-limit-la">
      <p class="b9-limit-rowlab" id="viz-b9-limit-la"><span>(a) four sectors, first order in $\Pi^{\mathrm e}$</span></p>
      <div class="b9-limit-grid">
        <div class="b9-limit-pair">
          <div class="b9-limit-sec" data-s="L">
            <div class="b9-limit-head"><span class="b9-limit-tag">L</span><span class="b9-limit-badge" aria-hidden="true" style="visibility:hidden">survives</span></div>
            <div class="b9-limit-stack"><div class="b9-limit-full"></div></div>
            <div class="b9-limit-scale">$D^{\mathrm{e,L}}\propto c$</div>
            <div class="b9-limit-name">Coulomb–Coulomb, $D_{\rho\rho}$</div>
          </div>
          <div class="b9-limit-sec" data-s="LT">
            <div class="b9-limit-head"><span class="b9-limit-tag">LT</span><span class="b9-limit-badge" aria-hidden="true" style="visibility:hidden">→ 0</span></div>
            <div class="b9-limit-stack"><div class="b9-limit-full"></div><div class="b9-limit-mute" style="visibility:hidden"></div></div>
            <div class="b9-limit-scale">$D^{\mathrm{e,LT}}\propto 1/c$</div>
            <div class="b9-limit-name">Coulomb–photon, $D_{\rho\beta}$</div>
          </div>
        </div>
        <div class="b9-limit-pair">
          <div class="b9-limit-sec" data-s="TL">
            <div class="b9-limit-head"><span class="b9-limit-tag">TL</span><span class="b9-limit-badge" aria-hidden="true" style="visibility:hidden">→ 0</span></div>
            <div class="b9-limit-stack"><div class="b9-limit-full"></div><div class="b9-limit-mute" style="visibility:hidden"></div></div>
            <div class="b9-limit-scale">$D^{\mathrm{e,TL}}\propto 1/c$</div>
            <div class="b9-limit-name">photon–Coulomb, $D_{\alpha\rho}$</div>
          </div>
          <div class="b9-limit-sec" data-s="T">
            <div class="b9-limit-head"><span class="b9-limit-tag">T</span><span class="b9-limit-badge" aria-hidden="true" style="visibility:hidden">→ 0</span></div>
            <div class="b9-limit-stack"><div class="b9-limit-full"></div><div class="b9-limit-mute" style="visibility:hidden"></div></div>
            <div class="b9-limit-scale">$D^{\mathrm{e,T}}\propto 1/c$</div>
            <div class="b9-limit-name">photon–photon, $D^{\mathrm T}_{\alpha\beta}$</div>
            <div class="b9-limit-note">term drawn: $\propto c^{-3}$</div>
          </div>
        </div>
      </div>
    </div>
    <div class="b9-limit-rowb" role="group" aria-labelledby="viz-b9-limit-lb">
      <p class="b9-limit-rowlab" id="viz-b9-limit-lb"><span>(b) the survivor and what it does</span><span class="b9-limit-hint"><span class="b9-limit-h0">dimmed: these steps hold only for $c\to\infty$</span><span class="b9-limit-h1" style="visibility:hidden">these steps hold for $c\to\infty$</span></span></p>
      <div class="b9-limit-chain">
        <div class="b9-limit-panel b9-limit-p1"><div class="b9-limit-d"></div><div class="b9-limit-cap">sum of the four sectors in (a)</div></div>
        <div class="b9-limit-grp b9-limit-dim">
          <svg class="b9-limit-op" width="62" height="50" viewBox="0 0 62 50" role="img" aria-label="take c to infinity"><text x="31" y="21" text-anchor="middle" fill="currentColor" style="font-family:var(--font-ui);font-size:13px"><tspan style="font-family:var(--font-text);font-style:italic;font-size:15px">c</tspan> → ∞</text><path d="M4 34 H52" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M59 34 L50 29.5 L52 34 L50 38.5 Z" fill="currentColor"/></svg>
          <div class="b9-limit-panel b9-limit-p3"><div class="b9-limit-d"></div><div class="b9-limit-cap">L lines only, any number of bubbles <a class="eqref" href="#b9-eq-limit"></a></div></div>
        </div>
        <div class="b9-limit-grp b9-limit-dim">
          <svg class="b9-limit-op" width="22" height="50" viewBox="0 0 22 50" role="img" aria-label="equals"><path d="M4 30.5 H18 M4 37.5 H18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <div class="b9-limit-panel b9-limit-p5"><div class="b9-limit-d"></div><div class="b9-limit-cap">screened Coulomb, $W^{\mathrm e}=v+v\chi^0W^{\mathrm e}$ <a class="eqref" href="#b9-eq-We"></a></div></div>
        </div>
        <div class="b9-limit-grp b9-limit-dim">
          <svg class="b9-limit-op" width="80" height="50" viewBox="0 0 80 50" role="img" aria-label="placed between two ionic vertices"><text x="40" y="12" text-anchor="middle" fill="currentColor" style="font-family:var(--font-ui);font-size:12px">between two</text><text x="40" y="25.5" text-anchor="middle" fill="currentColor" style="font-family:var(--font-ui);font-size:12px">ionic vertices</text><path d="M4 34 H69" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M76 34 L67 29.5 L69 34 L67 38.5 Z" fill="currentColor"/></svg>
          <div class="b9-limit-panel b9-limit-p7"><div class="b9-limit-stack"><div class="b9-limit-v0"></div><div class="b9-limit-vw" style="visibility:hidden"></div></div><div class="b9-limit-cap">phonon self-energy $\Pi^{\mathrm{ph}}_{\nu\nu'}$ <a class="eqref" href="#b9-eq-piph"></a></div></div>
        </div>
        <div class="b9-limit-grp b9-limit-dim">
          <svg class="b9-limit-op" width="38" height="50" viewBox="0 0 38 50" role="img" aria-label="gives"><path d="M4 34 H27" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M34 34 L25 29.5 L27 34 L25 38.5 Z" fill="currentColor"/></svg>
          <div class="b9-limit-stack b9-limit-res">
            <p class="b9-limit-v0"><strong>$\omega=0$</strong>: dipole–dipole force constants $\Phi^{\mathrm{dd}}$, the <span class="nw">Gonze–Lee</span> term <a class="eqref" href="#b9-eq-gl"></a></p>
            <p class="b9-limit-vw" style="visibility:hidden"><strong>$\omega$ kept</strong>: dynamic screening; with free carriers, the coupled <span class="nw">LO-phonon–plasmon</span> modes $\mathrm L_\pm$ <a class="eqref" href="#b9-eq-Lpm"></a></p>
          </div>
        </div>
      </div>
    </div>
    <div class="b9-limit-ctrls"></div>
    <div class="readout b9-limit-ro" aria-live="polite"><span>on the physical scale $D/c$:<b>$\mathrm L\sim c^0$; $\mathrm{LT},\ \mathrm{TL},\ \mathrm T\sim c^{-2}$</b></span><span>surviving sectors:<b class="b9-limit-rv"><span class="b9-limit-r4">4</span><span class="b9-limit-r1" style="visibility:hidden">1 ($D_{\rho\rho}$)</span></b></span></div>
    <figcaption><p class="cap-key"><strong>What to notice.</strong> At finite $c$ all four sectors of the dressed propagator are there. For $c\to\infty$ only the one with Coulomb lines at both ends survives; it sums to <span class="nw">$W^{\mathrm e}$,</span> and placed between two ionic vertices it becomes the phonon self-energy and, at <span class="nw">$\omega=0$,</span> the <span class="nw">Gonze–Lee</span> term.</p><div class="cap-more">
      <p><strong>Marks.</strong> Heavy wavy: <span class="nw">$D^{\mathrm e}$,</span> the photon propagator dressed by electrons; its sectors are named by their end lines, L (Coulomb) or T (photon). Dashed rose: free longitudinal (Coulomb) line <span class="nw">$D^{0\mathrm L}$.</span> Wavy rose: free transverse photon <span class="nw">$D^{0\mathrm T}$.</span> Blue blob: electronic bubble <span class="nw">$\Pi^{\mathrm e}$.</span> Double dashed: screened Coulomb interaction <span class="nw">$W^{\mathrm e}$,</span> as a line of the vector potential <span class="nw">$-\frac{c}{e^2\omega^2}q_\alpha q_\beta W^{\mathrm e}$.</span> Amber zigzag: phonon. Teal dots: ionic vertices, which in this limit see only <span class="nw">$\bq\cdot\bj_\nu$.</span> Grey, marked “→ 0”: sectors that vanish. Each scaling is that of the whole sector at fixed $\bq$ and <span class="nw">$\omega$;</span> for T it comes from the free transverse line.</p>
      <p><strong>Try.</strong> Set the speed of light to <span class="nw">$c\to\infty$:</span> three sectors turn grey and row (b) lights up. Then switch the screening between $\omega=0$ and $\omega$ kept: the last panel changes from the <span class="nw">Gonze–Lee</span> term to the coupled <span class="nw">LO-phonon–plasmon</span> modes.</p>
      <p><strong>Model.</strong> Scalings from <a class="eqref" href="#b9-eq-free"></a> and the counting behind <a class="eqref" href="#b9-eq-limit"></a>; the survivor <a class="eqref" href="#b9-eq-We"></a>; the self-energy <a class="eqref" href="#b9-eq-piph"></a>; the dipole–dipole term <a class="eqref" href="#b9-eq-gl"></a>; the coupled modes <a class="eqref" href="#b9-eq-Lpm"></a>. The sector names <span class="nw">$D_{\rho\rho}$,</span> <span class="nw">$D_{\rho\beta}$,</span> <span class="nw">$D_{\alpha\rho}$,</span> $D^{\mathrm T}_{\alpha\beta}$ are those of <a href="#b-propagator">Section B.6</a>. No material enters: the diagrams show which terms survive, not their size.</p>
    </div></figcaption>
  </figure>
<script>
(() => {
  const fig = document.getElementById('viz-b9-limit');
  if (!fig || !window.EPP) return;
  const NS = 'http://www.w3.org/2000/svg';
  const q = (s) => fig.querySelector(s);

  // ---------- layout: inline styles (fragments carry no style sheet) ----------
  // Row (a) is two pairs of cards: the pairs sit side by side when both fit (1 × 4) and stack otherwise (2 × 2),
  // so the cards never break 3 + 1. Row (b) wraps its panels; each operator travels with the panel after it.
  const ST = {
    rowlab: 'display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 14px;margin:0 0 8px;max-width:none;font-family:var(--font-ui);font-size:0.85rem;color:var(--fg-2)',
    hint: 'display:inline-grid;justify-items:start;font-size:0.8rem;color:var(--muted)',
    rowb: 'margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)',
    grid: 'display:flex;flex-wrap:wrap;justify-content:center;gap:12px',
    pair: 'display:flex;justify-content:center;gap:12px;flex:1 1 300px;max-width:400px;min-width:0',
    sec: 'flex:1 1 0;min-width:0;max-width:190px;box-sizing:border-box;display:grid;justify-items:center;align-content:start;gap:3px;padding:6px 6px 9px;border:1px solid var(--rule);border-radius:var(--radius);text-align:center',
    head: 'justify-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:19px;font-family:var(--font-ui);font-size:0.78rem;color:var(--muted)',
    tag: 'font-weight:600;letter-spacing:0.04em;color:var(--fg-2);padding-left:2px',
    badge: 'line-height:1;padding:2px 7px 3px;border:1px solid currentColor;border-radius:999px;white-space:nowrap;color:var(--muted)',
    stack: 'display:grid;justify-items:center;max-width:100%',
    scale: 'font-size:0.95rem;color:var(--fg)',
    name: 'font-family:var(--font-ui);font-size:0.76rem;line-height:1.3;color:var(--muted)',
    note: 'font-family:var(--font-ui);font-size:0.72rem;line-height:1.3;color:var(--muted)',
    chain: 'display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:12px 14px',
    grp: 'display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:6px 8px;min-width:0;max-width:100%',
    panel: 'display:grid;justify-items:center;gap:2px;min-width:0;max-width:100%',
    cap: 'font-family:var(--font-ui);font-size:0.78rem;line-height:1.3;color:var(--muted);text-align:center;max-width:25ch',
    op: 'flex:0 0 auto;display:block;color:var(--muted);overflow:visible',
    res: 'margin-top:6px;max-width:27ch;justify-items:start',
    rv: 'display:inline-grid;justify-items:start'
  };
  for (const k in ST) fig.querySelectorAll('.b9-limit-' + k).forEach(el => { el.style.cssText += ';' + ST[k]; });
  fig.querySelectorAll('.b9-limit-stack > *, .b9-limit-rv > *, .b9-limit-hint > *').forEach(el => { el.style.gridArea = '1 / 1'; });
  fig.querySelectorAll('.b9-limit-res > p').forEach(el => {
    el.style.cssText += ';margin:0;padding:3px 0 3px 10px;border-left:3px solid var(--c-phonon);font-family:var(--font-ui);font-size:0.86rem;line-height:1.38;color:var(--fg-2)';
  });
  q('.b9-limit-badge').style.color = 'var(--t-photon)';   // "survives" on the L card

  // ---------- diagram labels: bold upright vectors, italic variables and indices, upright digits ----------
  // EPP.fd sets every label in italic and every sub- or superscript upright; this pass fixes the exceptions
  // (q and j are vectors, ν is an index) and runs again after each repaint of the diagrams (theme changes).
  const VEC = /[qj]/, ITAL = /[A-Za-zα-ω]/;
  function styleLabels(svg) {
    svg.querySelectorAll('text.fd-lab').forEach(te => {
      // blob labels and upright text: the style sheet sets every label in italic, over the attribute
      if (te.getAttribute('font-style') === 'normal') { te.style.fontStyle = 'normal'; return; }
      [...te.childNodes].forEach(ts => {
        if (ts.nodeName !== 'tspan') return;
        const s = ts.textContent;
        if (ts.hasAttribute('baseline-shift')) { if (/^[α-ω′]+$/.test(s)) ts.setAttribute('font-style', 'italic'); return; }
        const runs = []; let buf = '', kind = null;
        for (const ch of s) {
          const k = VEC.test(ch) ? 'v' : (ITAL.test(ch) ? 'i' : 'u');
          if (kind !== null && k !== kind) { runs.push([kind, buf]); buf = ''; }
          buf += ch; kind = k;
        }
        if (buf) runs.push([kind, buf]);
        if (runs.length === 1 && runs[0][0] === 'i') return;
        const frag = document.createDocumentFragment();
        runs.forEach(([k, t]) => {
          const n = document.createElementNS(NS, 'tspan'); n.textContent = t;
          if (k === 'v') { n.setAttribute('font-weight', '700'); n.setAttribute('font-style', 'normal'); }
          else if (k === 'u') n.setAttribute('font-style', 'normal');
          frag.appendChild(n);
        });
        ts.replaceWith(frag);
      });
      // a superscript right after a subscript stacks over it, as in j^*_ν
      const kids = [...te.children];
      kids.forEach((ts, i) => {
        const nx = kids[i + 1];
        if (nx && ts.getAttribute('baseline-shift') === 'sub' && nx.getAttribute('baseline-shift') === 'super') {
          const w = ts.getComputedTextLength();
          if (w > 0) nx.setAttribute('dx', (-w).toFixed(2));
        }
      });
    });
  }
  const svgs = [];
  const draw = (el, spec) => {
    const s = EPP.fd.draw(el, spec);
    s.style.cssText = 'display:block;max-width:100%;height:auto;overflow:visible';
    svgs.push(s);
    return s;
  };

  // ---------- (a) the four sectors at first order: end line, bubble, end line ----------
  const LINE = { L: 'coulomb', T: 'photon' };
  const SEC = {
    L: { l: 'L', r: 'L', labs: ['D^{0L}', 'D^{0L}'], aria: 'Longitudinal line, electronic bubble, longitudinal line: the longitudinal sector L, Coulomb at both ends, scales as c.' },
    LT: { l: 'L', r: 'T', labs: [null, 'D^{0T}'], aria: 'Longitudinal line, electronic bubble, transverse line: mixed sector LT, scales as 1 over c.' },
    TL: { l: 'T', r: 'L', labs: [null, null], aria: 'Transverse line, electronic bubble, longitudinal line: mixed sector TL, scales as 1 over c.' },
    T: { l: 'T', r: 'T', labs: [null, null], aria: 'Transverse line, electronic bubble, transverse line: transverse sector T, which scales as 1 over c through its free transverse line; this first-order term scales as 1 over c cubed.' }
  };
  const GONE = ' Grey: it vanishes for c to infinity.', KEPT = ' It survives c to infinity.';
  function sectorItems(S, muted) {
    const col = muted ? { color: 'muted' } : {};
    const line = (side, a, b, lab) => Object.assign({ t: LINE[side], a, b }, lab ? { label: lab } : {}, col);
    return [
      line(S.l, [5, 36], [59, 36], S.labs[0]),
      line(S.r, [97, 36], [151, 36], S.labs[1]),
      { t: 'blob', at: [78, 36], r: 19, label: 'Π^e', color: muted ? 'muted' : 'electron' }
    ];
  }
  const cards = [...fig.querySelectorAll('.b9-limit-sec')].map(el => {
    const k = el.dataset.s, S = SEC[k];
    const full = el.querySelector('.b9-limit-full'), mute = el.querySelector('.b9-limit-mute');
    const svg = draw(full, { w: 156, h: 58, label: S.aria, items: sectorItems(S, false) });
    if (mute) draw(mute, { w: 156, h: 58, label: S.aria + GONE, items: sectorItems(S, true) });
    return { k, el, full, mute, svg, S, badge: el.querySelector('.b9-limit-badge'), scale: el.querySelector('.b9-limit-scale') };
  });

  // ---------- (b) the chain: D^e, then the longitudinal chain, W^e and the phonon self-energy ----------
  draw(q('.b9-limit-p1 .b9-limit-d'), { w: 104, h: 50, label: 'Heavy wavy line: the photon propagator dressed by electrons, D e, the sum of the four sectors.',
    items: [{ t: 'photon2', a: [6, 34], b: [98, 34], label: 'D^e' }] });
  draw(q('.b9-limit-p3 .b9-limit-d'), { w: 226, h: 58, label: 'Chain of longitudinal lines joined by electronic bubbles, with any number of bubbles.', items: [
    { t: 'coulomb', a: [4, 34], b: [43, 34], label: 'D^{0L}' },
    { t: 'coulomb', a: [77, 34], b: [113, 34] },
    { t: 'coulomb', a: [147, 34], b: [183, 34] },
    { t: 'blob', at: [60, 34], r: 17, label: 'Π^e', color: 'electron' },
    { t: 'blob', at: [130, 34], r: 17, label: 'Π^e', color: 'electron' },
    { t: 'text', at: [203, 39], text: '…', color: 'muted', upright: true }] });
  draw(q('.b9-limit-p5 .b9-limit-d'), { w: 104, h: 50, label: 'Double dashed line: the screened Coulomb interaction W e.',
    items: [{ t: 'screened', a: [6, 34], b: [98, 34], label: 'W^e' }] });
  const selfEnergy = (arg, words) => ({ w: 220, h: 80,
    label: `Phonon line, ionic vertex q dot j nu (complex conjugate), screened Coulomb line W e ${words}, ionic vertex q dot j nu prime, phonon line: the phonon self-energy.`, items: [
      { t: 'phonon', a: [5, 34], b: [48, 34] },
      { t: 'screened', a: [48, 34], b: [172, 34], label: `W^e(q,${arg})` },
      { t: 'phonon', a: [172, 34], b: [215, 34] },
      { t: 'vertex', at: [48, 34], r: 4.2, color: 'c4' },
      { t: 'vertex', at: [172, 34], r: 4.2, color: 'c4' },
      { t: 'text', at: [48, 63], text: 'q·j_ν^*', color: 'c4-t' },
      { t: 'text', at: [172, 63], text: 'q·j_{ν′}', color: 'c4-t' }] });
  draw(q('.b9-limit-p7 .b9-limit-v0'), selfEnergy('0', 'at zero frequency'));
  draw(q('.b9-limit-p7 .b9-limit-vw'), selfEnergy('ω', 'at the frequency omega'));
  const restyle = () => svgs.forEach(styleLabels);
  restyle();
  EPP.onTheme(restyle);   // registered after the diagrams, so it runs after each of their repaints

  // ---------- state: speed of light (row a greys out, row b lights up) and screening (last panel) ----------
  const show = (el, on) => { if (el) el.style.visibility = on ? 'visible' : 'hidden'; };
  const dims = [...fig.querySelectorAll('.b9-limit-dim')];
  const els = {
    h0: q('.b9-limit-h0'), h1: q('.b9-limit-h1'), r4: q('.b9-limit-r4'), r1: q('.b9-limit-r1'),
    w0: [...fig.querySelectorAll('.b9-limit-v0')], ww: [...fig.querySelectorAll('.b9-limit-vw')]
  };
  function apply(st) {
    const inf = st.c === 'inf', dyn = st.w === 'dyn';
    for (const C of cards) {
      const gone = inf && C.k !== 'L', kept = inf && C.k === 'L';
      if (C.mute) { show(C.full, !gone); show(C.mute, gone); }
      show(C.badge, inf);
      C.scale.style.color = gone ? 'var(--muted)' : 'var(--fg)';
      C.el.style.borderColor = kept ? 'var(--c-photon)' : 'var(--rule)';
      C.el.style.boxShadow = kept ? '0 0 0 1px var(--c-photon)' : 'none';
      if (C.k === 'L') C.svg.setAttribute('aria-label', C.S.aria + (inf ? KEPT : ''));
    }
    dims.forEach(el => { el.style.opacity = inf ? '1' : '0.58'; });   // dimmed, but its text stays legible in both themes
    show(els.h0, !inf); show(els.h1, inf);
    els.w0.forEach(el => show(el, !dyn));
    els.ww.forEach(el => show(el, dyn));
    show(els.r4, !inf); show(els.r1, inf);
  }
  apply({ c: 'fin', w: 'stat' });

  EPP.controls(q('.b9-limit-ctrls'), [
    { key: 'c', type: 'seg', label: 'speed of light', options: [['fin', 'finite'], ['inf', 'c → ∞']], value: 'fin' },
    { key: 'w', type: 'seg', label: 'screening', options: [['dyn', 'ω kept'], ['stat', 'ω = 0']], value: 'stat' }
  ], apply);
  // the symbols on the buttons in italic, as in the text
  const I = (t) => `<i style="font-family:var(--font-text)">${t}</i>`;
  const BTN = { 'c-inf': `${I('c')} → ∞`, 'w-dyn': `${I('ω')} kept`, 'w-stat': `${I('ω')} = 0` };
  for (const k in BTN) { const b = document.getElementById(`${fig.id}-${k}`); if (b) b.innerHTML = BTN[k]; }
  q('.b9-limit-ctrls').querySelectorAll('.seg button').forEach(b => { b.style.flex = '1 1 auto'; });   // the buttons fill the stretched segment

  // previewed outside Section B.9 (the figure test), the cited equations and Section B.6 are absent: show their labels as text
  if (!fig.closest('#b-electrostatic')) {
    const TAG = { 'b9-eq-free': 'B9.1', 'b9-eq-limit': 'B9.5', 'b9-eq-We': 'B9.6', 'b9-eq-piph': 'B9.8', 'b9-eq-gl': 'B9.12', 'b9-eq-Lpm': 'B9.18' };
    fig.querySelectorAll('a[href^="#"]').forEach(a => {
      const id = (a.getAttribute('href') || '').slice(1);
      if (document.getElementById(id)) return;
      const s = document.createElement('span');
      if (a.classList.contains('eqref')) s.textContent = '(' + (TAG[id] || id) + ')'; else s.append(...a.childNodes);
      a.replaceWith(s);
    });
  }
})();
</script>
